id: prop-084
title: "Linkare schema-migrations.md dal grid di databases/fondamentali/_index.md"
type: fix-relation
priority: high
target_file: docs/databases/fondamentali/_index.md
effort: small
description: |
  docs/databases/fondamentali/schema-migrations.md ("Schema Migrations —
  Flyway, Liquibase, Atlas, golang-migrate") ha `parent:
  databases/fondamentali/_index` nel frontmatter ma non è linkato dal corpo
  di docs/databases/fondamentali/_index.md — verificato con grep sull'intero
  body: zero match su "schema-migrations.md". Gli altri 5 figli del sotto-hub
  (acid-base-cap, modelli-dati, indici, transazioni-concorrenza, sharding)
  sono tutti presenti nella sezione "## Argomenti"; schema-migrations è stato
  aggiunto dopo e non incluso nel grid.
  Aggiungere una entry nella sezione "## Argomenti" di
  docs/databases/fondamentali/_index.md, stesso stile delle altre
  (`### [Titolo](link.md)` + paragrafo descrittivo breve). Esempio:
  ```
  ### [Schema Migrations](schema-migrations.md)
  Flyway, Liquibase, Atlas, golang-migrate. Migrazioni versionate/imperative
  vs declarative/state-based, rollback, drift detection, expand-and-contract
  per zero-downtime migration.
  ```
rationale: |
  Chi apre l'hub fondamentali/ per farsi un quadro dei concetti base sui
  database non trova schema-migrations.md — nonostante sia un tema
  operativo di uso quotidiano (ogni pipeline CI/CD che tocca uno schema DB
  lo usa). Lo troverebbe solo passando da `related` di
  transazioni-concorrenza.md o da search diretta. Stesso pattern strutturale
  già rilevato in dev/api, dev/resilienza, dev/integrazioni e ci-cd/_index
  (vedi prop-083) — quinto caso consecutivo, rafforza ulteriormente il caso
  per una checklist "aggiorna il grid del genitore" nel protocollo 1️⃣.
utility_test:
  reader: "DevOps/developer che apre databases/fondamentali/ per orientarsi sui concetti base dei database"
  scenario: "Deve introdurre un migration tool in un progetto e vuole prima capire le due filosofie (versioned vs declarative) e i rischi di rollback/drift"
  outcome: "Trova schema-migrations.md direttamente dal grid dell'hub, senza dover sapere già che esiste"
  without_kb: "Naviga a caso tra i file di databases/postgresql o ci-cd finché non lo trova per caso via related, o lo cerca esternamente su Flyway/Liquibase docs"
  score: high
tags: [databases, hub-connectivity, fix-relation, navigazione]
last_analyzed: 2026-09-27
