id: prop-080
title: "Collegare dev/api/_index.md al suo unico figlio rest-openapi.md"
type: fix-relation
priority: high
target_file: docs/dev/api/_index.md
effort: small
description: |
  docs/dev/api/_index.md (hub "API Design", 720 righe) non contiene NESSUN
  link verso docs/dev/api/rest-openapi.md — verificato con grep su tutto il
  file, zero occorrenze di "rest-openapi". Il file esiste, ha frontmatter
  completo (status: complete), ma è irraggiungibile navigando dall'hub: un
  lettore che apre "API Design" per cercare la guida REST/OpenAPI concreta
  non trova alcun link e deve affidarsi alla search full-text.
  Aggiungere in dev/api/_index.md una sezione "Sezioni" / "Contenuti" (stile
  già usato in altri hub come dev/linguaggi/_index.md o dev/runtime/_index.md,
  righe ~23-24 di quest'ultimo) con un elenco puntato:
  - [REST & OpenAPI](rest-openapi.md) — descrizione breve (1 riga) di cosa
    contiene (es. versionamento REST, OpenAPI spec, HATEOAS, error handling).
  Aggiornare anche `related` nel frontmatter se rest-openapi.md ha un proprio
  slug indicizzabile (verificare frontmatter di rest-openapi.md).
rationale: |
  Stesso pattern di gap già corretto in prop-078 (containers/kubernetes/_index.md,
  4 figli orfani) e prop-079 (helm cross-link): un hub aggiornato con nuovi
  figli senza aggiornare la propria grid di navigazione. Qui è ancora più
  grave perché rest-openapi.md è l'UNICO figlio della sezione API Design —
  l'hub esiste ma non porta da nessuna parte.
utility_test:
  reader: "Developer che deve versionare un'API REST in modo backward-compatible"
  scenario: "Apre dev/api/_index.md (hub API Design) cercando esempi concreti di OpenAPI spec e versionamento"
  outcome: "Trova il link a REST & OpenAPI e arriva direttamente alla guida pratica, senza dover usare la search"
  without_kb: "Deve affidarsi alla ricerca full-text del sito o scorrere l'intero indice categorie sperando di indovinare il nome file"
  score: high
tags: [connettivita, hub, navigazione, api, fix-relation]
last_analyzed: 2026-09-27
