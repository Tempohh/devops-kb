id: prop-070
title: "iac/_index.md: percorso di apprendimento ferma ad Ansible, ignora Pulumi/Crossplane"
type: extend-section
priority: low
target_file: docs/iac/_index.md
effort: small
description: |
  La tabella "Strumenti Coperti" di iac/_index.md elenca 4 strumenti
  (Terraform, Ansible, Pulumi, Crossplane), ma "## Percorso di
  Apprendimento" si ferma al punto 4 (Ansible Fondamentali) e non
  menziona affatto Pulumi o Crossplane, pur avendo entrambi sezioni
  complete e sviluppate (Pulumi: fondamentali, stacks-ambienti,
  policy-as-code; Crossplane: fondamentali). Un lettore che segue il
  percorso suggerito in sequenza non viene mai indirizzato ai due
  strumenti, nonostante siano presentati come pari nella tabella.
  Estendere il percorso con 2 punti, ad es.:
  5. **Pulumi Fondamentali** — quando preferire un linguaggio reale a HCL
  6. **Crossplane Fondamentali** — quando l'astrazione self-service via Kubernetes ha senso
rationale: |
  Piccola incoerenza tra la tabella comparativa (4 strumenti pari
  livello) e il percorso guidato (si ferma a 2). Basso sforzo, chiude
  un gap di aspettativa per chi usa l'_index come guida sequenziale
  invece che come indice puro.
utility_test:
  reader: "DevOps che arriva per la prima volta alla sezione IaC e segue il percorso di apprendimento suggerito in ordine"
  scenario: "Vuole sapere, dopo Terraform/Ansible, quale sia il prossimo passo logico tra gli strumenti IaC alternativi"
  outcome: "Trova un punto 5 e 6 che lo indirizzano a Pulumi e Crossplane invece di fermarsi credendo che la sezione finisca lì"
  without_kb: "Dovrebbe notare da solo, leggendo la tabella sopra, che esistono altri due strumenti non citati nel percorso"
  score: low
tags: [iac, connettività, navigazione, pulumi, crossplane]
last_analyzed: 2026-09-27
