id: prop-046
title: "Consolidare/collegare containers/kubernetes/networking.md con l'hub networking/kubernetes"
type: consolidate
priority: medium
target_file: docs/containers/kubernetes/networking.md
effort: medium
description: |
  `docs/containers/kubernetes/networking.md` (status: needs-review, creato
  2026-09-26) e `docs/networking/kubernetes/_index.md` + le sue foglie
  (cni.md, ingress.md, network-policies.md; status: complete, dal
  2026-03-09) coprono in larga parte lo stesso territorio: CNI plugin
  (Calico/Cilium/Flannel), Service types, Ingress Controller, NetworkPolicy,
  kube-proxy. Il file in containers/ è inoltre ORFANO: nessun hub lo linka
  (containers/kubernetes/_index.md ha anzi una nota esplicita che rimanda
  SOLO a networking/kubernetes/_index.md per questi temi, riga 67-68) e non
  compare nel `related` di networking/kubernetes/_index.md.
  Azioni da valutare in sede di review/consolidate:
  1. Decidere il confine reale: containers/kubernetes/networking.md potrebbe
     restare come guida "verticale" centrata su kube-proxy/CIDR/kubeadm
     config e troubleshooting DNS/CoreDNS (contenuti non duplicati, es.
     sezione kube-proxy iptables/ipvs, dnsPolicy, CoreDNS troubleshooting),
     tagliando le parti che duplicano CNI/Ingress/NetworkPolicy (già
     coperte meglio con confronti e diagrammi in networking/kubernetes/).
  2. Aggiungere riferimento incrociato bidirezionale: containers/kubernetes/_index.md
     deve linkare anche questo file (non solo l'hub esterno), e
     networking/kubernetes/_index.md deve aggiungere containers/kubernetes/networking.md
     al proprio `related` per il taglio "runtime/CoreDNS" complementare.
  3. Aggiornare `related` di networking/kubernetes/cni.md, ingress.md,
     network-policies.md se il taglio ridotto lascia contenuto specifico
     da referenziare.
rationale: |
  Rischio concreto di drift: due file che descrivono lo stesso CNI/Ingress
  possono divergere nel tempo (uno aggiornato, l'altro no) e confondere chi
  cerca la fonte autorevole. Il file è anche invisibile dalla navigazione
  (nessun hub lo referenzia), quindi il lavoro già investito per scriverlo
  rischia di non essere mai trovato da un lettore reale.
utility_test:
  reader: "DevOps che lavora su un cluster Kubernetes e cerca la guida autorevole su networking (CNI, Ingress, NetworkPolicy, DNS)"
  scenario: "Trova containers/kubernetes/networking.md via ricerca full-text ma non riesce a raggiungerlo navigando da containers/kubernetes/_index.md (che rimanda altrove); non sa se questo file o networking/kubernetes/_index.md è la fonte da usare"
  outcome: "Dopo il consolidamento, ogni contenuto ha un solo posto autorevole per argomento (CNI/Ingress/NetworkPolicy in networking/, dettagli kube-proxy/CoreDNS/runtime in containers/) collegati bidirezionalmente, niente ambiguità o rischio di contenuto disallineato"
  without_kb: "Il lettore dovrebbe confrontare manualmente i due file per capire quale sia aggiornato, o rischiare di seguire istruzioni divergenti"
  score: high
tags: [kubernetes, networking, cni, consolidamento, hygiene]
last_analyzed: 2026-09-27
