id: prop-116
title: "Aggiungere wireguard a related di networking/sicurezza/zero-trust.md"
type: fix-relation
priority: medium
target_file: docs/networking/sicurezza/zero-trust.md
effort: small
description: |
  docs/networking/sicurezza/wireguard.md cita
  `networking/sicurezza/zero-trust` nel proprio `related`, ma
  zero-trust.md (related attuale:
  `[networking/sicurezza/vpn-ipsec, networking/sicurezza/firewall-waf,
  networking/service-mesh/istio, networking/kubernetes/network-policies,
  security/network/zero-trust]`) non reciproca verso wireguard (verificato
  via grep, nessun match). Aggiungere
  `networking/sicurezza/wireguard` e aggiornare `last_updated`.
rationale: |
  WireGuard è spesso adottato come building block per architetture zero
  trust (es. overlay mesh punto-punto); chi legge zero-trust.md dovrebbe
  trovare il collegamento verso l'implementazione VPN moderna già coperta
  dalla KB.
utility_test:
  reader: "DevOps che progetta un'architettura zero trust e legge zero-trust.md"
  scenario: "Cerca opzioni concrete di VPN/overlay per implementare il modello zero trust descritto"
  outcome: "Trova subito il link a wireguard.md come opzione di implementazione"
  without_kb: "Dovrebbe cercare separatamente nella sezione networking/sicurezza sperando di trovare wireguard.md"
  score: medium
tags: [zero-trust, wireguard, connectivity, fix-relation]
last_analyzed: 2026-09-28
