id: prop-111
title: "Relazione asimmetrica: Crossplane cita Operators/CRD ma non viceversa"
type: fix-relation
priority: medium
target_file: docs/containers/kubernetes/operators-crd.md
effort: small
description: |
  `docs/iac/crossplane/fondamentali.md` ha un admonition dedicato ("Kubernetes
  Operators e CRD — Fondamento Tecnico di Crossplane") che rimanda a
  `containers/kubernetes/operators-crd.md` come base tecnica per capire
  Crossplane. Il file target non reciproca: nessun riferimento a Crossplane
  nel testo né in `related`.
  Aggiungere in `operators-crd.md`:
  - `iac/crossplane/fondamentali` al campo `related` del frontmatter
  - un admonition `??? info` nella sezione Relazioni che segnali Crossplane
    come esempio concreto/avanzato del pattern Operator+CRD applicato al
    provisioning di infrastruttura cloud
  Aggiornare `last_updated`.
rationale: |
  Chi legge operators-crd.md per capire il pattern CRD/controller in astratto
  non scopre che Crossplane ne è un'applicazione reale e molto usata in
  platform engineering — un collegamento che aiuterebbe a passare dalla teoria
  a un caso d'uso concreto. Pattern di relazione asimmetrica già rilevato più
  volte nella KB (postgresql #662, opa/zero-trust #668, ebpf/cni #674).
utility_test:
  reader: "Platform engineer che studia il pattern Operator/CRD"
  scenario: "Vuole sapere quali strumenti reali applicano questo pattern al provisioning infrastrutturale"
  outcome: "Trova il collegamento a Crossplane direttamente dal file sui fondamenti Operator/CRD, senza dover già sapere che Crossplane esiste"
  without_kb: "Dovrebbe cercare autonomamente esempi di operator applicati all'IaC"
  score: medium
tags: [crossplane, kubernetes, operators, relazioni]
last_analyzed: 2026-09-28
