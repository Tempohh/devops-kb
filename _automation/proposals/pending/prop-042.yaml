id: prop-042
title: "Aggiungere wireguard.md all'hub networking/sicurezza"
type: extend-section
priority: high
target_file: docs/networking/sicurezza/_index.md
effort: small
description: |
  docs/networking/sicurezza/wireguard.md esiste dal 2026-09-26 ed è completo
  (366 righe: cryptokey routing, confronto con IPsec/OpenVPN, hub-and-spoke,
  site-to-site, full-mesh gestito con Tailscale/Headscale/NetBird, uso in
  Cilium/Calico, deploy su EC2 come alternativa a Site-to-Site VPN AWS, 5
  scenari di Troubleshooting, 4 `related`) ma non compare nella grid/elenco di
  docs/networking/sicurezza/_index.md. Aggiungere una voce nell'hub che lo
  referenzi (titolo, 1 riga descrittiva, link `wireguard.md`), vicino a
  vpn-ipsec.md con cui condivide il confronto diretto.
rationale: |
  Stesso pattern ricorrente in questo ciclo: contenuto completo ma isolato
  dall'hub di categoria. WireGuard è oggi l'alternativa VPN più citata (CNI
  Kubernetes, Tailscale/Headscale) e merita visibilità pari a vpn-ipsec.md
  nell'hub. Nota: `status: draft` nonostante il contenuto superi il gate
  meccanico — da verificare con un task di revisione separato.
utility_test:
  reader: "DevOps che valuta VPN/tunneling per accesso remoto, site-to-site o cifratura pod-to-pod"
  scenario: "Apre l'hub networking/sicurezza per confrontare le opzioni VPN disponibili nella KB"
  outcome: "Trova wireguard.md elencato accanto a vpn-ipsec.md e può confrontare direttamente i due approcci"
  without_kb: "Deve già sapere che il file esiste con quel nome, oppure affidarsi alla ricerca full-text"
  score: high
tags: [networking, sicurezza, vpn, wireguard, connettività, hub]
last_analyzed: 2026-09-27
