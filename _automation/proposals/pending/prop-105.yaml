id: prop-105
type: currency
title: "ci-cd/_index.md — verificare soglie DORA Change Failure Rate contro report più recente"
target_file: docs/ci-cd/_index.md
priority: medium
effort: small
tags:
- ci-cd
- dora-metrics
- currency
description: >
  Durante la review #672 (prop-104) è emerso che la tabella DORA Metrics ha
  High/Medium/Low identici (16-30%) per Change Failure Rate — probabile
  copia-incolla mai corretto, marcato `<!-- REVIEW -->` in loco. Inoltre le
  soglie DORA citate seguono la metodologia a 4 cluster fissi (Elite/High/
  Medium/Low) dei report 2019-2021; i report DORA/Accelerate più recenti
  (2022+) hanno rivisto la metodologia dei cluster. Serve una sessione con
  accesso a fonti esterne aggiornate per: 1) correggere i valori CFR
  duplicati con dati corretti da fonte autorevole, 2) valutare se le 4
  soglie fisse vadano sostituite/annotate con la metodologia più recente.
rationale: >
  Un lettore che usa questa tabella per benchmarking tooling/processi rischia
  di confrontarsi con soglie sbagliate o superate. Correzione richiede
  verifica esterna (no fonte affidabile in memoria del modello con confidenza
  sufficiente), quindi fuori scope per una review normale — da qui la proposta.
utility_test:
  reader: Team lead o SRE che usa la tabella DORA per valutare maturità del proprio processo di delivery
  scenario: Confronta le proprie metriche di Change Failure Rate contro le soglie del file per capire in che cluster si trova
  without_kb: Dovrebbe cercare autonomamente il report DORA/Accelerate più recente e verificare se la metodologia a 4 cluster fissi è ancora quella corrente
  outcome: Soglie corrette e aggiornate, con nota su eventuale cambio di metodologia nei report più recenti
  score: medium
status: pending
last_analyzed: '2026-09-27'
