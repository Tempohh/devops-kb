id: prop-124
title: "Currency check: Managed Databases (RDS/Aurora/Cloud SQL/Cosmos DB)"
type: currency
priority: medium
target_file: docs/databases/kubernetes-cloud/managed-databases.md
effort: small
description: |
  `last_updated: 2026-03-29` — il più vecchio tra tutti i file letti in questa
  sessione su iac/monitoring/databases, e il segmento "managed database" è
  quello con il ciclo di rilascio più veloce da parte dei cloud provider
  (nuove feature Aurora, DSQL, AlloyCB/AlloyDB Omni, Cosmos DB tier).
  Verificare in particolare se il file riflette ancora lo stato corrente di:
  - Amazon Aurora: eventuali novità post Aurora Serverless v2 già coperte
    (es. Aurora Limitless Database per sharding orizzontale gestito)
  - AWS: Amazon Aurora DSQL (distributed SQL serverless, multi-region) se non
    ancora menzionato — rilevante perché cambia il confronto RDS vs Aurora
  - GCP: AlloyDB / AlloyDB Omni se assenti dal confronto multi-cloud
  - Pricing/istanze: nomi di instance family citati (es. db.r6g vs generazioni
    successive) ancora accurati
  Non riscrivere la struttura esistente: il gate è "i fatti citati sono ancora
  veri e completi", non "serve una sezione in più".
rationale: |
  Lettore: DevOps/platform engineer che deve scegliere tra opzioni di database
  managed oggi, non nel Q1 2026. Un file di confronto multi-cloud con fatti
  tecnici stale (nuove opzioni serverless/distribuite non menzionate) porta a
  decisioni subottimali — è esattamente il tipo di contenuto dove la data di
  verifica conta più della struttura.
utility_test:
  reader: "DevOps/platform engineer che valuta un managed database per un nuovo workload multi-cloud"
  scenario: "Deve decidere tra RDS/Aurora, Cloud SQL/AlloyDB, Azure Database, confrontando opzioni serverless/distribuite disponibili oggi"
  outcome: "Ottiene un confronto aggiornato che include le opzioni serverless/distribuite più recenti, senza scoprire dopo il fatto che mancava un'opzione rilevante"
  without_kb: "Deve verificare da zero sui siti dei singoli provider, perdendo il valore del confronto trasversale che il file offre"
  score: medium
tags: [managed-database, rds, aurora, cloud-sql, currency]
last_analyzed: 2026-10-02
