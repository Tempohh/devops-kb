id: prop-076
title: "Collegare trunk-based-development.md e feature-flags.md a ci-cd/strategie/_index.md"
type: extend-section
priority: high
target_file: docs/ci-cd/strategie/_index.md
effort: small
description: |
  L'hub docs/ci-cd/strategie/_index.md ha una sezione "Relazioni" con 3
  admonition collassabili (Strategie di Deployment, Pipeline Security,
  Jenkins Enterprise Patterns) ma NON linka due file figli completi e già
  pubblicati nella stessa cartella: trunk-based-development.md e
  feature-flags.md. Entrambi hanno frontmatter status: complete e parent:
  ci-cd/strategie/_index, ma restano irraggiungibili navigando dall'hub.
  Aggiungere due admonition "??? info" nella sezione Relazioni seguendo lo
  stesso pattern delle altre tre (titolo breve, 1-2 frasi di riassunto,
  link "Approfondimento completo →" al file), oppure aggiungerli come card
  nella grid se si preferisce uniformare lo stile con altri hub della
  categoria ci-cd (es. jenkins/_index.md usa grid cards per tutti i figli).
rationale: |
  Chi: un DevOps mid-senior che naviga la KB partendo dall'hub di categoria
  ci-cd/_index.md → strategie/_index.md per orientarsi sulle strategie CI/CD.
  Problema: due argomenti operativi comuni (trunk-based development e
  feature flags) esistono già con contenuto completo ma non sono
  raggiungibili dalla pagina che dovrebbe elencarli — l'utente deve
  conoscere già il nome del file o usare la ricerca full-text. Questo è
  esattamente il pattern "sotto-hub non aggiornato dopo la creazione di un
  nuovo figlio" segnalato come criticità sistemica nel report di
  saturazione delle ultime sessioni (#624, #627).
utility_test:
  reader: "DevOps mid-senior che valuta come far evolvere una pipeline CI/CD verso trunk-based development o feature flags"
  scenario: "Arriva su ci-cd/strategie/_index.md e si aspetta di trovare link a tutti gli argomenti della sezione, ma vede solo 3 delle 5 pagine figlie"
  outcome: "Trova il link diretto e naviga al contenuto senza dover cercare nel filesystem o nella search"
  without_kb: "Dovrebbe usare la ricerca full-text del sito o indovinare l'URL /ci-cd/strategie/trunk-based-development/"
  score: high
tags: [connettività, hub-navigazione, ci-cd, strategie]
last_analyzed: 2026-09-27
