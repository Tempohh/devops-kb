id: prop-053
title: "Review e promozione status: ipv6-dual-stack.md (AWS)"
type: review
priority: medium
target_file: docs/cloud/aws/networking/ipv6-dual-stack.md
effort: small
description: |
  File status: draft (last_updated 2026-09-26) ma completo: modello di
  indirizzamento IPv6 VPC (/56, /64, GUA, EIGW, NAT64/DNS64), config VPC/
  routing/SG/NACL/Terraform, ALB/Route53/CloudFront dual-stack, EKS IPv6
  (prefix delegation, ip-family immutabile), individuazione costi IPv4
  pubblici post-2024-02-01, tabella troubleshooting con 8 sintomi. 7 related
  ricchi. Azione: verifica tecnica alto ragionamento (limiti attuali NAT64/
  DNS64, versioni minime VPC CNI/AWS LB Controller, costo IPv4 ancora 0.005
  USD/h) e promozione a reviewed + last_verified.
rationale: |
  E' il file target del focus tematico aws/networking di questo ciclo:
  contenuto avanzato e con un driver economico esplicito (costo IPv4
  pubblico) che rende la revisione di accuratezza più critica del solito
  (cifre/versioni possono invecchiare rapidamente).
utility_test:
  reader: "DevOps AWS mid-senior che valuta la migrazione a dual-stack/IPv6-only per ridurre costi IPv4 pubblici o abilitare EKS IPv6"
  scenario: "Deve decidere se e come migrare VPC/ALB/EKS a dual-stack, gestendo NAT64/DNS64 per servizi legacy solo-IPv4"
  outcome: "Applica i comandi AWS CLI/Terraform pronti, evita gli errori comuni (SG solo IPv4, target group IPv4 su ALB dualstack)"
  without_kb: "Dovrebbe ricostruire il flusso da più pagine di doc AWS separate (VPC, EKS, ELB, Route53) senza una vista unificata"
  score: high
tags: [aws, networking, ipv6, dual-stack, review, status]
last_analyzed: 2026-09-27
