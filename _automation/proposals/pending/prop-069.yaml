id: prop-069
title: "monitoring/tools/_index.md non elenca continuous-profiling.md"
type: extend-section
priority: medium
target_file: docs/monitoring/tools/_index.md
effort: small
description: |
  La cartella docs/monitoring/tools/ contiene 6 file oltre all'_index,
  ma la sezione "## Argomenti" ne elenca solo 5 (prometheus, grafana,
  loki, jaeger-tempo, otel-collector-kubernetes, prometheus-scalabilita
  — verificare l'elenco esatto). continuous-profiling.md (il "quarto
  pilastro" dell'observability, Pyroscope/Parca/eBPF profiling)
  è completo e status: complete ma non compare nella lista puntata.
  Aggiungere una riga coerente con le altre:
  - [Continuous Profiling](continuous-profiling.md) — Profiling continuo in produzione, Pyroscope/Parca, flame graph, overhead eBPF
rationale: |
  Continuous profiling è un tema emergente (spesso chiamato "quarto
  pilastro" dell'observability) che un lettore si aspetterebbe di
  trovare elencato accanto a metriche/log/tracce nell'hub Tools,
  non solo scoperto per caso.
utility_test:
  reader: "DevOps/SRE che vuole introdurre profiling continuo per debug di performance in produzione"
  scenario: "Apre monitoring/tools/_index.md per vedere quali tool di observability la KB copre"
  outcome: "Vede continuous-profiling.md nella lista e lo apre direttamente"
  without_kb: "Dovrebbe già sapere il nome esatto del file o usare la ricerca del sito"
  score: medium
tags: [monitoring, observability, profiling, connettività, hub]
last_analyzed: 2026-09-27
