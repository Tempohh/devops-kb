id: prop-114
title: "Reciprocare related in dotnet.md verso 6 file dev/* che lo citano"
type: fix-relation
priority: high
target_file: docs/dev/linguaggi/dotnet.md
effort: small
description: |
  Il campo `related` attuale di dotnet.md è
  `[dev/linguaggi/java-spring-boot, dev/linguaggi/java-quarkus]`.
  Gli stessi sei file che citano java-spring-boot citano anche
  `dev/linguaggi/dotnet`, senza reciproca (verificato via grep, nessun match
  nella direzione opposta):
  - dev/resilienza/circuit-breaker.md
  - dev/resilienza/health-checks.md
  - dev/sicurezza/secrets-config.md
  - dev/sicurezza/tls-da-codice.md
  - dev/integrazioni/database-patterns.md
  - dev/integrazioni/rabbitmq-client.md
  Aggiungere tutti e sei alla lista `related` di dotnet.md e aggiornare
  `last_updated`.
rationale: |
  Stesso gap sistemico di prop-113 ma per .NET: chi consulta dotnet.md non
  trova i pattern operativi che lo usano come esempio (circuit breaker,
  health checks, secrets, TLS, DB, RabbitMQ), pur essendo citato da tutti e
  sei.
utility_test:
  reader: "Sviluppatore .NET che consulta dotnet.md per capire cosa la KB copre"
  scenario: "Vuole sapere se esistono pattern KB su resilienza, secrets o integrazioni DB applicati a .NET"
  outcome: "Trova subito i 6 file correlati dalla pagina del linguaggio"
  without_kb: "Dovrebbe navigare dev/resilienza, dev/sicurezza, dev/integrazioni una per una"
  score: high
tags: [dotnet, connectivity, fix-relation]
