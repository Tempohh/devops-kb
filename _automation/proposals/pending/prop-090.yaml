id: prop-090
title: "Collegare VPC Lattice ai file che referenzia (nessun link inverso)"
type: fix-relation
priority: low
target_file: docs/cloud/aws/networking/vpc-avanzato.md
effort: small
description: |
  docs/cloud/aws/networking/vpc-lattice.md confronta esplicitamente Lattice con
  Transit Gateway/PrivateLink (in vpc-avanzato.md) e con NLB/ALB come target
  group (in elastic-load-balancing.md), e cita la sintassi delle auth policy di
  policies-avanzate.md — ma nessuno di questi tre file elenca vpc-lattice nel
  proprio `related`. Aggiungere `cloud/aws/networking/vpc-lattice` al frontmatter
  `related` di:
  - docs/cloud/aws/networking/vpc-avanzato.md (già confronta TGW/PrivateLink)
  - docs/cloud/aws/networking/elastic-load-balancing.md (NLB/ALB come target Lattice)
  - docs/cloud/aws/iam/policies-avanzate.md (sintassi auth policy condivisa)
  Aggiornare `last_updated` nei 3 file toccati. Nessuna modifica al corpo del
  testo, solo il campo `related` (operazione O(N) su file espliciti, non un
  giro di ristrutturazione).
rationale: |
  Un DevOps che legge vpc-avanzato.md per scegliere tra Transit Gateway e
  PrivateLink non scopre che esiste un'alternativa L7 gestita (VPC Lattice) se
  arriva da quella pagina invece che da vpc-lattice.md — la KB lo obbliga a
  già conoscere Lattice per trovarlo. Il file esiste già ed è maturo (status
  complete, creato/aggiornato in questa sessione); il gap è solo di
  navigabilità, non di contenuto.
utility_test:
  reader: "DevOps che valuta connettività service-to-service multi-account su AWS"
  scenario: "Sta leggendo VPC Avanzato per Transit Gateway/PrivateLink e non sa che esiste un'alternativa L7 gestita"
  outcome: "Dal link in related, scopre VPC Lattice come opzione quando il controllo deve essere per-servizio e non per-subnet"
  without_kb: "Dovrebbe già sapere che VPC Lattice esiste e cercarlo per nome nella ricerca del sito"
  score: medium
tags: [aws, vpc-lattice, networking, connettivita, fix-relation]
last_analyzed: 2026-09-27
