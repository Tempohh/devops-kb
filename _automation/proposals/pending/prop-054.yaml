id: prop-054
title: "Review hub AWS Networking (_index needs-review dopo link aggiunti)"
type: review
priority: medium
target_file: docs/cloud/aws/networking/_index.md
effort: small
description: |
  Il file è stato marcato `needs-review` dal ciclo precedente dopo l'aggiunta
  dei link a Global Accelerator, API Gateway e VPC Lattice (chiusura gap di
  navigazione). Contenuto (quick reference ASCII, tabella comparativa
  connettività) è tecnicamente solido ma non è mai stato certificato da un
  passaggio a ragionamento alto.
  Verificare in review:
  - coerenza tra i 9 item della grid cards e i file target_file reali (tutti
    esistono? nessun link rotto?)
  - la tabella "Confronto Opzioni di Connettività" è aggiornata ai prezzi 2026
    (NAT Gateway, Transit Gateway, PrivateLink, VPC Lattice)
  - `related` del file (oggi solo 2 voci: ec2, network-security) — valutare se
    arricchire con altri hub AWS toccati dai contenuti linkati
  Se tutto corretto: promuovere a `status: reviewed` e impostare `last_verified`.
rationale: |
  Il lettore di un hub di navigazione (DevOps che cerca "che opzione di
  networking AWS uso per X") si fida della tabella comparativa per una
  decisione rapida — un hub mai certificato lascia margine a dati
  obsoleti (prezzi, servizi deprecati) senza che nessuno se ne accorga.
  È nel focus tematico corrente (cloud/aws/networking) e nessun gap di
  contenuto nuovo è emerso in questo ciclo: il valore residuo è qui,
  nell'affidabilità certificata, non in nuovi file.
utility_test:
  reader: "DevOps mid-senior che deve scegliere tra NAT GW/Transit GW/PrivateLink/VPC Lattice per un nuovo progetto AWS"
  scenario: "Apre l'hub AWS Networking per orientarsi rapidamente tra le opzioni prima di approfondire il file specifico"
  outcome: "Si fida della tabella comparativa (costi, latenza, sicurezza) perché il file è certificato reviewed, non solo 'sembra completo'"
  without_kb: "Dovrebbe verificare prezzi e servizi uno per uno sulla documentazione AWS ufficiale, perdendo il vantaggio di avere un confronto già pronto"
  score: medium
tags: [aws, networking, review, hub, vpc]
last_analyzed: 2026-09-27
