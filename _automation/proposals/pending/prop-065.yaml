id: prop-065
title: "Ripristinare relazione bidirezionale dev/linguaggi <-> dev/api, dev/runtime"
type: fix-relation
priority: medium
target_file: docs/dev/linguaggi/_index.md
effort: small
description: |
  docs/dev/linguaggi/_index.md ha `related: []` (vuoto), ma almeno due file
  puntano già a lui in modo asimmetrico:
  - docs/dev/api/_index.md → related include `dev/linguaggi/_index`
  - docs/dev/runtime/_index.md → related include `dev/linguaggi/java-spring-boot`
    e `dev/linguaggi/java-quarkus` (due file specifici della sezione linguaggi)
  Nessuno di questi link ha il corrispondente inverso in `linguaggi/_index.md`.
  Aggiungere a `docs/dev/linguaggi/_index.md`:
  ```yaml
  related: [dev/api/_index, dev/runtime/_index, dev/processi/_index]
  ```
  (incluso anche `dev/processi/_index` per lo stesso motivo — vedi prop-066:
  i linguaggi discussi qui sono l'oggetto del workflow di sviluppo descritto lì).
  Aggiornare `last_updated`.
rationale: |
  CLAUDE.md protocollo 3 (Segnalazione Relazioni) richiede relazioni
  bidirezionali: se A cita B in `related`, B deve citare A. Qui la sezione
  linguaggi/_index è un hub centrale (6 file figli, criteri di scelta comparativi)
  ma appare come "isola" nel grafo delle relazioni pur essendo referenziata da
  altre sezioni. Il lettore che naviga da dev/api o dev/runtime verso
  linguaggi/_index non ha modo di tornare indietro seguendo `related`.
utility_test:
  reader: "DevOps che confronta linguaggi/runtime per un nuovo microservizio, arrivato su linguaggi/_index da un link esterno"
  scenario: "Vuole capire come le scelte di linguaggio si collegano a tuning runtime (dev/runtime) o a API design (dev/api) senza tornare all'indice generale"
  outcome: "Naviga direttamente da linguaggi/_index alle sezioni collegate tramite related, senza dover risalire a dev/_index"
  without_kb: "Deve tornare a dev/_index e cercare manualmente la sezione correlata, perdendo il contesto"
  score: medium
tags: [meta, connettività, dev, linguaggi]
last_analyzed: 2026-09-27
