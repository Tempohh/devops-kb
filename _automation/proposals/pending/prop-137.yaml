id: prop-137
title: "MCP in produzione: server remoti, autenticazione OAuth e sicurezza"
type: new-file
priority: medium
target_file: docs/ai/agents/mcp-produzione.md
effort: medium
description: |
  Guida operativa al deploy di MCP server oltre il caso stdio locale gia' trattato
  in claude-agent-sdk.md (sezione 4). Struttura suggerita:
  - Transport: stdio vs Streamable HTTP, quando usare l'uno o l'altro, sessioni e
    stateless scaling dietro load balancer.
  - Autenticazione/autorizzazione: OAuth 2.1 con resource server MCP, scope minimi,
    token passthrough come anti-pattern, gestione secret (Vault / K8s Secret).
  - Threat model: tool poisoning, prompt injection via tool result, confused deputy,
    rug-pull su tool description; mitigazioni (allowlist, pinning versioni, review
    delle descrizioni, human-in-the-loop sui tool distruttivi).
  - Deployment: container non-root, Deployment K8s + Ingress, NetworkPolicy,
    rate limiting, audit log strutturato delle tool call, osservabilita' (OpenTelemetry).
  - Gateway/registry MCP centralizzato per team, governance dei server approvati.
  - Troubleshooting: timeout SSE/streaming dietro proxy, buffering nginx, 401 su refresh token.
  Esempi: manifest K8s, config nginx per streaming, snippet di validazione token.
rationale: |
  Piattaforme DevOps/platform team stanno mettendo MCP server in produzione per
  esporre Prometheus, K8s, ticketing agli agenti. La KB ha solo un esempio locale
  stdio; mancano sicurezza e operativita' remote. Collega ai, security, containers.
utility_test:
  reader: "Platform engineer mid-senior che espone tool interni ad agenti AI"
  scenario: "Deve pubblicare un MCP server condiviso dal team in modo sicuro su Kubernetes"
  outcome: "Deploya un server Streamable HTTP con OAuth, NetworkPolicy, audit log e difese contro tool poisoning"
  without_kb: "Dovrebbe incrociare spec MCP, RFC OAuth, advisory di sicurezza e doc K8s senza una guida unificata"
  score: medium
tags: [mcp, ai-agents, security, oauth, kubernetes]
last_analyzed: 2026-10-02
