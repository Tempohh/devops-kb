id: prop-039
title: "messaging/_index.md non elenca RabbitMQ tra Strumenti e Piattaforme"
type: extend-section
priority: medium
target_file: docs/messaging/_index.md
effort: small
description: |
  L'hub `docs/messaging/_index.md` ha una sezione "Strumenti e Piattaforme" con
  una sola grid card (Apache Kafka). RabbitMQ è una sezione completa e matura
  (7 file: `_index`, `architettura`, `affidabilita`, `features-avanzate`,
  `clustering-ha`, `deployment`, `vs-kafka` — tutti `status: complete`,
  `difficulty: advanced`) ma non compare da nessuna parte nell'hub di categoria.
  Aggiungere una seconda grid card simmetrica a quella di Kafka:
  ```markdown
  -   :simple-rabbitmq:{ .lg .middle } **RabbitMQ**

      ---

      Message broker AMQP con routing avanzato: exchange, binding, task queue,
      RPC pattern. Smart broker per architetture dove il routing è complesso.

      [:octicons-arrow-right-24: Esplora](rabbitmq/_index.md)
  ```
  Verificare che l'icona `:simple-rabbitmq:` sia supportata dal set Material
  configurato (fallback a `:material-message-processing:` se assente).
rationale: |
  Chi legge: un DevOps che apre la categoria "Messaging" dalla nav principale
  del sito per farsi un'idea di cosa la KB copre su messaging. Con la sola
  card Kafka, l'hub comunica (erroneamente) che la KB tratta solo Kafka —
  RabbitMQ è raggiungibile solo se già si conosce lo slug o si naviga la
  sidebar per esteso. È un gap di connettività puro: il contenuto RabbitMQ
  esiste già, denso e completo, ma è invisibile dal punto di ingresso
  naturale della categoria. Correzione a costo minimo (una card), beneficio
  di scoperta immediato.
utility_test:
  reader: "DevOps che valuta se la KB copre RabbitMQ prima di cercare altrove"
  scenario: "Apre docs/messaging/ dalla home o dalla nav e vede solo Kafka"
  outcome: "Vede subito che anche RabbitMQ è coperto e ci clicca senza dover conoscere l'URL a memoria"
  without_kb: "Deve affidarsi alla ricerca full-text o alla sidebar espansa per scoprire che RabbitMQ esiste nella KB"
  score: high
tags: [messaging, rabbitmq, navigazione, hub, connettivita]
last_analyzed: 2026-09-27
