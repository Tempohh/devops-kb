id: prop-078
title: "Collegare 4 pagine orfane alla grid di containers/kubernetes/_index.md"
type: extend-section
priority: high
target_file: docs/containers/kubernetes/_index.md
effort: small
description: |
  L'hub docs/containers/kubernetes/_index.md ha una grid "Sottosezioni" con
  7 card (Architettura, Workloads, Storage, Scheduling Avanzato, Sicurezza,
  Operators e CRD, Troubleshooting) più una nota separata che linka
  networking.md. Ma nella cartella esistono altri 4 file completi
  (status: complete, parent: containers/kubernetes/_index) che non sono
  raggiungibili né dalla grid né dalla nota né da nessun'altra sezione
  dell'hub:
    - autoscaling.md (HPA/VPA/KEDA/Cluster Autoscaler)
    - ingress.md (Ingress controller, TLS, routing, canary)
    - multi-cluster.md (Cluster API, Rancher/Fleet, Argo CD multi-cluster)
    - resource-management.md (QoS, LimitRange, ResourceQuota)
  Aggiungere 4 card alla grid esistente, seguendo lo stesso formato delle
  altre (titolo breve in grassetto, 1 riga di riassunto, link "→ [Titolo]
  (file.md)"). Esempio per una card:

  -   **Autoscaling**

      HPA, VPA, KEDA, Cluster Autoscaler, custom metrics, scale-to-zero.

      → [Autoscaling](autoscaling.md)

  Ripetere per ingress.md, multi-cluster.md, resource-management.md usando
  il loro frontmatter (title, tags, search_keywords) come base per il
  riassunto di una riga.
rationale: |
  Chi: un DevOps mid-senior o SRE che apre containers/kubernetes/_index.md
  per farsi un'idea di cosa la KB copre su Kubernetes prima di cercare un
  argomento specifico (autoscaling, ingress, gestione multi-cluster,
  resource management).
  Problema: 4 pagine complete e sostanziali su temi molto richiesti in
  produzione (autoscaling, ingress, multi-cluster, resource management)
  sono invisibili dall'hub — l'utente le trova solo se conosce già il nome
  del file o usa la ricerca full-text del sito. È lo stesso pattern
  sistemico segnalato nelle ultime sessioni per docs/ci-cd/strategie e
  docs/ci-cd/testing (prop-076, prop-077), qui però con 4 file orfani in
  un solo hub — il caso peggiore osservato finora.
  Perché ora: il report di saturazione precedente (#630) raccomandava di
  controllare la connettività dei sotto-hub interni di containers/** e
  security/**, mai verificati con questo criterio; security/** è risultata
  pulita ma containers/kubernetes/_index.md ha il gap più grande trovato
  finora nella KB.
utility_test:
  reader: "DevOps mid-senior/SRE che deve impostare autoscaling, ingress o gestione multi-cluster su Kubernetes"
  scenario: "Apre containers/kubernetes/_index.md per orientarsi sulla documentazione K8s disponibile prima di cercare l'argomento specifico"
  outcome: "Vede subito che la KB copre autoscaling, ingress, multi-cluster e resource management e ci arriva con un click, senza dover indovinare l'URL o usare la ricerca"
  without_kb: "Deve usare la ricerca full-text del sito o navigare il repository GitHub per scoprire che questi file esistono"
  score: high
tags: [connettività, hub-navigazione, containers, kubernetes]
last_analyzed: 2026-09-27
