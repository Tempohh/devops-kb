id: prop-033
title: "NGINX e HAProxy: reverse proxy e load balancer in produzione"
type: new-file
priority: high
target_file: docs/networking/load-balancing/nginx-haproxy.md
effort: medium
description: |
  File operativo su NGINX e HAProxy, oggi citati in 12 file di networking ma senza pagina dedicata.
  Struttura: quando scegliere l'uno o l'altro (NGINX web+reverse proxy, HAProxy LB L4/L7 puro).
  Config NGINX: upstream con least_conn/hash, proxy_pass, proxy_set_header, keepalive verso upstream,
  proxy_read_timeout, buffering, limit_req, TLS termination (ssl_protocols, OCSP stapling), map/split_clients per canary.
  Config HAProxy: frontend/backend, acl, health check (option httpchk, check inter/fall/rise), stick-table,
  mode tcp vs http, PROXY protocol, runtime API (socat su admin socket) e drain di un server.
  Reload senza downtime (nginx -s reload, haproxy -sf / master-worker), logging e metriche (stub_status, stats page, exporter Prometheus).
  Troubleshooting: 502/504, upstream keepalive esauriti, "worker_connections are not enough", conntrack, header X-Forwarded-For.
  Collegamenti a algoritmi, layer4-vs-layer7, ha-e-failover, ingress, elastic-load-balancing.
rationale: |
  Il lettore e' un DevOps che deve configurare o debuggare un reverse proxy self-managed (on-prem, EC2, ingress).
  Le pagine di load-balancing spiegano teoria e algoritmi; manca la traduzione in configurazione reale e runbook.
utility_test:
  reader: "DevOps mid-senior che gestisce reverse proxy/LB self-managed su VM o Kubernetes"
  scenario: "Deve mettere NGINX o HAProxy davanti a un servizio con health check, TLS, canary e reload senza downtime, o debuggare 502/504"
  outcome: "Scrive una config produttiva, sceglie lo strumento giusto e diagnostica gli errori comuni"
  without_kb: "Dovrebbe incrociare doc ufficiali NGINX e HAProxy (molto estese) e blog eterogenei, senza il contesto della KB"
  score: high
tags: [nginx, haproxy, reverse-proxy, load-balancing, tls]
last_analyzed: 2026-09-26
