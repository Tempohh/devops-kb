id: prop-106
title: "Fix tabella DORA Change Failure Rate in ci-cd/_index.md (soglie identiche High/Medium/Low)"
type: extend-section
priority: high
target_file: docs/ci-cd/_index.md
effort: small
description: |
  La tabella DORA Metrics nella sezione "DORA Metrics — Misurare la Performance
  DevOps" ha un commento HTML `<!-- REVIEW: ... -->` inline (riga 66) che segnala
  un problema mai risolto nonostante due passaggi di automazione recenti (review
  auto #672, currency auto #673 — vedi git log): la colonna Change Failure Rate
  riporta lo stesso intervallo "16-30%" identico per High, Medium e Low, mentre
  Elite è 0-15%. È quasi certamente un copia-incolla del valore Elite/High.
  Correggere con le soglie correnti da DORA/Accelerate (State of DevOps, dal
  report 2023 in poi la metodologia usa cluster, non soglie fisse identiche per
  3 livelli):
    - Elite: 0-5%
    - High: 5-10%
    - Medium: 10-15%
    - Low: >15% (o "16-30%" solo per Low, non ripetuto 3 volte)
  Verificare il valore esatto sul report DORA/Accelerate più recente citato nei
  Riferimenti del file (o aggiungere un riferimento se manca) prima di scrivere
  i numeri definitivi — non riproporre la stessa tabella senza fonte.
  Una volta corretta la tabella, rimuovere il commento HTML `<!-- REVIEW: ... -->`
  residuo (non deve restare in produzione) e valutare se lo status può tornare
  `complete` (dipende da quanto altro contenuto del file è stato toccato di
  recente dai task #672/#673).
rationale: |
  Il file è l'hub di categoria ci-cd, letto da chiunque cerchi un riferimento
  rapido alle metriche DORA. Un dato palesemente sbagliato (stesso range per 3
  livelli di maturità) mina la credibilità dell'intera sezione ed è stato
  segnalato ma non corretto da due sessioni di automazione consecutive — vale
  la pena un task mirato invece di un ennesimo giro di review generico.
utility_test:
  reader: "DevOps mid-senior che usa la KB come riferimento rapido per DORA metrics in una retrospettiva"
  scenario: "Deve presentare le soglie DORA a un team e cita la tabella della KB"
  outcome: "Ottiene soglie corrette e citabili, senza dover verificare a mano sulla fonte ufficiale"
  without_kb: "Dovrebbe cercare il report DORA/Accelerate originale e derivare le soglie da solo"
  score: high
tags: [ci-cd, dora-metrics, data-quality, needs-review]
last_analyzed: 2026-09-27
