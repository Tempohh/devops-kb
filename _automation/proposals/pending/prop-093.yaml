id: prop-093
title: "Collegare Azure Monitor ai file che lo referenziano (link inverso mancante)"
type: fix-relation
priority: low
target_file: docs/cloud/azure/monitoring/monitor-log-analytics.md
effort: small
description: |
  docs/cloud/azure/database/azure-sql.md (sezione Auditing/Defender, diagnostic
  settings SQL) e docs/cloud/azure/messaging/event-hubs.md (related già cita
  monitor-log-analytics, diagnostic settings ArchiveLogs) puntano entrambi a
  Azure Monitor/Log Analytics come parte del proprio flusso operativo, ma
  docs/cloud/azure/monitoring/monitor-log-analytics.md non li elenca nel
  proprio `related` (attualmente: [cloud/azure/compute/virtual-machines,
  cloud/azure/compute/aks-containers, cloud/azure/security/defender-sentinel]).
  Aggiungere al `related` di monitor-log-analytics.md:
  - cloud/azure/database/azure-sql (diagnostic settings, query KQL SQL-specific)
  - cloud/azure/messaging/event-hubs (diagnostic settings ArchiveLogs, già link in senso opposto)
  Aggiornare `last_updated` in monitor-log-analytics.md. Nessuna modifica al
  corpo testo, solo il campo `related` — operazione O(1) sul file target.
rationale: |
  Un DevOps che apre monitor-log-analytics.md come hub di monitoring non trova
  i due esempi concreti di diagnostic settings già documentati altrove
  (Azure SQL, Event Hubs) — la KB lo obbliga a già sapere che esistono. Stesso
  pattern di gap di connettività già riscontrato per Key Vault e per i file AWS
  vpc-lattice/global-accelerator nelle sessioni precedenti (#651, questa
  sessione).
utility_test:
  reader: "DevOps che configura diagnostic settings per Azure SQL o Event Hubs verso Log Analytics"
  scenario: "Sta leggendo monitor-log-analytics.md come punto di partenza per capire come collegare le risorse Azure al workspace"
  outcome: "Dal related, arriva direttamente agli esempi diagnostic settings già scritti per SQL ed Event Hubs, senza doverli cercare per nome"
  without_kb: "Dovrebbe già sapere che quei file esistono e cercarli per nome nella ricerca del sito"
  score: medium
tags: [azure, monitoring, log-analytics, connettivita, fix-relation]
last_analyzed: 2026-09-27
