id: prop-067
title: "monitoring/sre/_index.md non elenca 4 dei 5 argomenti della sezione"
type: extend-section
priority: high
target_file: docs/monitoring/sre/_index.md
effort: small
description: |
  La cartella docs/monitoring/sre/ contiene 5 file oltre all'_index:
  slo-sla-sli.md, error-budget.md, capacity-planning.md,
  chaos-engineering.md, incident-management.md. L'_index.md attuale
  elenca in "## Argomenti" SOLO slo-sla-sli.md — gli altri 4 file
  esistono, sono completi (status: complete) ma sono raggiungibili solo
  navigando il filesystem/GitHub, non cliccando dalla pagina hub della
  sezione sul sito MkDocs.
  Aggiungere alla tabella/lista "## Argomenti" le voci mancanti, con
  una riga descrittiva breve per ciascuna (stile coerente con la riga
  esistente per slo-sla-sli.md), ad es.:
  - [Error Budget](error-budget.md) — Consumo error budget, burn rate, policy di freeze
  - [Capacity Planning](capacity-planning.md) — Previsione capacità, load testing, scaling
  - [Chaos Engineering](chaos-engineering.md) — Game day, fault injection, blast radius
  - [Incident Management](incident-management.md) — Runbook, postmortem, severità
  Aggiornare anche il campo `related` se i 4 file non sono già
  reciprocamente collegati.
rationale: |
  Un lettore (SRE o DevOps mid-senior) che apre la sezione SRE della KB
  per orientarsi si aspetta di trovare tutti gli argomenti disponibili
  nell'hub di navigazione. Con l'80% dei contenuti invisibile dall'hub,
  la sezione appare più povera di quanto sia in realtà e il contenuto
  esistente (già scritto, completo, verificato) non genera valore perché
  nessuno lo trova navigando il sito.
utility_test:
  reader: "DevOps/SRE mid-senior che apre docs/monitoring/sre/ per capire cosa copre la sezione"
  scenario: "Cerca contenuti su chaos engineering o incident management partendo dall'hub SRE"
  outcome: "Vede subito tutti e 5 gli argomenti disponibili e clicca direttamente su quello utile, senza dover intuire che i file esistono"
  without_kb: "Dovrebbe usare la ricerca full-text del sito o navigare la struttura cartelle su GitHub per scoprire che i file esistono già"
  score: high
tags: [monitoring, sre, connettività, hub, navigazione]
last_analyzed: 2026-09-27
