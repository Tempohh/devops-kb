id: prop-101
title: "opentelemetry.md non menziona il profiling come 4° signal OTel (2025)"
type: extend-section
priority: medium
target_file: docs/monitoring/fondamentali/opentelemetry.md
effort: small
description: |
  Il file continuous-profiling.md (creato/aggiornato il 2026-09-27) afferma
  esplicitamente: "Dal 2025 OpenTelemetry ha stabilizzato il profiling come
  quarto signal (accanto a traces, metrics, logs)" e mostra una pipeline
  Collector con `service.pipelines.profiles`. Il file opentelemetry.md
  (last_updated 2026-03-24) descrive ancora solo "I Tre Pilastri della
  Telemetria" (metriche, log, tracce) senza menzionare il profiling.
  Aggiungere:
  - Una riga/nota nella sezione "Concetti Chiave" → "I Tre Pilastri della
    Telemetria" che segnali il profiling come quarto signal stabilizzato dal
    2025, con rimando esplicito a continuous-profiling.md.
  - Nella sezione "Architettura / Come Funziona" → "OTel Collector", un
    accenno alla pipeline `profiles` accanto a traces/metrics/logs (l'esempio
    YAML del Collector in questo file mostra solo traces/metrics/logs).
  - Aggiungere `monitoring/tools/continuous-profiling` al campo `related`
    del frontmatter (attualmente assente, mentre continuous-profiling.md
    linka già opentelemetry.md — relazione asimmetrica).
rationale: |
  Chi legge opentelemetry.md come riferimento sui "segnali OTel" trova un
  modello concettualmente superato (3 pilastri) rispetto a un file fratello
  della stessa cartella che descrive già il 4° segnale stabilizzato. Un
  DevOps che adotta OTel per il profiling nel 2026 rischia di non capire,
  leggendo solo opentelemetry.md, che il Collector supporta nativamente
  anche questo segnale — dovrebbe scoprirlo per caso in un altro file.
utility_test:
  reader: "DevOps mid-senior che sta valutando quali signal OTel adottare per l'osservabilità di un servizio"
  scenario: "Legge opentelemetry.md come punto di ingresso concettuale e si affida al modello 'tre pilastri' per pianificare l'instrumentazione"
  outcome: "Scopre subito, nel file di riferimento, che il profiling è un quarto segnale OTel stabilizzato e sa dove approfondirlo (continuous-profiling.md) senza doverlo scoprire leggendo un file diverso per caso"
  without_kb: "Dovrebbe leggere entrambi i file per intero e notare autonomamente l'incongruenza, oppure controllare il changelog OTel upstream"
  score: medium
tags: [opentelemetry, observability, profiling, currency, connettivita]
last_analyzed: 2026-09-27
