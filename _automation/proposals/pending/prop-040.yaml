id: prop-040
title: "Aggiungere network-troubleshooting.md all'hub networking/fondamentali"
type: extend-section
priority: high
target_file: docs/networking/fondamentali/_index.md
effort: small
description: |
  docs/networking/fondamentali/network-troubleshooting.md esiste dal 2026-09-26,
  è completo (540 righe, 12 sezioni pratiche, tabella sintomo→causa→comando, 5
  scenari di troubleshooting, 8 `related`, >20 `search_keywords`) ma NON compare
  in nessuna card/elenco di docs/networking/fondamentali/_index.md. Aggiungere
  una voce nella grid/lista dell'hub che lo referenzi (titolo, 1 riga di
  descrizione, link relativo `fondamentali/network-troubleshooting.md`),
  posizionata vicino a dns.md/tcpip.md dato il forte overlap di `related`.
  Verificare anche se altri file della categoria (nat.md, ebpf.md) referenziano
  già questo file nei loro `related` — se sì, nessuna azione lì; altrimenti
  considerare di aggiungerlo (ma resta secondario rispetto al gap principale
  sull'hub).
rationale: |
  Il file risolve un problema operativo reale (metodologia di diagnosi di rete
  a strati) ma resta un'isola: chi arriva sull'hub della categoria non lo trova
  perché non è elencato. Il contenuto esiste già — questo è un gap di
  connettività puro, stesso pattern già rilevato per messaging/_index.md
  (prop-039). Nota aggiuntiva: il file ha `status: draft` nel frontmatter pur
  superando ampiamente i criteri meccanici del gate `complete` (≥150 righe,
  ≥2 code-block, sezione Troubleshooting, ≥10 keyword, ≥2 related) — un task
  di revisione dovrebbe verificarne la correttezza tecnica e promuoverlo a
  `complete`/`reviewed`, ma questo va oltre lo scope di questa singola modifica
  all'hub.
utility_test:
  reader: "DevOps/SRE che apre l'hub networking/fondamentali per orientarsi tra gli argomenti disponibili"
  scenario: "Sta cercando una guida per diagnosticare un problema di rete (DNS/L3/L4/TLS) e naviga l'hub invece di usare la ricerca full-text"
  outcome: "Trova il link a network-troubleshooting.md direttamente dall'hub, senza dover indovinare il nome file"
  without_kb: "Dovrebbe usare la ricerca del sito o scorrere il filesystem `docs/networking/fondamentali/` a mano"
  score: high
tags: [networking, troubleshooting, connettività, hub, manutenzione]
last_analyzed: 2026-09-27
