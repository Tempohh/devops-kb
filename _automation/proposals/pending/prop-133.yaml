id: prop-133
title: "Kubernetes backup e disaster recovery: Velero, etcd snapshot, restore"
type: new-file
priority: high
target_file: docs/containers/kubernetes/backup-disaster-recovery.md
effort: medium
description: |
  Guida operativa al backup/restore di cluster Kubernetes, oggi assente (Velero ha 0 file
  dedicati nella KB, solo 1 riga in una config di audit; etcd backup solo accennato in
  architettura.md).
  Struttura suggerita:
  - Cosa va protetto: stato etcd, risorse API (manifest/CRD), PersistentVolume, secret
    e dati applicativi; perché GitOps NON sostituisce il backup di PV e stato.
  - etcd: `etcdctl snapshot save/status/restore`, certificati, frequenza, restore su
    cluster kubeadm vs managed (EKS/AKS/GKE non espongono etcd: cosa cambia).
  - Velero: installazione (`velero install` + plugin AWS/Azure/GCP/CSI), `Backup`,
    `Schedule`, `Restore`, `BackupStorageLocation`, TTL, hook pre/post (fsfreeze,
    pg_start_backup), CSI snapshot vs file-system backup (Kopia), restore parziale
    e remapping di namespace/storage class.
  - Consistenza applicativa per database su K8s (rimando a db-su-kubernetes e backup-pitr).
  - Pattern DR: RPO/RTO, cluster warm/cold standby, restore cross-region, test periodico
    di restore (game day), runbook.
  - Troubleshooting: backup `PartiallyFailed`, volumi non snapshottati, restore che
    lascia PVC in Pending, drift di versione API/CRD, secret credenziali BSL.
  Esempi concreti con comandi reali e manifest YAML per Schedule e hook.
rationale: |
  Il lettore e' chi gestisce cluster di produzione e deve rispondere a "se perdo il
  cluster o un namespace, in quanto tempo e con quali dati torno operativo?". La KB
  copre kafka disaster-recovery, backup-pitr dei DB, multi-cluster e GitOps, ma non il
  livello Kubernetes che li lega. Gap trasversale, non simmetria formale.
utility_test:
  reader: "SRE/DevOps mid-senior che gestisce cluster Kubernetes in produzione"
  scenario: "Deve definire e testare una strategia di backup e restore per cluster e PV, con RPO/RTO dichiarati"
  outcome: "Configura Velero con schedule e hook, esegue uno snapshot etcd e un restore verificato, e scrive il runbook DR"
  without_kb: "Dovrebbe incrociare la doc di Velero, quella di etcd e quella dei CSI driver, senza il filo conduttore RPO/RTO e le insidie del restore"
  score: high
tags: [kubernetes, backup, disaster-recovery, velero, etcd]
last_analyzed: 2026-10-02
