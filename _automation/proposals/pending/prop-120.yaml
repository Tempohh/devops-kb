id: prop-120
title: "Fix relazione: state-management.md non ricambia link da ci-cd.md e testing.md"
type: fix-relation
priority: medium
target_file: docs/iac/terraform/state-management.md
effort: small
description: |
  Aggiungere `iac/terraform/ci-cd` e `iac/terraform/testing` al campo `related`
  del frontmatter di `state-management.md` (attualmente:
  [iac/terraform/fondamentali, iac/terraform/moduli, cloud/aws/compute/ec2,
  cloud/aws/iam/_index]).
  Aggiungere due blocchi admonition nella sezione "Relazioni":

    ??? info "Terraform CI/CD — Backend Remoto come Prerequisito"
        Il workflow PR-based (Atlantis o GitHub Actions) si appoggia sempre
        a un backend remoto con locking: senza state condiviso, l'apply
        automatico dalla CI non è sicuro con più di un contributore.

        **Approfondimento completo →** [Terraform CI/CD](ci-cd.md)

    ??? info "Terraform Testing — Verifica dello State"
        `terraform plan -refresh-only` (drift detection) e i test di
        integrazione con `terraform test` o Terratest operano sullo stesso
        state remoto: capire locking e backend è prerequisito per non
        introdurre race condition nei test paralleli.

        **Approfondimento completo →** [Terraform Testing e Quality Gate](testing.md)

  Aggiornare `last_updated`.
rationale: |
  Sia `ci-cd.md` (related include iac/terraform/state-management, con
  admonition dedicata "Terraform State Management — Backend e Locking") sia
  `testing.md` (related include iac/terraform/state-management) puntano a
  state-management.md, ma il file non ricambia in nessuno dei due casi.
  Verificato leggendo per intero tutti e tre i file in questa sessione: è
  un'asimmetria reale, non simmetria formale — un lettore di
  state-management.md che vuole sapere come automatizzare apply in CI o come
  interagisce lo state con i test di integrazione non trova il rimando.
utility_test:
  reader: "DevOps mid-senior che sta introducendo automazione CI/CD per Terraform in un team che finora ha applicato da locale"
  scenario: "Ha appena configurato il backend S3+DynamoDB leggendo state-management.md e ora deve capire come collegarlo a un workflow Atlantis/GitHub Actions senza race condition sul lock"
  outcome: "Segue il link a ci-cd.md direttamente da state-management.md invece di scoprirlo per caso"
  without_kb: "Deve leggere l'intero indice della categoria iac/terraform o usare la ricerca full-text sperando di trovare ci-cd.md"
  score: medium
tags: [terraform, iac, state, ci-cd, testing, connettivita]
last_analyzed: 2026-09-28
