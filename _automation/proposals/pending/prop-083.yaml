id: prop-083
title: "Linkare docs/ci-cd/pipeline.md dal grid dell'hub ci-cd/_index.md"
type: fix-relation
priority: high
target_file: docs/ci-cd/_index.md
effort: small
description: |
  docs/ci-cd/pipeline.md ("CI/CD Pipeline — Fondamentali e Architettura") ha
  `parent: ci-cd/_index` nel frontmatter ma non è linkato dal corpo di
  docs/ci-cd/_index.md — verificato con grep sull'intero body, zero match su
  "pipeline.md". È l'unico file di secondo livello del grid (github-actions,
  gitlab-ci, gitops, jenkins, platform-engineering, strategie, testing, tools
  sono tutti linkati correttamente; solo pipeline.md, che vive direttamente
  sotto ci-cd/ senza sottocartella, è stato dimenticato).
  Aggiungere una entry nel grid a card di docs/ci-cd/_index.md, stile identico
  alle altre righe `-   **[Titolo](link)**` con sottotitolo descrittivo breve,
  posizionata per prima (è il topic fondamentale/introduttivo su cui gli altri
  si basano) o subito dopo l'introduzione concettuale della CI/CD.
  Esempio di riga da aggiungere:
  ```
  -   **[Pipeline — Fondamentali](pipeline.md)**

      ---
      Stage, quality gate, artifact, trigger, pipeline as code. Le basi su cui
      si costruiscono Jenkins, GitHub Actions, GitLab CI e gli altri tool.
  ```
rationale: |
  Un lettore che apre l'hub ci-cd/_index.md per farsi un'idea della categoria
  non troverà mai pipeline.md navigando i link — nonostante sia il file più
  "fondamentale" della categoria (concetti di base su cui si costruiscono
  tutti i tool specifici). Lo troverebbe solo per caso via search o `related`
  di un altro file. Questo è il quarto caso dello stesso pattern strutturale
  ("hub non aggiornato dopo la creazione di un figlio") rilevato in sessioni
  consecutive (dev/api, dev/resilienza, dev/integrazioni, ora ci-cd) — la
  ricorrenza rafforza il caso per una checklist permanente nel protocollo di
  creazione argomento (vedi nota nel report di saturazione).
utility_test:
  reader: "DevOps o developer che apre l'hub ci-cd/ per farsi un quadro della categoria"
  scenario: "Vuole capire i concetti base di una pipeline CI/CD prima di scegliere uno strumento specifico"
  outcome: "Trova subito il link a pipeline.md dal grid principale, senza dover indovinare l'URL o passare da un file correlato"
  without_kb: "Deve notare l'assenza, cercare nel filesystem/search, o arrivarci per caso tramite il campo related di un altro articolo"
  score: high
tags: [ci-cd, hub-connectivity, fix-relation, navigazione]
last_analyzed: 2026-09-27
