id: prop-123
title: "MySQL — Connection Pooling e Proxy Layer (ProxySQL)"
type: new-file
priority: medium
target_file: docs/databases/mysql/connection-pooling-proxysql.md
effort: medium
description: |
  MySQL usa un modello thread-per-connection (a differenza del process-per-connection
  di PostgreSQL, ma con costo di memoria per-thread comunque significativo sotto
  carico — ogni connessione tiene buffer di sort/join allocati finché aperta).
  A oggi `docs/databases/mysql/` copre solo architettura/replicazione e performance
  tuning; manca completamente il layer di pooling/proxy, mentre l'equivalente
  PostgreSQL (`postgresql/connection-pooling.md`, PgBouncer) esiste già.
  Struttura suggerita:
  - Perché serve un pooler: max_connections vs memoria (buffer pool vs per-thread
    buffers), thread_cache_size, costo di connessioni effimere da pool applicativi
    serverless/Lambda
  - ProxySQL: query routing (regex-based routing rule), read/write split su
    topologia di replicazione (primary + replica), connection multiplexing,
    query cache, query rewrite, failover-aware (integrazione con Orchestrator/
    Group Replication per detection automatica del primary)
  - Config concreta: esempio `mysql_servers`, `mysql_query_rules`,
    `mysql_replication_hostgroups` in ProxySQL admin interface (porta 6032)
  - Alternative: MaxScale (MariaDB), RDS Proxy per RDS/Aurora MySQL managed
  - Deployment pattern: sidecar vs layer centralizzato, HA del proxy stesso
    (coppia ProxySQL + keepalived/VIP, o ProxySQL Cluster nativo da v2)
  - Troubleshooting: connection storm su riavvio pool, query rule debugging
    (stats_mysql_query_rules), split-brain tra ProxySQL e topologia reale
rationale: |
  Lettore: DevOps/SRE che gestisce MySQL/MariaDB in produzione (self-managed o
  RDS) e deve gestire un numero di connessioni applicative che eccede quanto
  MySQL regge in modo efficiente (tipico in architetture con molti pod/istanze
  stateless, o migrazioni da monolite a microservizi). Oggi nella KB non trova
  nulla sul tema per MySQL, mentre l'equivalente concettuale per Postgres esiste
  già e stabilisce lo standard atteso di profondità per questa sezione.
utility_test:
  reader: "DevOps/SRE mid-senior che opera MySQL/MariaDB in produzione (self-managed o RDS)"
  scenario: "Troppi pod stateless aprono connessioni dirette a MySQL, max_connections sotto pressione o latenza di connessione cresce sotto carico"
  outcome: "Sceglie e configura ProxySQL (o RDS Proxy se managed) con query routing read/write split sulla topologia esistente, senza riscrivere l'applicazione"
  without_kb: "Deve cercare tra documentazione ProxySQL ufficiale (dispersiva, orientata a reference) e articoli sparsi per ricostruire il pattern completo di deployment+HA+routing"
  score: medium
tags: [mysql, mariadb, proxysql, connection-pooling, database, high-availability]
last_analyzed: 2026-10-02
