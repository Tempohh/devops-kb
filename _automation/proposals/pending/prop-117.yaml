id: prop-117
title: "Aggiungere gke a related di cloud/gcp/fondamentali/panoramica.md"
type: fix-relation
priority: medium
target_file: docs/cloud/gcp/fondamentali/panoramica.md
effort: small
description: |
  docs/cloud/gcp/containers/gke.md cita
  `cloud/gcp/fondamentali/panoramica` nel proprio `related`, ma
  panoramica.md (related attuale: `[cloud/aws/fondamentali/global-infrastructure,
  cloud/azure/fondamentali/global-infrastructure,
  cloud/aws/fondamentali/billing-pricing]`) non reciproca verso GKE
  (verificato via grep, nessun match) e non contiene alcun link interno alla
  sezione GCP stessa — punta solo fuori verso AWS/Azure. Aggiungere
  `cloud/gcp/containers/gke` e aggiornare `last_updated`.
rationale: |
  panoramica.md è il file introduttivo di GCP ma non ha nessun link verso i
  servizi GCP concreti della KB (a partire da GKE, il servizio container più
  cercato); chi arriva lì per farsi un'idea della sezione GCP non trova la
  via d'ingresso ai contenuti effettivi.
utility_test:
  reader: "DevOps nuovo su GCP che apre panoramica.md come punto d'ingresso"
  scenario: "Vuole capire quali servizi GCP la KB copre in dettaglio, partendo da containers/Kubernetes"
  outcome: "Trova il link diretto a gke.md dalla pagina di panoramica"
  without_kb: "Dovrebbe navigare l'albero cloud/gcp/ per scoprire da solo che gke.md esiste"
  score: medium
tags: [gcp, gke, connectivity, fix-relation]
last_analyzed: 2026-09-28
