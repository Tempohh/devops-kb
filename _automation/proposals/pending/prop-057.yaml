id: prop-057
title: "Continuous Profiling — il quarto pilastro dell'osservabilità (Pyroscope/Parca/eBPF)"
type: new-file
priority: high
target_file: docs/monitoring/tools/continuous-profiling.md
effort: medium
description: |
  Nessun file della KB copre il continuous profiling, spesso citato come "quarto
  pilastro" accanto a metriche/log/tracce (tre-pilastri-osservabilita.md si ferma
  a tre) e ormai standard in stack cloud-native moderni (Grafana Pyroscope, CNCF
  Parca, Datadog Continuous Profiler). Struttura suggerita:
  - Perché serve: le tracce dicono "quale richiesta è lenta", il profiling dice
    "quale funzione/riga di codice consuma CPU o memoria", a livello di flame
    graph, senza dover redistribuire un binario instrumentato per il debug.
  - Overhead trascurabile (<1-2% CPU) grazie a sampling statistico o eBPF
    (nessuna modifica al codice applicativo, a differenza di pprof manuale).
  - Setup pratico Grafana Pyroscope: agent/eBPF profiler su Kubernetes (DaemonSet),
    push verso Pyroscope server, query e flame graph in Grafana.
  - Alternativa CNCF Parca (agent eBPF, storage columnar, integrazione OTel).
  - OTel Profiling signal (stabilizzato 2025): come si integra con lo stack
    OpenTelemetry già documentato in opentelemetry.md e otel-collector-kubernetes.md.
  - Caso d'uso concreto: trovare un memory leak o un hot loop CPU in produzione
    correlando un picco in Grafana (da Prometheus) con il flame graph dello
    stesso intervallo temporale.
  - Troubleshooting: overhead imprevisto su workload ad alta cardinalità di
    stack, simboli non risolti (debug symbols mancanti nei container), costi di
    storage dei profili ad alta frequenza.
rationale: |
  Il lettore è un SRE/backend engineer che ha già Prometheus+Grafana+tracing
  (ben coperti dalla KB) ma quando un servizio è lento o consuma troppa CPU/RAM
  in produzione non ha uno strumento per capire QUALE funzione è responsabile
  senza redeploy o SSH nel pod. Il continuous profiling è la pratica emergente
  che chiude questo gap operativo, ed è diventato mainstream con l'adozione eBPF
  (zero instrumentation) e la standardizzazione OTel del profiling signal. La KB
  documenta bene i tre pilastri classici ma si ferma esattamente al punto in cui
  serve questo contenuto — è un gap trasversale reale, non simmetria formale.
utility_test:
  reader: "SRE/backend engineer con stack Prometheus+Grafana+Tempo già in produzione, che deve diagnosticare un consumo CPU/memoria anomalo di un servizio"
  scenario: "Un servizio in produzione mostra un picco di CPU intermittente visibile nelle metriche, ma tracce e log non indicano quale funzione o percorso di codice lo causa"
  outcome: "Distribuisce un profiler eBPF (Pyroscope o Parca) come DaemonSet, correla il picco temporale con un flame graph e identifica la funzione responsabile senza modificare o redeployare il codice applicativo"
  without_kb: "Deve scoprire da zero l'esistenza del continuous profiling, confrontare Pyroscope/Parca/Datadog tramite documentazione sparsa di prodotti diversi, senza un punto di ingresso unico coerente con lo stack OTel già in uso"
  score: high
tags: [observability, profiling, pyroscope, parca, ebpf, opentelemetry, sre, performance]
last_analyzed: 2026-09-27
