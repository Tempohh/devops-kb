id: prop-044
title: "Revisione file needs-review in cloud/aws focus: containers-ecs-eks.md"
type: review
priority: medium
target_file: docs/cloud/aws/compute/containers-ecs-eks.md
effort: small
description: |
  Il file ha `status: needs-review` nel frontmatter (modifica significativa
  non ancora chiusa da una revisione). Eseguire il task `review`: verificare
  correttezza tecnica e attualità di comandi/versioni ECS/EKS, coerenza dei
  `related`, e se il contenuto è corretto e completo promuovere lo status a
  `reviewed` impostando anche `last_verified` alla data del controllo. Se
  emergono lacune, aprire eventualmente una proposta di follow-up (`expand`)
  invece di correggere qui.
rationale: |
  Nel ciclo di focus corrente (networking + cloud/aws) è l'unico file di
  cloud/aws rimasto in `needs-review`: chiuderlo mantiene coerente il ciclo di
  vita dello `status` descritto in CLAUDE.md ed evita che un file "a metà"
  resti indefinitamente non verificato, cosa che il freno di saturazione da
  solo non rileva.
utility_test:
  reader: "Chi mantiene la KB (task automation review) o un DevOps che si affida allo status per giudicare l'affidabilità del file"
  scenario: "Deve decidere se fidarsi di containers-ecs-eks.md per un confronto ECS vs EKS in produzione"
  outcome: "Con status reviewed + last_verified sa che il contenuto è stato controllato di recente da un modello ad alto ragionamento"
  without_kb: "Dovrebbe verificare autonomamente ogni comando/versione citato, senza alcun segnale di affidabilità dal frontmatter"
  score: medium
tags: [cloud, aws, containers, ecs, eks, review, status]
last_analyzed: 2026-09-27
