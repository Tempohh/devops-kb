id: prop-109
title: "Relazione asimmetrica: Gateway API cita Linkerd ma Linkerd non cita Gateway API"
type: fix-relation
priority: low
target_file: docs/networking/service-mesh/linkerd.md
effort: small
description: |
  `docs/networking/kubernetes/gateway-api.md` ha una sezione "Relazioni" con
  un admonition collapsibile dedicato a Linkerd ("Service Mesh — Integrazione":
  Istio e Linkerd supportano Gateway API come data plane) e link diretto a
  `../../networking/service-mesh/linkerd.md`. `docs/networking/service-mesh/
  linkerd.md` non ha alcun riferimento a Gateway API né in `related` né nel
  testo (verificato via grep — nessun match).
  Aggiungere `networking/kubernetes/gateway-api` al campo `related` di
  linkerd.md e una riga o admonition che spiega che Linkerd supporta Gateway
  API come alternativa moderna a Ingress per il traffico in entrata verso il
  mesh.
rationale: |
  Stesso pattern di relazione asimmetrica ricorrente nella KB (vedi prop-108,
  #662, #668): il lettore che parte da Linkerd non scopre che Gateway API è
  un'opzione di ingress supportata, mentre chi parte da Gateway API la trova
  già.
utility_test:
  reader: "DevOps che ha già Linkerd come service mesh e valuta come gestire il traffico in ingresso"
  scenario: "Legge linkerd.md cercando opzioni di ingress verso il mesh"
  outcome: "Trova il rimando a Gateway API come alternativa a Ingress supportata nativamente, senza dover cercare la relazione nel file opposto"
  without_kb: "Dovrebbe sapere già che Gateway API esiste e cercarlo separatamente, o consultare la doc ufficiale Linkerd"
  score: medium
tags: [networking, service-mesh, linkerd, gateway-api, connettività]
last_analyzed: 2026-09-27
