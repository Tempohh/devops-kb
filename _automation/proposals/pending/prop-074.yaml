id: prop-074
title: "Collegare dev/runtime e dev/processi all'hub dev/_index.md"
type: fix-relation
priority: high
target_file: docs/dev/_index.md
effort: small
description: |
  docs/dev/_index.md ha una sezione "Macro-Aree" (grid cards) che elenca solo
  7 sotto-aree: Linguaggi & Runtime (link solo a linguaggi/_index.md),
  API Design, Resilienza, Integrazioni, Data Layer, Testing, Sicurezza.
  Mancano due sotto-hub reali e completi (status: complete, contenuto
  sostanziale, non stub):
    - docs/dev/runtime/_index.md ("Runtime & Performance" — JVM tuning,
      GC, heap sizing, profiling)
    - docs/dev/processi/_index.md ("Processi di Sviluppo" — SDLC, git
      workflow, inner/outer loop, developer experience)
  Nessuna delle due è raggiungibile navigando da dev/_index.md: sono isole.
  Azioni:
    1. Aggiungere una card dedicata "Runtime & Performance" nella grid
       (separata da Linguaggi, non annegata nella stessa card) che linki
       a runtime/_index.md.
    2. Aggiungere una card "Processi di Sviluppo" che linki a
       processi/_index.md.
    3. Aggiornare la tabella "Percorsi per Obiettivo" con una riga per
       ciascuna nuova area, se pertinente.
    4. Aggiornare `last_updated`.
rationale: |
  Stesso pattern strutturale già corretto in altre categorie (prop-067..073):
  hub padre non aggiornato quando nasce una nuova sottocartella figlia. Un
  lettore che parte da dev/_index.md (punto di ingresso naturale della
  sezione "Sviluppo Microservizi") non scopre mai che esistono guide su
  tuning JVM o su processi di sviluppo — deve già conoscere l'URL esatto.
utility_test:
  reader: "Developer/DevOps che entra nella sezione dev/ dalla home per capire cosa copre"
  scenario: "Cerca una guida su tuning JVM/GC o su come strutturare il workflow di sviluppo (branching, inner loop) e naviga dall'hub dev/_index.md"
  outcome: "Trova subito le card 'Runtime & Performance' e 'Processi di Sviluppo' nella grid e ci arriva in un click, invece di scoprire i file solo tramite ricerca full-text o link incrociati casuali"
  without_kb: "Deve usare la ricerca del sito o indovinare l'URL /dev/runtime/ o /dev/processi/, perché l'hub di navigazione non li menziona"
  score: high
tags: [connettività, hub, dev, navigazione, fix-relation]
last_analyzed: 2026-09-27
