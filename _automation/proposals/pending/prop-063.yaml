id: prop-063
title: "Aggiungere sezione GraphQL API Design a dev/api/_index.md"
type: extend-section
priority: medium
target_file: docs/dev/api/_index.md
effort: small
description: |
  Il file promette GraphQL ma non lo tratta: il tag `graphql` è presente nel
  frontmatter, la Panoramica del file padre `dev/_index.md` elenca
  "REST, gRPC, GraphQL, AsyncAPI" come i quattro paradigmi trattati, ma il
  corpo del documento copre solo REST, gRPC e AsyncAPI — GraphQL non compare
  in nessuna sezione H2.
  Aggiungere una sezione "## GraphQL API Design" allo stesso livello di
  "## gRPC API Design" e "## AsyncAPI per API Asincrone", con:
  - Quando scegliere GraphQL vs REST/gRPC per microservizi (query flessibili
    lato client, aggregazione multi-servizio, over-fetching/under-fetching)
  - Schema Definition Language (SDL): esempio type/query/mutation per un
    dominio Order/Product coerente con gli altri esempi del file
  - Apollo Federation / GraphQL Federation come pattern di API Gateway per
    aggregare più microservizi in un grafo unico (subgraph/supergraph)
  - N+1 problem specifico di GraphQL e soluzione con DataLoader (batching)
  - Confronto tabellare GraphQL vs REST vs gRPC (stesso stile della tabella
    "Confronto REST vs gRPC" già presente nel file)
  - Un caso di Troubleshooting coerente con lo stile esistente (es. query
    troppo profonde/costose → query complexity limiting)
rationale: |
  Il reader di questo file arriva aspettandosi una copertura equivalente ai
  tre paradigmi già trattati, perché sia i tag che il file padre lo
  promettono esplicitamente. Un DevOps/backend developer che valuta se
  esporre un API Gateway GraphQL davanti a più microservizi (caso comune in
  architetture BFF) oggi non trova nulla in questa sezione nonostante sia
  nominata, e deve cercare altrove — rompendo la promessa di "single source"
  della sezione API Design.
utility_test:
  reader: "Backend developer che deve decidere se esporre un API Gateway GraphQL davanti a più microservizi REST/gRPC esistenti"
  scenario: "Cerca in dev/api/_index.md (che nel titolo/tag promette GraphQL) indicazioni su Federation, N+1 e schema design, ma la sezione non esiste"
  outcome: "Dopo la modifica, valuta Apollo Federation come pattern di aggregazione, riconosce il rischio N+1 e sa mitigarlo con DataLoader, sceglie consapevolmente tra GraphQL/REST/gRPC per il proprio caso"
  without_kb: "Dovrebbe cercare su Apollo/GraphQL Foundation docs, senza il contesto di confronto diretto con REST/gRPC già presente nella KB per lo stesso dominio (Order/Payment)"
  score: high
tags: [graphql, api-design, apollo-federation, dataloader, microservizi]
last_analyzed: 2026-09-27
