id: prop-045
title: "Aggiorna hub docs/networking/_index.md con 7 articoli mancanti dal 2026-02-24"
type: extend-section
priority: medium
target_file: docs/networking/_index.md
effort: small
description: |
  L'hub radice di networking (last_updated: 2026-02-24) precede la creazione di
  7 file oggi presenti e integrati nei rispettivi sotto-hub (fondamentali/,
  protocolli/, service-mesh/, sicurezza/, load-balancing/) ma assenti dalle
  sezioni "Percorsi di Studio" e dalla tabella riepilogativa "Argomenti della
  Sezione" della root: network-troubleshooting.md, nat.md, ebpf.md (fondamentali),
  bgp.md (protocolli), consul.md (service-mesh), wireguard.md (sicurezza),
  nginx-haproxy.md (load-balancing).
  Azioni concrete:
  - Tabella "Argomenti della Sezione": aggiungere le voci mancanti alle celle
    "Argomenti" di Fondamentali, Protocolli, Service Mesh, Sicurezza di Rete,
    Load Balancing (es. riga Fondamentali: aggiungere "NAT, eBPF,
    Troubleshooting").
  - Sezione "Percorsi di Studio" → "Percorso DevOps": inserire
    load-balancing/nginx-haproxy.md come step pratico dopo gli algoritmi.
  - Sezione "Percorso Kubernetes": nessuna modifica necessaria (CNI già
    copre cni.md; eBPF può essere citato come nota a margine di CNI/Cilium).
  - Aggiornare `last_updated` a data odierna.
rationale: |
  L'hub radice è il primo punto di atterraggio per chi esplora la sezione
  networking e la sua tabella riassuntiva è il modo più veloce per capire cosa
  la KB copre senza aprire ogni sotto-hub. I 5 sotto-hub coinvolti sono già
  stati aggiornati (prop-040..043, sessione precedente) ma la root è rimasta
  ferma a 7 mesi fa: chi la consulta oggi sottostima la copertura reale della
  sezione (manca troubleshooting pratico, NAT, eBPF, BGP, Consul, WireGuard,
  Nginx/HAProxy) e rischia di duplicare ricerche già coperte dalla KB.
utility_test:
  reader: "DevOps mid-level che apre docs/networking/_index.md per farsi un'idea di cosa la KB copre prima di cercare un argomento specifico"
  scenario: "Deve risolvere un problema di NAT/conntrack o configurare WireGuard e consulta prima l'indice per capire se esiste già del materiale, senza aprire tutti i sotto-hub"
  outcome: "Vede subito in tabella che network-troubleshooting, NAT e WireGuard esistono già e ci arriva con un click, invece di concludere erroneamente che manchino e cercare altrove"
  without_kb: "Dovrebbe aprire manualmente i 5 sotto-hub o usare la ricerca full-text per scoprire che il contenuto esiste già"
  score: medium
tags: [networking, hub, navigazione, connettivita, manutenzione]
last_analyzed: 2026-09-27
