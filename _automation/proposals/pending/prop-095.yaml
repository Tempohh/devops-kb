id: prop-095
title: "Ansible Fondamentali: related punta a un path CI/CD inesistente"
type: fix-relation
priority: low
target_file: docs/iac/ansible/fondamentali.md
effort: small
description: |
  Il `related` di docs/iac/ansible/fondamentali.md contiene la voce
  `ci-cd/pipeline/github-actions`, che non corrisponde a nessun file reale della
  KB (la struttura effettiva è docs/ci-cd/github-actions/_index.md, verificato
  con Glob). Correggere la voce in `ci-cd/github-actions/_index` (stesso path
  già usato correttamente in docs/iac/ansible/roles-collections.md, che
  referenzia `ci-cd/github-actions/_index` nel proprio `related`).
  Aggiornare `last_updated`. Nessuna modifica al corpo testo, solo il campo
  `related` — operazione O(1) sul file target.
rationale: |
  Un `related` che punta a un path inesistente è peggio di nessun `related`:
  chi segue la KB per struttura di categoria (docs/_metadata/taxonomy.yml,
  navigazione MkDocs) non trova nulla a quel percorso. Il file gemello
  roles-collections.md nella stessa categoria usa già il path corretto,
  confermando che si tratta di un refuso e non di una scelta intenzionale.
utility_test:
  reader: "DevOps che consulta ansible/fondamentali.md e segue related per approfondire l'integrazione CI/CD"
  scenario: "Cerca il collegamento a GitHub Actions indicato nel related del file"
  outcome: "Il related punta al file corretto e apre la pagina GitHub Actions"
  without_kb: "Dovrebbe correggere a mano il path o cercarlo nella navigazione del sito"
  score: low
tags: [ansible, iac, connettivita, fix-relation]
last_analyzed: 2026-09-27
