id: prop-138
title: "Upgrade major PostgreSQL: pg_upgrade vs logical replication blue/green"
type: new-file
priority: medium
target_file: docs/databases/postgresql/major-version-upgrade.md
effort: medium
description: |
  Guida operativa al major upgrade di PostgreSQL (es. 15 -> 17) senza sorprese.
  Struttura: (1) confronto strategie: pg_dump/restore, pg_upgrade (--link/--clone/--check),
  logical replication blue/green (publication/subscription, sequenze da sincronizzare a mano,
  DDL non replicato, large object), managed (RDS/Aurora blue/green deployments, Cloud SQL DMA).
  (2) Checklist pre-upgrade: pg_upgrade --check, compatibilita' estensioni (PostGIS, pgvector,
  timescaledb), cambi di default tra versioni (password_encryption, collation/ICU, glibc),
  repliche slot e prepared transactions. (3) Post-upgrade: vacuumdb --analyze-in-stages perche'
  pg_upgrade non porta le statistiche, REINDEX per cambi collation, update_extensions.
  (4) Rollback plan e tempi di downtime attesi per ciascuna strategia.
  (5) Upgrade su Kubernetes (CloudNativePG import/in-place) con rimando a db-su-kubernetes.
  Esempi con comandi reali e script di cutover con verifica del lag LSN.
rationale: |
  Il DBA/DevOps che deve portare un cluster PostgreSQL fuori supporto (EOL a 5 anni)
  non trova nella KB nulla sul tema: grep "pg_upgrade|postgresql upgrade" = 0 risultati,
  mentre replicazione, vacuum, extensions e backup-pitr sono coperti. E' un'operazione
  rischiosa, ricorrente e con trappole non ovvie (statistiche, sequenze, collation).
utility_test:
  reader: "DevOps/DBA mid-senior che gestisce PostgreSQL self-managed o su RDS"
  scenario: "Deve migrare un cluster di produzione a una major successiva con downtime minimo"
  outcome: "Sceglie la strategia giusta, esegue il cutover con checklist e rollback definito"
  without_kb: "Dovrebbe incrociare docs ufficiali pg_upgrade, wiki logical replication e blog post eterogenei"
  score: medium
tags: [postgresql, upgrade, pg-upgrade, logical-replication, zero-downtime]
last_analyzed: 2026-10-03
