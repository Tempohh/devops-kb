id: prop-049
title: "Nuovo file: AWS Global Accelerator"
type: new-file
priority: medium
target_file: docs/cloud/aws/networking/global-accelerator.md
effort: small
description: |
  AWS Global Accelerator è citato solo di passaggio (3 righe) dentro
  elastic-load-balancing.md come opzione per "IP anycast statici e
  failover multi-regione davanti ad ALB", ma non ha un file dedicato
  (verificato via grep "Global Accelerator" su tutta docs/: unico match
  in elastic-load-balancing.md). È un servizio distinto con modello
  mentale proprio (anycast, edge network AWS, non CDN/cache come
  CloudFront) e casi d'uso ricorrenti in ambienti enterprise/gaming
  multi-regione.
  Struttura suggerita (template standard):
  - Panoramica: differenza netta da CloudFront (anycast per TCP/UDP
    generico vs CDN per contenuti HTTP cacheable) e da Route 53
    failover routing (IP statici vs DNS, failover in secondi vs TTL-bound)
  - Concetti chiave: anycast IP, standard accelerator vs custom routing
    accelerator, endpoint groups, traffic dial, client affinity
  - Configurazione & pratica: esempio CLI/Terraform di creazione
    accelerator con 2 endpoint group (2 region), health check,
    failover test
  - Best practices: quando preferirlo a Route 53 failover (RTO in
    secondi vs minuti), quando NON serve (traffico HTTP cacheable →
    CloudFront è più economico)
  - Troubleshooting: differenza di costo (ore + per-GB data transfer
    premium), errori comuni di health check cross-region
rationale: |
  Chi: cloud architect che deve garantire failover multi-regione con
  RTO molto basso per un servizio TCP/UDP non-HTTP (es. gaming, VOIP,
  IoT) o che vuole IP statici davanti a un ALB.
  Problema: senza un file dedicato, il lettore deve dedurre da una
  menzione di 3 righe dentro elastic-load-balancing.md quando questo
  servizio è la scelta giusta rispetto a CloudFront o Route 53 failover
  routing — un errore di scelta qui costa un redesign architetturale.
  Perché ora: focus tematico della sessione su docs/cloud/aws/; headroom
  disponibile (306/330 file, non satura); il servizio è distinto a
  sufficienza da CloudFront/Route53 da giustificare un file proprio
  invece di essere solo una nota a piè di pagina.
utility_test:
  reader: "Cloud architect che progetta HA multi-regione per un servizio non-HTTP su AWS"
  scenario: "Deve decidere tra Global Accelerator, Route 53 failover routing e NLB multi-regione per un servizio di gioco online con RTO richiesto sotto i 30 secondi"
  outcome: "Capisce il modello anycast di Global Accelerator, quando batte Route 53 failover (RTO) e CloudFront (non-HTTP), e configura un accelerator con endpoint group multi-regione"
  without_kb: "Deve leggere 3+ pagine di documentazione ufficiale AWS separate (Global Accelerator, Route 53, CloudFront) e ricostruire da solo il confronto che nella doc ufficiale non è centralizzato"
  score: medium
tags: [aws, global-accelerator, networking, multi-region, ha, anycast]
last_analyzed: 2026-09-27
