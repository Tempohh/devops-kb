id: prop-104
title: "ci-cd/_index.md needs-review da certificare dopo modifica odierna"
type: review
priority: high
target_file: docs/ci-cd/_index.md
effort: small
description: |
  Il file è l'unico rimasto con `status: needs-review` nell'intera KB (verificato
  con grep su tutto docs/**/*.md — nessun altro file needs-review residuo dopo
  le review di #663/#664/#665). `last_updated: 2026-09-27` (oggi) indica una
  modifica sostanziale recente (probabilmente l'aggiunta della tabella
  "Confronto Strumenti CI/CD" e/o della sezione GitOps vs CI/CD tradizionale).
  Eseguire la review completa: verificare accuratezza delle DORA Metrics
  (soglie Elite/High/Medium/Low), correttezza della tabella comparativa
  strumenti (Jenkins/GitHub Actions/GitLab CI/Azure DevOps/Tekton/Argo
  Workflows/CircleCI/Drone CI), e coerenza dei link nella sezione "Argomenti
  in questa Sezione" con lo stato reale delle sottocartelle. Se il contenuto
  è corretto e attuale, promuovere a `status: reviewed` e impostare
  `last_verified: 2026-09-27` (o data di esecuzione review).
rationale: |
  Segue lo stesso pattern produttivo già osservato in #662 (prop-096/097/098):
  chiudere il debito di certificazione sui file needs-review appena il gate
  meccanico lo segnala, prima che diventi debito accumulato da mesi come è
  successo con cloud/finops/fondamentali.md (needs-review per 6 mesi prima
  della review in #663). Qui il file è stato modificato oggi stesso, quindi
  la review è economica (contesto fresco) rispetto ad aspettare settimane.
utility_test:
  reader: "Qualsiasi lettore che arriva su ci-cd/_index.md come hub della sezione CI/CD"
  scenario: "Si affida ai dati comparativi (DORA metrics, tabella strumenti) per prendere decisioni tecniche o di adozione tooling"
  outcome: "Ha la garanzia (status: reviewed + last_verified) che i dati comparativi sono stati controllati da un modello ad alto ragionamento, non solo che il file supera il gate meccanico"
  without_kb: "Dovrebbe verificare autonomamente l'accuratezza delle soglie DORA e del confronto strumenti confrontando più fonti esterne"
  score: high
tags: [ci-cd, review, needs-review, currency]
last_analyzed: 2026-09-27
