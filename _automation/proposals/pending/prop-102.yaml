id: prop-102
title: "monitoring/_index.md — tabella 'Tre Pilastri' e Tools non citano continuous profiling"
type: extend-section
priority: low
target_file: docs/monitoring/_index.md
effort: small
description: |
  L'indice di categoria descrive il monitoring come "I Tre Pilastri" (metriche,
  log, tracce) e la tabella "Sezioni" cita solo "Prometheus, Grafana, Loki"
  per Tools — ma tools/ contiene anche continuous-profiling.md (quarto
  pilastro/signal, già status: complete). Aggiungere:
  - Una riga alla tabella "I Tre Pilastri" (o una nota subito sotto) per il
    profiling, con link a tools/continuous-profiling.md.
  - Aggiornare la cella "Tools" della tabella "Sezioni" per menzionare anche
    il profiling continuo.
rationale: |
  L'indice di categoria è il primo punto di contatto per chi esplora la
  sezione monitoring/: deve riflettere fedelmente cosa contiene la cartella.
  Un lettore che si ferma all'indice non scopre che esiste già una guida
  completa al profiling continuo (eBPF, Pyroscope, Parca), perché l'indice
  la ignora nella sua stessa mappa concettuale.
utility_test:
  reader: "DevOps che apre monitoring/_index.md per farsi un'idea di cosa offre la KB sull'osservabilità"
  scenario: "Vuole capire se la KB tratta anche il profiling in produzione, oltre a metriche/log/tracce"
  outcome: "Trova subito nell'indice il rimando al file sul continuous profiling, senza doverlo scovare navigando tools/_index.md"
  without_kb: "Dovrebbe navigare manualmente tools/_index.md o usare la ricerca del sito per scoprire che il contenuto esiste già"
  score: low
tags: [monitoring, observability, profiling, navigazione, indice]
last_analyzed: 2026-09-27
