id: prop-058
title: "MySQL/MariaDB — Architettura InnoDB e Replicazione"
type: new-file
priority: high
target_file: docs/databases/mysql/architettura-replicazione.md
effort: medium
description: |
  Nuovo sottoargomento `databases/mysql/` (attualmente inesistente — la KB copre
  PostgreSQL in profondità ma zero MySQL/MariaDB, pur essendo tra gli RDBMS più
  diffusi in produzione). Struttura suggerita:
  - Architettura InnoDB: clustered index su PK, buffer pool, redo log/undo log
    (equivalente concettuale del WAL/MVCC di PostgreSQL ma meccanismo diverso —
    confronto esplicito con `postgresql/mvcc-vacuum.md`)
  - Replicazione: binlog (statement/row/mixed based), GTID-based replication,
    semi-sync vs async
  - Alta disponibilità: Group Replication (nativo MySQL 8) vs Galera Cluster
    (MariaDB/Percona XtraDB) — trade-off multi-master vs single-writer
  - Backup: mysqldump (logical) vs Percona XtraBackup (physical, hot backup) —
    confronto con `replicazione-ha/backup-pitr.md` lato Postgres
  - Comandi reali: `SHOW REPLICA STATUS`, `SHOW ENGINE INNODB STATUS`,
    configurazione GTID (`gtid_mode`, `enforce_gtid_consistency`)
  Aggiungere `mysql` a `docs/_metadata/taxonomy.yml` come sottocategoria di
  `databases` durante la creazione del file.
rationale: |
  Chi legge la KB per PostgreSQL trova copertura enciclopedica (replicazione,
  MVCC, extension, connection pooling) ma chi opera flotte MySQL/MariaDB (comune
  in ambienti legacy, WordPress/CMS, e molte managed offering cloud) non trova
  nulla. Non è simmetria formale: i meccanismi interni (binlog vs WAL, InnoDB
  clustered index vs Postgres heap+index, Group Replication vs streaming
  replication) sono concettualmente diversi e richiedono spiegazione dedicata,
  non un semplice "stesso contenuto con nome diverso".
utility_test:
  reader: "DevOps/DBA che gestisce un cluster MySQL o MariaDB in produzione (es. dietro RDS MySQL, Aurora MySQL, o self-hosted)"
  scenario: "Deve progettare o debuggare una topologia di replica MySQL, o scegliere tra Group Replication e Galera per HA"
  outcome: "Capisce le differenze binlog/GTID, sceglie la strategia HA corretta per il proprio caso, sa quali comandi diagnostici usare"
  without_kb: "Dovrebbe incrociare la documentazione ufficiale MySQL, MariaDB/Galera e Percona (3 fonti separate) per ricostruire lo stesso confronto"
  score: high
tags: [mysql, mariadb, innodb, replication, galera, group-replication, binlog, gtid, backup]
last_analyzed: 2026-09-27
