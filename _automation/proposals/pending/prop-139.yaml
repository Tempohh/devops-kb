id: prop-139
title: "Online schema change su tabelle grandi: lock queue, gh-ost, pt-osc, DDL online"
type: new-file
priority: medium
target_file: docs/databases/fondamentali/online-schema-change.md
effort: medium
description: |
  Guida operativa al DDL senza downtime su tabelle da centinaia di milioni di righe,
  complementare a schema-migrations.md (che copre i tool di versioning, non il
  comportamento del lock a runtime).
  Struttura suggerita:
  - Perche' un ALTER "banale" blocca la produzione: lock queue (un ALTER in attesa
    di ACCESS EXCLUSIVE blocca tutte le query successive), metadata lock MySQL.
  - PostgreSQL: lock_timeout/statement_timeout con retry loop, CREATE INDEX
    CONCURRENTLY (+ bonifica indici INVALID), ADD CONSTRAINT ... NOT VALID +
    VALIDATE CONSTRAINT, ADD COLUMN con default (PG11+ metadata-only), SET NOT NULL
    via CHECK NOT VALID, pg_repack, pgroll.
  - MySQL: ALGORITHM=INSTANT/INPLACE/COPY e LOCK=NONE, quando INSTANT non basta;
    gh-ost (binlog-based, throttling, --postpone-cut-over-flag-file, --test-on-replica)
    vs pt-online-schema-change (trigger-based) vs Vitess/Spirit; impatto su replica lag.
  - Pattern expand/contract applicato al DDL (rename colonna in 4 release), backfill
    in batch con throttling, rollback plan.
  - Troubleshooting: cut-over bloccato da long transaction, replica lag esplosivo,
    foreign key e trigger incompatibili con gh-ost, indice INVALID dopo CONCURRENTLY fallito.
  - Esempi con comandi reali (gh-ost --alter, pt-online-schema-change --dry-run,
    query su pg_stat_activity/pg_locks e performance_schema.metadata_locks).
rationale: |
  Il lettore e' un DevOps/DBA che deve eseguire una migration su una tabella grande in
  produzione. La KB ha 0 menzioni di gh-ost, pt-osc e "online schema change"; il lock
  queue compare solo di sfuggita. E' il punto in cui le migration falliscono davvero
  in produzione, e le info sono sparse tra doc ufficiali PG, MySQL, GitHub e Percona.
utility_test:
  reader: "DevOps/DBA mid-senior che gestisce PostgreSQL o MySQL in produzione"
  scenario: "Deve aggiungere una colonna/indice/vincolo a una tabella da 500M righe senza downtime"
  outcome: "Sceglie la tecnica giusta (INSTANT, CONCURRENTLY, gh-ost), imposta timeout e throttling, e ha un piano di cut-over e rollback"
  without_kb: "Dovrebbe incrociare doc PG, MySQL, repo gh-ost e blog Percona, senza una guida comparativa"
  score: high
tags: [databases, schema-migrations, zero-downtime, mysql, postgresql, gh-ost]
last_analyzed: 2026-10-03
