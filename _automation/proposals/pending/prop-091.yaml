id: prop-091
title: "Collegare AWS Global Accelerator a ELB, Route 53, CloudFront e VPC"
type: fix-relation
priority: low
target_file: docs/cloud/aws/networking/route53.md
effort: small
description: |
  docs/cloud/aws/networking/global-accelerator.md confronta esplicitamente il
  proprio failover-in-secondi con il failover DNS-based di Route 53, si
  posiziona come alternativa/complemento a CloudFront per traffico non
  cacheable, e usa ALB/NLB/VPC come endpoint tipici — ma nessuno di questi 4
  file elenca global-accelerator nel proprio `related`. Aggiungere
  `cloud/aws/networking/global-accelerator` al frontmatter `related` di:
  - docs/cloud/aws/networking/route53.md (confronto diretto failover DNS vs anycast)
  - docs/cloud/aws/networking/cloudfront.md (confronto CDN vs traffico non cacheable)
  - docs/cloud/aws/networking/elastic-load-balancing.md (ALB/NLB come endpoint tipico)
  - docs/cloud/aws/networking/vpc.md (endpoint GA vivono nelle subnet VPC)
  Aggiornare `last_updated` nei 4 file toccati. Solo modifica al campo
  `related`, nessuna riscrittura di sezioni.
rationale: |
  Chi legge route53.md per capire il failover routing non trova menzione di
  Global Accelerator, l'alternativa con RTO in secondi invece che minuti — un
  gap rilevante perché la scelta tra i due è una decisione architetturale
  comune (RTO richiesto vs costo). Il file global-accelerator.md è già
  completo e cita il confronto in prosa; manca solo il collegamento inverso
  per chi entra dalla pagina "opposta".
utility_test:
  reader: "DevOps che deve decidere RTO per un'architettura multi-regione su AWS"
  scenario: "Legge Route 53 failover routing e non sa se il TTL-based failover (minuti) è adeguato o se serve un'alternativa più veloce"
  outcome: "Dal link in related, trova Global Accelerator e valuta il trade-off costo/RTO prima di scegliere"
  without_kb: "Dovrebbe già conoscere Global Accelerator per nome e cercarlo separatamente"
  score: medium
tags: [aws, global-accelerator, networking, failover, fix-relation]
last_analyzed: 2026-09-27
