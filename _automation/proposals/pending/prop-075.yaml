id: prop-075
title: "Collegare gcp/iam e gcp/messaging all'hub cloud/gcp/_index.md"
type: fix-relation
priority: high
target_file: docs/cloud/gcp/_index.md
effort: small
description: |
  docs/cloud/gcp/_index.md ha una sezione "Mappa dei Servizi" (grid cards)
  che elenca solo 5 sotto-aree: Fondamentali, Containers, Dati & Analytics,
  Monitoring & Observability, Storage. Mancano due sotto-hub reali e
  completi (status: complete, contenuto sostanziale, non stub):
    - docs/cloud/gcp/iam/_index.md ("IAM su GCP" — service account,
      permessi, sicurezza accessi)
    - docs/cloud/gcp/messaging/_index.md ("Messaging su GCP" — Pub/Sub,
      event-driven, streaming)
  Nessuna delle due è raggiungibile navigando da cloud/gcp/_index.md.
  Azioni:
    1. Aggiungere una card "IAM" nella grid che linki a iam/_index.md,
       posizionata dopo Fondamentali (coerente con l'ordine logico
       "identità prima di tutto" usato in cloud/aws/_index.md e
       cloud/azure/_index.md, dove IAM/Identità è tra i primi elementi).
    2. Aggiungere una card "Messaging" che linki a messaging/_index.md.
    3. Aggiornare `last_updated`.
rationale: |
  Stesso pattern già corretto in altre categorie/provider (prop-067..073,
  prop-074): hub padre non aggiornato quando nasce una nuova sottocartella
  figlia. Il gap è più marcato che in dev/ perché IAM è un argomento
  cross-cutting (chiunque lavori su GCP lo incontra) e non compare affatto
  nella pagina di ingresso del provider — a differenza di AWS e Azure dove
  IAM/Identità è tra le prime card mostrate.
utility_test:
  reader: "Cloud/DevOps engineer che apre la sezione cloud/gcp/_index.md per farsi un'idea di cosa copre la KB su GCP"
  scenario: "Deve configurare permessi IAM o un topic Pub/Sub su GCP e naviga dall'hub principale per orientarsi, aspettandosi di trovare IAM come nelle pagine equivalenti di AWS e Azure"
  outcome: "Trova le card IAM e Messaging nella grid e arriva alla guida in un click, con la stessa esperienza di navigazione già coerente su AWS/Azure"
  without_kb: "Deve intuire che esiste /cloud/gcp/iam/ o /cloud/gcp/messaging/ senza alcun indizio dall'hub, oppure usare la ricerca full-text"
  score: high
tags: [connettività, hub, gcp, navigazione, fix-relation]
last_analyzed: 2026-09-27
