id: prop-096
title: "Review: FinOps Fondamentali — needs-review da 6 mesi"
type: review
priority: high
target_file: docs/cloud/finops/fondamentali.md
effort: small
description: |
  Il file è in status `needs-review` con `last_updated: 2026-03-29` — è rimasto
  in questo stato per ~6 mesi senza mai passare a `reviewed`, mentre altri file
  needs-review della sessione odierna (#659→#662) sono freschi di modifica.
  Un task `review` (Opus/high) deve:
  - Verificare l'attualità dei prezzi/comandi citati (Reserved Instances,
    Savings Plans, GCP CUD, tool come Infracost/Kubecost) — 6 mesi in ambito
    FinOps sono sufficienti per drift su pricing model o nomi di feature.
  - Controllare i tre blocchi CLI multi-cloud (AWS `ce`/`budgets`, Azure
    `consumption budget`/`policy`, GCP `billing budgets`/BigQuery export) per
    sintassi corrente.
  - Se il contenuto regge, promuovere a `status: reviewed` e impostare
    `last_verified`; se serve aggiornamento, applicarlo e solo poi promuovere.
rationale: |
  Lettore: DevOps/FinOps practitioner che usa questa pagina come riferimento
  operativo per impostare budget/tagging/rightsizing multi-cloud. Un file
  "needs-review" da 6 mesi senza mai essere stato verificato è un debito di
  qualità silenzioso — il ciclo di "quality revisioning" (CLAUDE.md) esiste
  proprio per iniettare task `review` sui file con `last_verified` più
  vecchio, e questo file non ha mai avuto `last_verified`.
utility_test:
  reader: "DevOps/FinOps practitioner che deve impostare cost governance multi-cloud"
  scenario: "Vuole fidarsi dei comandi/prezzi come riferimento diretto, non solo come traccia concettuale"
  outcome: "Ottiene conferma (o correzione) che i comandi e i concetti sono ancora validi nel 2026, con last_verified aggiornato"
  without_kb: "Dovrebbe verificare manualmente su tre console cloud diverse se la sintassi CLI citata è ancora corretta"
  score: high
tags: [finops, review, quality-revisioning, currency]
last_analyzed: 2026-09-27
