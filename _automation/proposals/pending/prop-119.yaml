id: prop-119
title: "Fix relazione: iac/terraform/moduli.md non punta a testing.md"
type: fix-relation
priority: medium
target_file: docs/iac/terraform/moduli.md
effort: small
description: |
  Aggiungere `iac/terraform/testing` al campo `related` del frontmatter di
  `moduli.md` (attualmente: [iac/terraform/fondamentali, iac/terraform/state-management]).
  Aggiungere anche un blocco admonition collapsibile nella sezione "Relazioni"
  che rimandi a testing.md, simmetrico a quello già presente in testing.md:

    ??? info "Terraform Testing — Test dei Moduli Condivisi"
        Un modulo condiviso usato in più progetti dovrebbe avere almeno un test
        Terratest o `terraform test` (.tftest.hcl) che verifica gli output principali.

        **Approfondimento completo →** [Terraform Testing e Quality Gate](testing.md)

  Aggiornare `last_updated`.
rationale: |
  `testing.md` (espanso nella sessione auto #690 con il framework nativo
  `terraform test`) contiene già un blocco "Terraform Moduli — Test dei Moduli
  Condivisi" che rimanda a moduli.md, e nel testo dice esplicitamente "I moduli
  condivisi sono i candidati primari per Terratest". moduli.md non ricambia il
  link: chi legge moduli.md e vuole sapere come testare un modulo condiviso non
  trova il rimando a testing.md. Relazione asimmetrica confermata leggendo
  entrambi i file per intero in questa sessione.
utility_test:
  reader: "DevOps che sta scrivendo un nuovo modulo Terraform condiviso"
  scenario: "Ha letto moduli.md per capire come strutturare il modulo e cerca ora come testarlo prima di pubblicarlo nel registry interno"
  outcome: "Trova il link a testing.md direttamente nella sezione Relazioni di moduli.md, senza dover sapere che esiste un file testing.md separato"
  without_kb: "Deve navigare la sidebar di categoria iac/terraform per scoprire per tentativi che esiste testing.md, o affidarsi al full-text search"
  score: medium
tags: [terraform, iac, testing, moduli, connettivita]
last_analyzed: 2026-09-28
