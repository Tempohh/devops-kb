id: prop-132
title: "SAML e LDAP/Active Directory per SSO enterprise legacy"
type: new-file
priority: medium
target_file: docs/security/autenticazione/saml-ldap-enterprise-sso.md
effort: medium
description: |
  Nuovo file nella categoria `security/autenticazione`, che oggi copre OAuth2/OIDC,
  JWT e mTLS/SPIFFE ma non menziona SAML né LDAP se non di sfuggita (3 file
  networking li citano solo come riferimento a porte/protocolli, zero copertura
  operativa). Struttura suggerita:
  - SAML 2.0: flusso SP-initiated vs IdP-initiated, XML assertion, differenza
    pratica da OIDC (XML+redirect/POST binding vs JSON+token), perché esiste
    ancora: tool enterprise legacy (Jira/Confluence on-prem, alcuni ERP, VPN
    aziendali) e requisiti di certificazione che richiedono SAML esplicitamente.
  - Configurazione concreta: esempio SAML su Grafana o Jenkins con IdP
    (Keycloak come IdP SAML, Okta/Entra ID come alternative enterprise),
    metadata exchange, certificate rotation per firma assertion.
  - LDAP/Active Directory: bind authentication, struttura DN/OU, gruppi AD per
    RBAC (collegamento a `security/autorizzazione/rbac-abac-rebac.md`), LDAPS
    vs StartTLS, perché molti tool self-hosted (GitLab CE, Grafana, Vault)
    supportano ancora LDAP come fallback quando non c'è un IdP OIDC/SAML.
  - Tabella decisionale: OIDC (default per nuovi sistemi) vs SAML (vincolo
    enterprise/legacy) vs LDAP diretto (directory on-prem senza IdP federato) —
    quando è obbligato dal contesto e non una scelta tecnica.
  - Troubleshooting: clock skew su assertion SAML, certificate expiry non
    monitorato, LDAP referral chasing, differenza NTLM vs Kerberos (menzione
    per contestualizzare, no approfondimento separato).
rationale: |
  Molti DevOps che gestiscono tool interni (Grafana, Jenkins, Vault, GitLab)
  in aziende enterprise si scontrano con un vincolo non negoziabile: l'IdP
  aziendale esistente parla SAML o l'directory è LDAP/AD, non OIDC. La KB
  attuale assume implicitamente OIDC come unico meccanismo di federazione
  umana (vedi mappa in `autenticazione/_index.md`), lasciando un reader senza
  risposta quando il vincolo è SAML/LDAP per ragioni organizzative e non
  tecniche.
utility_test:
  reader: "DevOps che deve integrare un tool self-hosted (es. Grafana o
    Jenkins) con l'Identity Provider aziendale esistente, che espone solo
    SAML o un Active Directory on-prem"
  scenario: "Il team di sicurezza aziendale ha già un IdP SAML o un AD/LDAP
    centrale e non è disposto ad abilitare OIDC a breve termine"
  outcome: "Riesce a configurare l'integrazione SAML o LDAP correttamente,
    capendo le differenze di flusso rispetto a OIDC già noto, e a mappare i
    gruppi AD su ruoli RBAC"
  without_kb: "Dovrebbe affidarsi solo alla doc specifica del tool (es. Grafana
    SAML docs) senza un quadro comparativo su differenze di sicurezza/flusso
    rispetto a OIDC già padroneggiato tramite la KB"
  score: medium
tags: [saml, ldap, active-directory, sso, autenticazione, security, identity]
last_analyzed: 2026-10-02
