id: prop-068
title: "monitoring/alerting/_index.md non elenca prometheus-rules.md"
type: extend-section
priority: medium
target_file: docs/monitoring/alerting/_index.md
effort: small
description: |
  La cartella docs/monitoring/alerting/ contiene 2 file oltre
  all'_index: alertmanager.md e prometheus-rules.md. La sezione
  "## Argomenti" dell'_index.md elenca solo Alertmanager.
  prometheus-rules.md (recording/alerting rules PromQL, sintassi,
  best practice) è completo ma invisibile dall'hub di navigazione.
  Aggiungere una riga:
  - [Prometheus Rules](prometheus-rules.md) — Recording rules e alerting rules, sintassi PromQL, gruppi ed evaluation interval
rationale: |
  Chi apre l'hub Alerting per capire come si definiscono le regole
  di alert (prima ancora del routing via Alertmanager) non trova
  il file dedicato se non lo cerca esplicitamente per nome.
utility_test:
  reader: "DevOps che deve scrivere alerting rules Prometheus e cerca la guida nella sezione Alerting della KB"
  scenario: "Apre monitoring/alerting/_index.md aspettandosi di trovare sia il routing (Alertmanager) sia la definizione delle regole"
  outcome: "Trova subito il link a prometheus-rules.md invece di dover indovinare che il contenuto è altrove"
  without_kb: "Dovrebbe cercare nella sezione tools/prometheus.md o usare la search del sito, perdendo il collegamento logico con l'hub Alerting"
  score: medium
tags: [monitoring, alerting, prometheus, connettività, hub]
last_analyzed: 2026-09-27
