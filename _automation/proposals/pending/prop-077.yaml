id: prop-077
title: "Collegare performance-testing.md a ci-cd/testing/_index.md"
type: extend-section
priority: medium
target_file: docs/ci-cd/testing/_index.md
effort: small
description: |
  L'hub docs/ci-cd/testing/_index.md elenca solo 2 argomenti ("Test
  Strategy" e "Contract Testing") in una semplice lista puntata, ma la
  cartella contiene un terzo file completo, performance-testing.md
  (status: complete, parent: ci-cd/testing/_index, contenuto ricco su
  k6/Gatling/soglie SLO), che non è mai menzionato nell'hub. Aggiungere una
  terza riga alla lista "## Argomenti" con link a performance-testing.md,
  seguendo lo stesso formato delle altre due righe (breve descrizione +
  link).
rationale: |
  Chi: un DevOps che vuole capire come integrare performance/load testing
  (k6, Gatling) nella pipeline CI/CD e naviga dalla sezione Testing di
  ci-cd. Problema: il file esiste già con contenuto maturo (k6, Gatling,
  soglie percentile, gate di pipeline) ma è invisibile dall'hub che
  dovrebbe elencarlo — stesso pattern di connettività hub→figli segnalato
  come criticità ricorrente nelle ultime sessioni di analisi (#624, #627).
utility_test:
  reader: "DevOps mid-senior che deve aggiungere un gate di performance testing (k6/Gatling) alla pipeline CI/CD esistente"
  scenario: "Apre ci-cd/testing/_index.md aspettandosi la lista completa degli argomenti di testing in pipeline, ma non vede performance testing nonostante il file esista"
  outcome: "Trova il link e accede direttamente alla guida su k6/Gatling/soglie senza dover indovinare il path del file"
  without_kb: "Dovrebbe scoprire il file per caso via ricerca full-text o esplorando manualmente la struttura docs/ci-cd/testing/"
  score: medium
tags: [connettività, hub-navigazione, ci-cd, testing, performance-testing]
last_analyzed: 2026-09-27
