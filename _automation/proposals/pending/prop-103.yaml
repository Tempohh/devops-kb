id: prop-103
title: "opa.md non reciproca il related verso security/network/zero-trust"
type: fix-relation
priority: low
target_file: docs/security/autorizzazione/opa.md
effort: small
description: |
  docs/security/network/zero-trust.md ha, nel proprio frontmatter `related`,
  la voce `security/autorizzazione/opa` e nel corpo un'admonition dedicata
  ("OPA — Policy Engine per il PDP") che descrive OPA come componente
  cardine del Policy Decision Point in un'architettura Zero Trust.
  docs/security/autorizzazione/opa.md, al contrario, ha `related:
  [security/autorizzazione/rbac-abac-rebac, security/supply-chain/admission-control,
  networking/kubernetes/network-policies]` — nessun riferimento a
  security/network/zero-trust, nonostante il ruolo di OPA come PDP in
  quell'architettura sia descritto proprio nel file zero-trust.md.
  Aggiungere `security/network/zero-trust` al campo `related` di opa.md,
  e opzionalmente una breve admonition collassabile in "Relazioni" che
  rimandi a zero-trust.md come contesto architetturale d'uso di OPA come PDP.
rationale: |
  Stesso pattern di relazione asimmetrica già rilevato in sessioni precedenti
  (postgresql/mvcc-vacuum ↔ connection-pooling, #662). Chi legge opa.md
  isolatamente non scopre che esiste un intero file che inquadra OPA nel
  contesto Zero Trust (PDP/PEP, Istio AuthorizationPolicy, SPIFFE) — deve
  arrivarci passando prima da zero-trust.md.
utility_test:
  reader: "DevOps/security engineer che legge opa.md per capire come deployare OPA"
  scenario: "Vuole capire in quale architettura più ampia si inserisce OPA oltre all'uso puntuale come sidecar o admission webhook"
  outcome: "Trova nel related di opa.md il rimando a Zero Trust Architecture e capisce il ruolo di OPA come Policy Decision Point in quel modello, senza doverlo scoprire per caso in un altro file"
  without_kb: "Dovrebbe navigare l'intera cartella security/ per notare che zero-trust.md cita OPA, cosa non garantita se arriva a opa.md da un link esterno o da ricerca"
  score: low
tags: [opa, zero-trust, security, connettivita, related]
last_analyzed: 2026-09-27
