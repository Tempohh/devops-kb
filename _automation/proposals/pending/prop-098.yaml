id: prop-098
title: "Review: ECS/EKS/Containers AWS — needs-review con annotazioni REVIEW inline"
type: review
priority: medium
target_file: docs/cloud/aws/compute/containers-ecs-eks.md
effort: medium
description: |
  Il file è `status: needs-review` (`last_updated: 2026-09-26`,
  `last_verified: 2026-09-27`) e contiene un commento HTML esplicito
  `<!-- REVIEW: verificare stato App Runner — AWS ha annunciato che non
  accetta nuovi clienti dal 30/04/2026 ... -->` (riga 452) — un segnale
  diretto lasciato per una revisione futura, non ancora chiuso.
  Un task `review` (Opus/high) deve:
  - Verificare lo stato reale di App Runner (accettazione nuovi clienti,
    eventuale sunset) e rimuovere/aggiornare il commento REVIEW con
    l'informazione confermata.
  - Verificare la sezione ECS vs EKS (App Mesh end-of-support 30/09/2026,
    ECS Managed Instances, Karpenter v1 NodePool schema) per coerenza con
    lo stato attuale dei servizi.
  - Se tutto regge dopo la verifica, promuovere a `status: reviewed`.
rationale: |
  Lettore: chi decide tra ECS e EKS per un nuovo workload containerizzato su
  AWS. Un commento REVIEW lasciato inline nel markdown è un debito esplicito
  — il file segnala da solo che contiene un'incertezza non risolta
  (disponibilità App Runner), che è esattamente il tipo di gap che un
  task `review` deve chiudere prima che il file possa considerarsi affidabile.
utility_test:
  reader: "Architect che valuta App Runner vs ECS Fargate per un nuovo servizio"
  scenario: "Deve sapere se App Runner è ancora un'opzione valida per un progetto che parte ora"
  outcome: "Ottiene una risposta verificata invece di un warning generico 'potrebbe non essere disponibile'"
  without_kb: "Dovrebbe cercare annunci AWS recenti per capire lo stato di sunset di App Runner"
  score: medium
tags: [aws, ecs, eks, apprunner, review]
last_analyzed: 2026-09-27
