id: prop-121
title: "Fix relazione: ci-cd/gitops/argocd.md non punta a schema-migrations.md"
type: fix-relation
priority: medium
target_file: docs/ci-cd/gitops/argocd.md
effort: small
description: |
  Aggiungere `databases/fondamentali/schema-migrations` al campo `related` del
  frontmatter di `argocd.md` (attualmente: [ci-cd/gitops/_index, ci-cd/gitops/flux,
  containers/kubernetes/_index, containers/helm/_index, containers/kustomize/_index]).
  Aggiungere anche un blocco admonition collapsibile vicino all'esempio di
  PreSync hook esistente (righe ~506-522, esempio "db-migration"):

  ??? info "Schema Migrations — Strumenti per lo script di migrazione"
      Il PreSync hook sopra esegue `./scripts/migrate.sh`, ma non entra nel
      merito di quale tool usare né delle strategie di rollback/zero-downtime.

      **Approfondimento completo →** [Schema Migrations — Flyway, Liquibase,
      Atlas, golang-migrate](../../databases/fondamentali/schema-migrations.md)

  Aggiornare `last_updated`.
rationale: |
  `schema-migrations.md` include già `ci-cd/gitops/argocd` in `related`
  (il file discute esplicitamente pattern di migrazione DB nei deploy GitOps).
  `argocd.md` contiene un esempio concreto e completo di PreSync hook per
  database migration ma non rimanda a schema-migrations.md, nonostante il
  contenuto si sovrapponga direttamente. Relazione asimmetrica confermata
  leggendo schema-migrations.md per intero e verificando il contenuto di
  argocd.md in questa sessione.
utility_test:
  reader: "DevOps che configura un deploy GitOps con ArgoCD e deve gestire migrazioni schema DB"
  scenario: "Ha appena scritto il PreSync hook con `migrate.sh` e cerca quale tool di migrazione usare e come gestire rollback in un contesto GitOps dichiarativo"
  outcome: "Trova il link a schema-migrations.md direttamente nell'esempio, senza dover cercare per full-text search"
  without_kb: "Deve sapere già che esiste una pagina dedicata sotto databases/fondamentali, oppure affidarsi alla sidebar o al full-text search"
  score: medium
tags: [argocd, gitops, schema-migrations, database, connettivita]
last_analyzed: 2026-09-28
