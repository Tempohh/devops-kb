id: prop-059
title: "Migrazioni di Schema — Flyway, Liquibase, Atlas"
type: new-file
priority: medium
target_file: docs/databases/fondamentali/schema-migrations.md
effort: small
description: |
  Confronto operativo tra i principali tool di schema migration, assente nella
  KB (esiste solo il pattern di deployment "init container" in
  `dev/integrazioni/database-patterns.md`, non il confronto tra tool):
  - Versioned migrations (Flyway, golang-migrate) vs declarative/state-based
    (Atlas, Liquibase in modalità diff)
  - Rollback: quali tool supportano rollback automatico vs richiedono migration
    "down" scritte a mano (Flyway Community non ha rollback automatico —
    trade-off spesso sottovalutato)
  - Migration idempotenti e locking (evitare doppia esecuzione da pod paralleli
    — collegamento esplicito a `dev/integrazioni/database-patterns.md`)
  - Gestione multi-ambiente (dev/staging/prod) e drift detection (Atlas è
    l'unico con diff schema-vs-stato-reale nativo)
  - Esempio comparativo: stessa migration (aggiungi colonna NOT NULL con
    default) espressa nei 3 tool
rationale: |
  Chi introduce schema migration in una pipeline CI/CD deve scegliere tra tool
  con modelli concettuali diversi (versioned vs declarative) e la scelta
  sbagliata costa una migrazione di tool dopo mesi. La KB ha il pattern di
  deployment Kubernetes ma non la scelta "quale tool e perché" — gap operativo
  concreto, non reperibile in un confronto strutturato nella doc ufficiale di
  un singolo tool (ognuno documenta solo se stesso).
utility_test:
  reader: "DevOps che introduce schema migration automatizzate in una pipeline CI/CD per la prima volta, o valuta di cambiare tool"
  scenario: "Deve scegliere tra Flyway/Liquibase/Atlas per gestire migration di uno schema PostgreSQL/MySQL in produzione con rollback sicuro"
  outcome: "Sceglie il tool giusto per il proprio modello (versioned vs declarative) e capisce i limiti di rollback prima di scoprirli in produzione"
  without_kb: "Dovrebbe leggere 3 documentazioni ufficiali separate e ricostruire da solo il confronto rollback/drift-detection"
  score: medium
tags: [schema-migrations, flyway, liquibase, atlas, ci-cd, database-versioning]
last_analyzed: 2026-09-27
