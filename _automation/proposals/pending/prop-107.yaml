id: prop-107
title: "Review di certificazione per monitoring/fondamentali/opentelemetry.md e monitoring/_index.md"
type: review
priority: medium
target_file: docs/monitoring/fondamentali/opentelemetry.md
effort: small
description: |
  Entrambi i file sono stati modificati oggi (2026-09-27, auto #669/#670) per
  risolvere l'asimmetria concettuale con continuous-profiling.md (il "quarto
  pilastro" del profiling ora è menzionato in entrambi). Il contenuto risulta
  già coerente e ben integrato a lettura diretta in questa sessione — nessun
  gap ulteriore trovato. Restano però `status: needs-review` invece di
  `reviewed`, e senza `last_verified`.
  Applicare il task `review` standard: verificare accuratezza tecnica (versioni
  OTel, sintassi YAML del Collector, esempio Go), poi impostare
  `status: reviewed` + `last_verified: <data task>` su entrambi i file se il
  controllo conferma che sono corretti e attuali (come atteso, dato il contesto
  fresco).
rationale: |
  Stesso pattern già osservato e produttivo nelle ultime 2 sessioni (#665
  ci-cd, #668 monitoring/security): un file appena modificato con contesto
  fresco è economico da certificare subito, evitando che resti `needs-review`
  a tempo indefinito e che una sessione futura debba ri-leggere tutto da zero
  per arrivare alla stessa conclusione.
utility_test:
  reader: "Agente di automazione della KB (task review) e DevOps che consulta i due file"
  scenario: "Cerca conferma che il contenuto su OTel/profiling sia stato verificato e non solo scritto da un task automatico"
  outcome: "Trova `status: reviewed` + `last_verified` recente, segnale di affidabilità del contenuto"
  without_kb: "Nessuna alternativa — è un segnale di qualità interno alla KB, non recuperabile da doc ufficiale"
  score: medium
tags: [monitoring, opentelemetry, review, freshness]
last_analyzed: 2026-09-27
