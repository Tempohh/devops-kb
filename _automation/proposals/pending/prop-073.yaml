id: prop-073
title: "Aggiungere AWS Containers alla grid di cloud/aws/_index.md"
type: extend-section
priority: medium
target_file: docs/cloud/aws/_index.md
effort: small
description: |
  La sezione "## Mappa dei Servizi" di `cloud/aws/_index.md` elenca 10 card
  (IAM, Networking, Compute, Storage, Database, Security, Monitoring, CI/CD,
  Messaging, Fondamentali) ma manca la card per `containers/_index.md`
  (Amazon EKS — Elastic Kubernetes Service), che esiste, è `status: complete`
  e ha `last_updated: 2026-03-25`.
  Aggiungere una card coerente con lo stile esistente, es.:
  ```
  - :material-kubernetes: **[Containers](containers/_index.md)**

      Amazon EKS — managed Kubernetes, node groups, Fargate profiles, IRSA
  ```
  Posizionarla logicamente vicino a Compute (che già menziona ECS/EKS in
  `compute/containers-ecs-eks.md` — verificare che non ci sia sovrapposizione
  di scope, il file containers/ tratta EKS in profondità mentre
  compute/containers-ecs-eks.md è il confronto ECS vs EKS ad alto livello).
  Aggiornare anche `last_updated` del frontmatter.
rationale: |
  `containers/_index.md` è raggiungibile solo navigando direttamente l'URL o
  tramite link da `compute/_index.md`/`related`, non dall'hub principale
  cloud/aws/_index.md che un lettore userebbe come punto di ingresso alla
  sezione AWS. Stesso pattern di hub-desync già corretto in prop-067..072
  (monitoring, iac, ci-cd, security), qui trovato per la prima volta nella
  categoria cloud/aws durante il controllo mirato raccomandato dalla sessione
  precedente (#621).
utility_test:
  reader: "DevOps engineer che esplora cloud/aws/_index.md come mappa dei servizi AWS per orientarsi o per prepararsi a una certificazione (es. DOP-C02, che include EKS)"
  scenario: "Cerca dove AWS documenta EKS/Kubernetes managed partendo dall'hub principale della sezione AWS"
  outcome: "Trova subito la card Containers e raggiunge containers/eks.md senza dover indovinare l'URL o passare da compute/"
  without_kb: "Dovrebbe notare che compute/containers-ecs-eks.md menziona EKS solo a livello di confronto e scoprire per caso (o via ricerca full-text) l'esistenza della cartella containers/ separata"
  score: medium
tags: [aws, containers, eks, navigation, hub]
last_analyzed: 2026-09-27
