id: prop-052
title: "Review e promozione status: wireguard.md"
type: review
priority: medium
target_file: docs/networking/sicurezza/wireguard.md
effort: small
description: |
  File status: draft (last_updated 2026-09-26) ma completo: modello Noise,
  confronto con IPsec/OpenVPN, config hub-and-spoke e site-to-site, tool di
  mesh gestito (Tailscale/Headscale/NetBird/Netmaker), uso in Kubernetes
  (Cilium/Calico), deploy EC2 come alternativa a Site-to-Site VPN AWS con
  confronto tabellare, 5 scenari di troubleshooting (handshake, NAT/UDP,
  AllowedIPs, MTU). 7 related verso vpn-ipsec, zero-trust, firewall-waf, nat,
  cni, vpc. Azione: verifica tecnica alto ragionamento (comandi wg/wg-quick,
  valori MTU, flag AWS CLI) e promozione a reviewed + last_verified.
rationale: |
  Contenuto tecnico denso e citato da altri file (cni.md, vpc.md
  potenzialmente) come alternativa moderna a IPsec; un badge reviewed alza la
  fiducia di chi lo userebbe per un deploy VPN reale, incluso il caso EC2.
utility_test:
  reader: "DevOps che deve collegare on-premise a una VPC AWS o cifrare traffico pod-to-pod, valutando WireGuard come alternativa a IPsec gestito"
  scenario: "Deve scegliere tra VPN Site-to-Site AWS e un'istanza EC2 con WireGuard, o abilitare cifratura CNI in cluster"
  outcome: "Sceglie con cognizione di causa (tabella costi/HA/routing) e applica la config hub-and-spoke o site-to-site pronta"
  without_kb: "Dovrebbe unire la doc ufficiale WireGuard (generica) con blog post per il caso specifico EC2/VPC"
  score: medium
tags: [networking, sicurezza, vpn, wireguard, review, status]
