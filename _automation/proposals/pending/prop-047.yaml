id: prop-047
title: "Aggiungere Gateway API a docs/networking/_index.md e kubernetes/_index.md"
type: extend-section
priority: high
target_file: docs/networking/_index.md
effort: small
description: |
  docs/networking/kubernetes/gateway-api.md esiste, è status:complete, ben
  collegato (related a ingress, network-policies, cni, linkerd) ma NON è
  menzionato né in docs/networking/_index.md né in
  docs/networking/kubernetes/_index.md (verificato via Read diretto di
  entrambi i file — nessuna occorrenza di "gateway-api" o "Gateway API").
  Un lettore che segue il "Percorso Kubernetes" consigliato nell'_index
  principale si ferma a Ingress + Network Policies + Service Mesh, senza
  sapere che esiste il successore ufficiale di Ingress (GA in Kubernetes
  dal 1.28, sigs.k8s.io/gateway-api).
  Modifiche minime:
  1. In docs/networking/_index.md: aggiungere una riga nel "Percorso
     Kubernetes" dopo Ingress ("4bis. Gateway API — successore di
     Ingress, HTTPRoute/GRPCRoute/TCPRoute") e nella tabella "Argomenti
     della Sezione" riga Kubernetes Networking (aggiungere "Gateway API"
     all'elenco argomenti).
  2. In docs/networking/kubernetes/_index.md: aggiungere sezione
     "### [Gateway API](gateway-api.md)" nell'elenco "Argomenti in questa
     Sezione", stesso stile delle altre 3 voci, con 2-3 frasi su
     HTTPRoute/GatewayClass e perché è il successore di Ingress.
  Nessuna riscrittura del file gateway-api.md stesso: resta invariato.
rationale: |
  Chi: DevOps che deve scegliere come esporre servizi su un cluster K8s
  recente (1.28+) e segue il percorso di studio ufficiale della KB.
  Problema: la KB possiede già il contenuto ma è invisibile dalla
  navigazione — chi segue gli _index (il percorso "consigliato" nella
  stessa KB) non lo scopre mai, nonostante sia lo standard emergente
  che sta sostituendo Ingress.
  Perché ora: focus tematico corrente della sessione è
  docs/networking/; è un fix di connettività a costo quasi zero
  (2 file, poche righe) con impatto alto sulla scopribilità.
utility_test:
  reader: "DevOps che deve esporre servizi su un cluster Kubernetes 1.28+"
  scenario: "Segue il percorso di studio in docs/networking/_index.md per capire come instradare traffico verso i pod, arriva a Ingress e non sa che esiste un'alternativa più moderna già documentata nella KB"
  outcome: "Trova il link a Gateway API nel percorso di studio, capisce quando preferirlo a Ingress e apre direttamente gateway-api.md già completo"
  without_kb: "Il file esiste ma è raggiungibile solo se il lettore lo trova per caso via ricerca full-text o Glob, non attraverso la navigazione gerarchica della KB"
  score: high
tags: [kubernetes, gateway-api, networking, navigazione, fix-relation]
last_analyzed: 2026-09-27
