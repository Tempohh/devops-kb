id: prop-043
title: "Aggiungere ipv6-dual-stack.md all'hub cloud/aws/networking"
type: extend-section
priority: high
target_file: docs/cloud/aws/networking/_index.md
effort: small
description: |
  docs/cloud/aws/networking/ipv6-dual-stack.md esiste dal 2026-09-26 ed è
  completo (376 righe: modello di indirizzamento IPv6 VPC, EIGW, NAT64/DNS64,
  Happy Eyeballs, config CLI/Terraform, ALB/Route53/CloudFront dual-stack,
  EKS IPv6, individuazione costi IPv4 pubblici, 8 righe di Troubleshooting, 6
  `related`) ma non compare nella grid/elenco di
  docs/cloud/aws/networking/_index.md. Aggiungere una voce nell'hub che lo
  referenzi (titolo, 1 riga descrittiva incentrata sul driver economico —
  costo IPv4 pubblico dal 2024 — link `networking/ipv6-dual-stack.md`),
  posizionata vicino a vpc.md/vpc-avanzato.md.
rationale: |
  Stesso gap di connettività rilevato per gli altri 3 file draft di questo
  ciclo, ma qui nella categoria focus cloud/aws: il file tratta un argomento
  con motivazione economica diretta (addebito IPv4 pubblico AWS) e resta
  invisibile dall'hub. Nota: `status: draft` nonostante il contenuto superi
  il gate meccanico — da verificare con un task di revisione separato.
utility_test:
  reader: "Team AWS che valuta la migrazione a IPv6/dual-stack per ridurre i costi di IPv4 pubblico"
  scenario: "Apre l'hub cloud/aws/networking per vedere se la KB copre già dual-stack e i relativi costi"
  outcome: "Trova ipv6-dual-stack.md elencato e puo' seguire subito la guida a EIGW/NAT64/costi invece di cercare nella doc ufficiale AWS"
  without_kb: "Deve conoscere già il nome del file o cercarlo con il motore di ricerca del sito"
  score: high
tags: [cloud, aws, networking, ipv6, connettività, hub]
last_analyzed: 2026-09-27
