description: "Guida operativa a HashiCorp Packer per costruire immagini immutabili\
  \ (AMI, Azure\nManaged Image / Compute Gallery, GCP image). Oggi la KB ha 0 file\
  \ su Packer\n(grep \"packer\": nessun risultato), nonostante EC2 Auto Scaling e\
  \ Terraform\npresuppongano un'immagine pronta.\nStruttura suggerita:\n- Perche'\
  \ golden image vs configuration-at-boot (cloud-init/Ansible pull): tempi di\n  scale-out,\
  \ drift, reproducibilita'; quando NON usarlo (container-first).\n- Formato HCL2:\
  \ blocchi `packer { required_plugins }`, `source \"amazon-ebs\"`,\n  `build`, provisioner\
  \ `shell`/`ansible`, post-processor `manifest`; comandi\n  `packer init`, `packer\
  \ fmt`, `packer validate`, `packer build -var-file`.\n- Hardening e baseline: CIS\
  \ benchmark nel provisioner, rimozione chiavi SSH/credenziali\n  temporanee, IMDSv2,\
  \ cifratura EBS, copia cross-region/account con `ami_regions`.\n- Pipeline: build\
  \ in GitHub Actions con OIDC (no chiavi statiche), scansione CVE\n  dell'immagine\
  \ (Trivy/Inspector), tagging con commit SHA, test con\n  InSpec/Goss prima della\
  \ promozione.\n- Integrazione con Terraform: `data \"aws_ami\"` con filtro su tag,\
  \ launch template\n  + ASG instance refresh per rollout, rollback sul tag precedente;\
  \ HCP Packer\n  registry per canali (channel) e revoca di immagini vulnerabili.\n\
  - Troubleshooting: timeout SSH/WinRM, `Error waiting for AMI`, VPC/subnet\n  mancante,\
  \ plugin non trovato dopo `packer init`.\n"
