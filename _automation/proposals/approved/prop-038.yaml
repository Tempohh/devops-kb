description: "Consul è citato in 14 file della KB (vault.md, mtls-spiffe.md, concetti-base.md,\n\
  envoy.md, service-mesh/_index.md, prometheus.md, zookeeper-kraft.md, opentofu.md,\n\
  failover-recovery.md, replicazione.md, cassandra.md, entra-id.md, valutazione.md,\n\
  kubernetes/networking.md) solo come esempio di terze parti (riga di tabella in\n\
  concetti-base.md), ma non ha un file dedicato mentre istio.md, linkerd.md ed\nenvoy.md\
  \ sì. Struttura suggerita:\n- Cos'è: service discovery + service mesh (Consul Connect)\
  \ + KV store, agent\n  model (client/server), gossip protocol (Serf) per il cluster\
  \ membership.\n- Differenza pratica dagli altri mesh già documentati (istio.md,\
  \ linkerd.md):\n  Consul non richiede Kubernetes — supporta VM, container e k8s\
  \ nello stesso\n  catalogo di servizi, utile per infrastrutture ibride in migrazione.\n\
  - Kubernetes integration: Consul on Kubernetes (Helm chart), sync catalogo\n  VM\
  \ <-> k8s (catalog sync), sidecar injection via annotation.\n- mTLS: Connect CA\
  \ (Vault come backend opzionale, collegamento a vault.md e\n  mtls-spiffe.md già\
  \ esistenti), intentions per autorizzazione L4/L7.\n- Esempio pratico: registrare\
  \ un servizio VM legacy nel catalogo, esporlo a un\n  pod k8s via Consul Connect\
  \ senza VPN/peering.\n- Limiti noti: overhead operativo del cluster Consul separato\
  \ da k8s, curva di\n  apprendimento di intentions/ACL rispetto a NetworkPolicy nativa.\n"
