description: 'File dedicato a Elastic Load Balancing, oggi trattato solo per accenni
  in ec2-autoscaling,

  eks e cloudfront (nessun file in cloud/aws/networking).

  Struttura: scelta ALB vs NLB vs GWLB (tabella decisionale); target group (instance/ip/lambda/alb),

  health check e deregistration delay; listener rules (path/host/header, weighted
  forward per canary);

  cross-zone load balancing e relativi costi di data transfer; preservazione client
  IP e Proxy Protocol v2;

  NLB con Elastic IP e PrivateLink (endpoint service); GWLB con appliance di sicurezza
  (GENEVE, porta 6081);

  TLS termination, ACM, SNI, policy TLS (ELBSecurityPolicy-TLS13-*); access logs su
  S3 e metriche CloudWatch

  (TargetResponseTime, HTTPCode_ELB_5XX, UnHealthyHostCount); integrazione con AWS
  Load Balancer Controller

  su EKS (annotation, target-type ip). Esempi Terraform e comandi `aws elbv2 ...`.

  Troubleshooting: 502/503/504, idle timeout mismatch con keep-alive del backend,
  target unhealthy, drain lento.

  '
