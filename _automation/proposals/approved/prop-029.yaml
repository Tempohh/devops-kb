rationale: 'Ogni workload AWS esposto passa da un ELB, ma la KB non ha un punto di
  atterraggio.

  I 502/504 da idle timeout e i costi di cross-zone sono problemi operativi ricorrenti
  e non banali;

  la documentazione ufficiale e'' frammentata per tipo di LB. Collega load-balancing/layer4-vs-layer7,

  ingress K8s e cloudfront.

  '
