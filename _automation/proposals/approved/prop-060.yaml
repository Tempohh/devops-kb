description: "Nuovo file per CircleCI, SaaS CI citato nella tabella comparativa di\n\
  ci-cd/_index.md (\"Startup, velocità di setup\") ma assente come argomento\ndedicato\
  \ — l'unico file in ci-cd/tools/ è tekton.md, mentre Jenkins ha 6\nfile, GitHub\
  \ Actions 3, GitLab CI 2. Struttura suggerita:\n- Config.yml 2.1: orbs (pacchetti\
  \ riusabili, versioning, orb registry\n  pubblico/privato), executors (docker/machine/macos/windows\
  \ — differenze\n  di isolamento e costo), resource_class (cpu/memoria per job).\n\
  - Workflows: fan-out/fan-in, job dependencies (`requires`), approval job\n  manuale,\
  \ scheduled workflows (cron), matrix jobs (parametrizzati).\n- Dynamic config: `setup\
  \ workflows`, `continuation orb` per pipeline\n  generate a runtime (monorepo, path-filtering).\n\
  - Caching e Docker layer caching: `save_cache`/`restore_cache` con\n  chiavi basate\
  \ su checksum, differenza rispetto a GitHub Actions cache.\n- Self-hosted runners\
  \ (CircleCI runner) per workload non containerizzabili.\n- Contexts e security:\
  \ secret scoping per progetto/org, OIDC per cloud\n  provider (AWS/GCP) senza static\
  \ credentials.\n- Confronto pratico con GitHub Actions/GitLab CI: dove CircleCI\
  \ vince\n  (setup rapido, resource class granulare) e dove perde (ecosistema\n \
  \ meno integrato con il code hosting).\n"
