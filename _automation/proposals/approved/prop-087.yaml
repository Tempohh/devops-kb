description: 'Il campo `related` in `docs/ai/agents/_index.md` (riga 8) contiene:

  `related: [ai/agenti/claude-agent-sdk, ai/agenti/frameworks, ...]`

  ma la cartella reale è `ai/agents/` (inglese), non `ai/agenti/`

  (italiano) — i due file target esistono realmente come

  `docs/ai/agents/claude-agent-sdk.md` e `docs/ai/agents/frameworks.md`.

  Il refuso rende i due riferimenti nel campo `related` non risolvibili

  da qualsiasi tooling che li usi per costruire grafo di connettività o

  suggerimenti "vedi anche" (stesso meccanismo usato in questa sessione

  per l''audit di connettività hub→figli).

  Azione richiesta: correggere le due voci in

  `related: [ai/agents/claude-agent-sdk, ai/agents/frameworks, ai/sviluppo/prompt-engineering,
  ai/sviluppo/rag]`.

  '
