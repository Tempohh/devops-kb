description: "`docs/dev/linguaggi/_index.md` include Node.js nella tabella comparativa\n\
  \"Criteri di Scelta\" con metriche complete (startup ~200ms, footprint\n50-100MB,\
  \ \"Ideal per: I/O bound, BFF\") e lo cita nei `tags`/\n`search_keywords` del file,\
  \ ma la lista \"Argomenti in questa sezione\"\nelenca solo Java Spring Boot, Java\
  \ Quarkus, .NET, Go e Python — Node.js\nnon ha un file dedicato, a differenza di\
  \ ogni altro linguaggio nella\nstessa tabella.\nCreare `nodejs.md` seguendo la struttura\
  \ degli altri file della stessa\nsottocategoria (es. `go.md`, `python.md`): copertura\
  \ di Node.js LTS\ncorrente per microservizi containerizzati:\n- Event loop e modello\
  \ di concorrenza I/O-bound (perché è indicato per BFF)\n- Framework HTTP: Express\
  \ vs Fastify vs NestJS (trade-off performance/DX)\n- TypeScript come default de\
  \ facto per microservizi enterprise\n- Gestione async: Promise, async/await, gestione\
  \ errori non catturati\n  (unhandledRejection) — rilevante per crash in produzione\n\
  - Containerizzazione: multi-stage Dockerfile, `NODE_ENV=production`,\n  gestione\
  \ segnali (SIGTERM) per graceful shutdown su Kubernetes\n- Cluster module vs orizzontale\
  \ via K8s replica (perché Node.js è\n  single-thread e non sfrutta più core in un\
  \ solo processo)\n- Observability: OpenTelemetry auto-instrumentation per Node.js\n\
  Aggiornare `_index.md`: aggiungere la voce nella lista \"Argomenti in\nquesta sezione\"\
  \ e in `related` se pertinente.\n"
