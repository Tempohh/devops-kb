rationale: 'La categoria compliance della KB copre solo audit trail "a posteriori"
  ma

  nessun DevOps/SRE trova qui come dimostrare PROATTIVAMENTE la conformità a

  un audit SOC2/PCI-DSS/ISO27001 (tag già presenti nel frontmatter di

  `compliance/_index.md` ma senza contenuto a supporto). "kube-bench" e "CIS

  benchmark" compaiono solo come menzioni sparse in 6+ file (container-runtime,

  docker/sicurezza, aws/security/compliance-audit, ecc.) senza mai un punto di

  riferimento centrale che spieghi come usarli operativamente end-to-end.

  '
