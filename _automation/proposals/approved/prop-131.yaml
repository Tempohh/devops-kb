description: "Nuovo file nella categoria `security/compliance`, che oggi contiene\
  \ SOLO\n`audit-logging.md` (ricostruzione post-hoc) ma nessun contenuto su hardening\n\
  preventivo misurabile contro baseline riconosciute. Struttura suggerita:\n- Differenza\
  \ concettuale vs OPA (`security/autorizzazione/opa.md`): OPA\n  valuta policy a\
  \ runtime/admission-time, i CIS Benchmark valutano\n  configurazione statica di\
  \ nodi/cluster contro una baseline pubblicata\n  (CIS Kubernetes Benchmark, CIS\
  \ Distribution Independent Benchmark).\n- `kube-bench`: installazione (DaemonSet/Job\
  \ one-shot), mapping dei check\n  (`node.yaml`, `master.yaml`, `etcd.yaml`), esempio\
  \ di output e lettura dei\n  risultati PASS/FAIL/WARN, automazione in CronJob +\
  \ export verso\n  Prometheus/Grafana (già menzionato en passant in\n  `monitoring/tools/prometheus-scalabilita.md`\
  \ — qui va il contenuto primario).\n- `OpenSCAP` / `oscap`: scansione SCAP di host\
  \ Linux (RHEL/Ubuntu), profili\n  DISA STIG vs CIS, generazione report HTML, `oscap-docker`\
  \ per immagini\n  container.\n- `Chef InSpec`: profili dichiarativi riusabili, differenza\
  \ da OpenSCAP\n  (linguaggio Ruby DSL portabile multi-piattaforma vs XML SCAP),\
  \ esempio di\n  profilo InSpec minimale, integrazione in pipeline CI/CD come gate\
  \ (link a\n  `ci-cd/strategie/pipeline-security.md` che già cita compliance-as-code\
  \ in\n  passing ma senza strumenti concreti).\n- Tabella comparativa: kube-bench\
  \ (solo k8s) vs OpenSCAP (OS-level, STIG)\n  vs InSpec (multi-target, DSL custom)\
  \ — quando usare cosa.\n- Sezione Troubleshooting: falsi positivi comuni (es. kube-bench\
  \ su cluster\n  managed EKS/GKE dove il control plane non è ispezionabile — richiede\n\
  \  profilo `--benchmark eks-1.0` dedicato), remediation automatica vs manuale.\n"
