rationale: 'Kafka e RabbitMQ sono gli unici due sistemi di messaging documentati nella
  KB

  (56 file solo per Kafka). Apache Pulsar è il terzo sistema di event-streaming

  più diffuso in produzione (Yahoo/Verizon, Splunk, Tencent, StreamNative/Datastax

  Astra Streaming) ed è frequentemente il termine di confronto quando un team

  valuta "Kafka vs alternative" per via di multi-tenancy nativa e tiered storage

  — due capability che Kafka non ha nativamente (serverless/tiered storage solo

  in offerte enterprise). Oggi la KB non menziona Pulsar in nessun file: chi

  deve scegliere tra Kafka e Pulsar, o chi eredita un cluster Pulsar esistente,

  non trova alcun riferimento. Non è simmetria formale: l''architettura compute/

  storage separata di Pulsar è concettualmente diversa da Kafka e genera domande

  operative specifiche (bookie sizing, tiered storage offload) che non sono

  risolvibili per analogia con i contenuti Kafka esistenti.

  '
