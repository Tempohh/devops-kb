description: "Nuovo file nella categoria `security/autenticazione`, che oggi copre\
  \ OAuth2/OIDC,\nJWT e mTLS/SPIFFE ma non menziona SAML né LDAP se non di sfuggita\
  \ (3 file\nnetworking li citano solo come riferimento a porte/protocolli, zero copertura\n\
  operativa). Struttura suggerita:\n- SAML 2.0: flusso SP-initiated vs IdP-initiated,\
  \ XML assertion, differenza\n  pratica da OIDC (XML+redirect/POST binding vs JSON+token),\
  \ perché esiste\n  ancora: tool enterprise legacy (Jira/Confluence on-prem, alcuni\
  \ ERP, VPN\n  aziendali) e requisiti di certificazione che richiedono SAML esplicitamente.\n\
  - Configurazione concreta: esempio SAML su Grafana o Jenkins con IdP\n  (Keycloak\
  \ come IdP SAML, Okta/Entra ID come alternative enterprise),\n  metadata exchange,\
  \ certificate rotation per firma assertion.\n- LDAP/Active Directory: bind authentication,\
  \ struttura DN/OU, gruppi AD per\n  RBAC (collegamento a `security/autorizzazione/rbac-abac-rebac.md`),\
  \ LDAPS\n  vs StartTLS, perché molti tool self-hosted (GitLab CE, Grafana, Vault)\n\
  \  supportano ancora LDAP come fallback quando non c'è un IdP OIDC/SAML.\n- Tabella\
  \ decisionale: OIDC (default per nuovi sistemi) vs SAML (vincolo\n  enterprise/legacy)\
  \ vs LDAP diretto (directory on-prem senza IdP federato) —\n  quando è obbligato\
  \ dal contesto e non una scelta tecnica.\n- Troubleshooting: clock skew su assertion\
  \ SAML, certificate expiry non\n  monitorato, LDAP referral chasing, differenza\
  \ NTLM vs Kerberos (menzione\n  per contestualizzare, no approfondimento separato).\n"
