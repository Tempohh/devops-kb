rationale: 'Il DBA/DevOps che deve portare un cluster PostgreSQL fuori supporto (EOL
  a 5 anni)

  non trova nella KB nulla sul tema: grep "pg_upgrade|postgresql upgrade" = 0 risultati,

  mentre replicazione, vacuum, extensions e backup-pitr sono coperti. E'' un''operazione

  rischiosa, ricorrente e con trappole non ovvie (statistiche, sequenze, collation).

  '
