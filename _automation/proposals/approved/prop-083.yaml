description: "docs/ci-cd/pipeline.md (\"CI/CD Pipeline — Fondamentali e Architettura\"\
  ) ha\n`parent: ci-cd/_index` nel frontmatter ma non è linkato dal corpo di\ndocs/ci-cd/_index.md\
  \ — verificato con grep sull'intero body, zero match su\n\"pipeline.md\". È l'unico\
  \ file di secondo livello del grid (github-actions,\ngitlab-ci, gitops, jenkins,\
  \ platform-engineering, strategie, testing, tools\nsono tutti linkati correttamente;\
  \ solo pipeline.md, che vive direttamente\nsotto ci-cd/ senza sottocartella, è stato\
  \ dimenticato).\nAggiungere una entry nel grid a card di docs/ci-cd/_index.md, stile\
  \ identico\nalle altre righe `-   **[Titolo](link)**` con sottotitolo descrittivo\
  \ breve,\nposizionata per prima (è il topic fondamentale/introduttivo su cui gli\
  \ altri\nsi basano) o subito dopo l'introduzione concettuale della CI/CD.\nEsempio\
  \ di riga da aggiungere:\n```\n-   **[Pipeline — Fondamentali](pipeline.md)**\n\n\
  \    ---\n    Stage, quality gate, artifact, trigger, pipeline as code. Le basi\
  \ su cui\n    si costruiscono Jenkins, GitHub Actions, GitLab CI e gli altri tool.\n\
  ```\n"
