rationale: 'Chi: un lettore che cerca "Helm" nella KB e trova due pagine diverse

  senza capire quale leggere prima o se sono ridondanti.

  Problema: contenuto duplicato non è solo spreco di manutenzione (due

  posti da aggiornare quando cambia una best practice Helm) ma anche

  fonte di confusione — se in futuro un aggiornamento tocca solo una delle

  due pagine (come richiesto dal protocollo "modifica solo il file

  target"), le due finiscono per divergere silenziosamente.

  Perché ora: emerso analizzando il gap di connettività di prop-078 —

  kubernetes/helm.md è risultato orfano E parzialmente ridondante con un

  hub esistente, non solo scollegato.

  '
