description: "Esistono due pagine indipendenti che trattano lo stesso argomento —\n\
  \"Helm come package manager per Kubernetes\" — senza riferimento incrociato:\n \
  \ - docs/containers/helm/_index.md (hub dedicato, con 2 figli:\n    chart-avanzato.md,\
  \ deployment-produzione.md)\n  - docs/containers/kubernetes/helm.md (pagina standalone,\
  \ parent:\n    containers/kubernetes/_index, NON linkata dalla grid dell'hub —\n\
  \    vedi anche prop-078)\nEntrambe coprono concetti (Chart, Release, values.yaml,\
  \ rollback,\nTiller/Helm 3) in modo sovrapposto ma con tagli leggermente diversi\
  \ (una\npiù \"reference comandi\", l'altra più \"guida concettuale\"). Nessuna delle\n\
  due linka l'altra in `related`.\nAzione suggerita (da valutare, non prescrittiva):\
  \ scegliere se (a)\nfondere kubernetes/helm.md nell'hub containers/helm/ come terzo\
  \ figlio\ncon focus specifico (es. \"Helm in contesto Kubernetes: RBAC, CRD\nordering,\
  \ hooks vs operators\") rimuovendo la sovrapposizione concettuale\ncon l'_index,\
  \ oppure (b) tenerle separate ma aggiungere `related`\nincrociati e un chiaro delta\
  \ di scope in cima a ciascun file (\"per la\nguida completa ai comandi Helm vedi\
  \ X; qui: come Helm si integra con\nRBAC/CRD/operators di Kubernetes\").\n"
