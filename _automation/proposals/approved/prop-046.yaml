description: "`docs/containers/kubernetes/networking.md` (status: needs-review, creato\n\
  2026-09-26) e `docs/networking/kubernetes/_index.md` + le sue foglie\n(cni.md, ingress.md,\
  \ network-policies.md; status: complete, dal\n2026-03-09) coprono in larga parte\
  \ lo stesso territorio: CNI plugin\n(Calico/Cilium/Flannel), Service types, Ingress\
  \ Controller, NetworkPolicy,\nkube-proxy. Il file in containers/ è inoltre ORFANO:\
  \ nessun hub lo linka\n(containers/kubernetes/_index.md ha anzi una nota esplicita\
  \ che rimanda\nSOLO a networking/kubernetes/_index.md per questi temi, riga 67-68)\
  \ e non\ncompare nel `related` di networking/kubernetes/_index.md.\nAzioni da valutare\
  \ in sede di review/consolidate:\n1. Decidere il confine reale: containers/kubernetes/networking.md\
  \ potrebbe\n   restare come guida \"verticale\" centrata su kube-proxy/CIDR/kubeadm\n\
  \   config e troubleshooting DNS/CoreDNS (contenuti non duplicati, es.\n   sezione\
  \ kube-proxy iptables/ipvs, dnsPolicy, CoreDNS troubleshooting),\n   tagliando le\
  \ parti che duplicano CNI/Ingress/NetworkPolicy (già\n   coperte meglio con confronti\
  \ e diagrammi in networking/kubernetes/).\n2. Aggiungere riferimento incrociato\
  \ bidirezionale: containers/kubernetes/_index.md\n   deve linkare anche questo file\
  \ (non solo l'hub esterno), e\n   networking/kubernetes/_index.md deve aggiungere\
  \ containers/kubernetes/networking.md\n   al proprio `related` per il taglio \"\
  runtime/CoreDNS\" complementare.\n3. Aggiornare `related` di networking/kubernetes/cni.md,\
  \ ingress.md,\n   network-policies.md se il taglio ridotto lascia contenuto specifico\n\
  \   da referenziare.\n"
