description: "File dedicato a Terragrunt. Oggi e' trattato solo come sezione 7 di\n\
  `iac/terraform/ci-cd.md` (circa 50 righe con `run-all`); 3 file lo menzionano in\
  \ tutto.\nStruttura suggerita:\n- Problema risolto: duplicazione di backend/provider\
  \ tra dev/staging/prod e tra\n  decine di root module; quando Terragrunt NON serve\
  \ (workspaces, moduli + CI bastano).\n- Layout repo: `root.hcl` con `remote_state`\
  \ e `generate \"provider\"`, `include`\n  (`find_in_parent_folders`), `terragrunt.hcl`\
  \ per unit, `env.hcl`/`account.hcl`\n  con `read_terragrunt_config`.\n- Dipendenze:\
  \ blocco `dependency` con `mock_outputs` per plan su stack vuoto,\n  `dependencies`,\
  \ ordine di esecuzione e grafo (`terragrunt dag graph`).\n- CLI: `terragrunt run\
  \ --all plan|apply` (nuova CLI redesign, sostituisce\n  `run-all` deprecato), `--filter`,\
  \ `--parallelism`, `--non-interactive`; nota di\n  migrazione dai flag `--terragrunt-*`\
  \ ai nuovi.\n- Stacks: `terragrunt.stack.hcl`, `unit`/`stack` block e `terragrunt\
  \ stack generate`\n  per catalogare layout riusabili.\n- Integrazione con OpenTofu\
  \ (`terraform_binary`/`TG_TF_PATH`), CI/Atlantis e\n  caching dei provider (`TG_PROVIDER_CACHE`).\n\
  - Troubleshooting: `dependency` senza output su stato vuoto, lock contention\n \
  \ in parallelo, `.terragrunt-cache` obsoleta, drift tra versioni di terragrunt\n\
  \  (pin con `terragrunt_version_constraint`).\nVerificare le versioni correnti dalla\
  \ documentazione ufficiale prima di scrivere\ni comandi (la CLI e' cambiata di recente).\n"
