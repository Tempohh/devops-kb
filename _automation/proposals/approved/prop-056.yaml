description: "Documentare CrossGuard, il framework di Policy as Code nativo di Pulumi,\
  \ che\noggi manca completamente nella KB (Terraform ha un intero file dedicato a\n\
  testing/policy con OPA/Sentinel/checkov, Pulumi zero). Struttura suggerita:\n- Cos'è\
  \ un Policy Pack (`pulumi policy new aws-typescript`), differenza tra\n  `advisory`,\
  \ `mandatory` e `remediate` enforcement level.\n- Esempio di policy reale in TypeScript/Python:\
  \ vietare S3 bucket pubblici,\n  forzare tag obbligatori, limitare instance type\
  \ in prod.\n- `pulumi up --policy-pack ./policy-pack` in locale e enforcement centralizzato\n\
  \  via Pulumi Cloud (organization-wide policy groups, assegnazione per stack).\n\
  - Differenza CrossGuard (Policy as Code, valutata durante preview/up, blocca\n \
  \ il deploy) vs strumenti di scansione statica post-hoc (checkov/tfsec-style)\n\
  \  che Pulumi supporta comunque via `pulumi convert`/provider Terraform.\n- CI/CD:\
  \ far fallire una GitHub Actions pipeline se una policy `mandatory`\n  viene violata\
  \ (exit code diverso da 0 su `pulumi up`).\n- Troubleshooting: policy pack non trovato,\
  \ conflitti tra policy locali e\n  organization policy, falsi positivi su risorse\
  \ già esistenti (remediate\n  che modifica risorse a runtime — rischio da segnalare\
  \ esplicitamente).\n"
effort: medium
