description: "`docs/cloud/gcp/compute/cloud-run.md` esiste ed è completo (frontmatter\n\
  `parent: cloud/gcp/compute/_index`), ma il file `_index.md` a cui punta\nNON esiste\
  \ — è l'unico hub mancante in tutta la sezione `cloud/gcp/**`\n(tutte le altre 6\
  \ sotto-sezioni: fondamentali, iam, containers, dati,\nmessaging, monitoring, storage\
  \ hanno il proprio `_index.md`).\nInoltre `docs/cloud/gcp/_index.md` (il grid \"\
  Mappa dei Servizi\") non\nmenziona affatto \"Compute\" o \"Cloud Run\": un lettore\
  \ che segue la\nnavigazione dalla home GCP non trova mai questo articolo.\nCloud\
  \ Run è oggi linkato solo lateralmente da 2 admonition \"Approfondimento\"\n(pubsub.md,\
  \ cloud-monitoring.md) — nessun percorso di navigazione diretto.\nAzioni richieste:\n\
  1. Creare `docs/cloud/gcp/compute/_index.md` seguendo lo stile degli altri\n   hub\
  \ GCP (frontmatter standard, parent: cloud/gcp/_index, breve intro,\n   grid/lista\
  \ con link a cloud-run.md).\n2. Aggiungere una card \"Compute\" al grid \"Mappa\
  \ dei Servizi\" in\n   `docs/cloud/gcp/_index.md` (stesso pattern delle altre 6\
  \ card),\n   puntando a `compute/_index.md`.\n"
