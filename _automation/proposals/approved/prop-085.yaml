rationale: 'Lettore: DevOps/Cloud Engineer che valuta opzioni serverless su GCP.

  Scenario: parte dalla home GCP della KB per capire quali servizi compute

  sono coperti, o segue `related` da un altro file GCP.

  Outcome: con l''hub creato e linkato, arriva a Cloud Run in un click dal

  grid principale, invece di scoprirlo solo per caso da un rimando laterale.

  Without_KB: dovrebbe usare la ricerca full-text o notare per caso i link

  "Approfondimento" in pubsub.md/cloud-monitoring.md — nessuna garanzia di

  scoprire il contenuto navigando normalmente la sezione.

  Pattern già osservato in sessioni precedenti (#634/#637/#638/#642): hub

  creato/child aggiunto ma mai agganciato al grid del genitore — qui il

  caso è più severo perché manca l''intero file `_index.md`, non solo il

  link.

  '
