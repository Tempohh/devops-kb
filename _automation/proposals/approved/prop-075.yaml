description: "docs/cloud/gcp/_index.md ha una sezione \"Mappa dei Servizi\" (grid\
  \ cards)\nche elenca solo 5 sotto-aree: Fondamentali, Containers, Dati & Analytics,\n\
  Monitoring & Observability, Storage. Mancano due sotto-hub reali e\ncompleti (status:\
  \ complete, contenuto sostanziale, non stub):\n  - docs/cloud/gcp/iam/_index.md\
  \ (\"IAM su GCP\" — service account,\n    permessi, sicurezza accessi)\n  - docs/cloud/gcp/messaging/_index.md\
  \ (\"Messaging su GCP\" — Pub/Sub,\n    event-driven, streaming)\nNessuna delle\
  \ due è raggiungibile navigando da cloud/gcp/_index.md.\nAzioni:\n  1. Aggiungere\
  \ una card \"IAM\" nella grid che linki a iam/_index.md,\n     posizionata dopo\
  \ Fondamentali (coerente con l'ordine logico\n     \"identità prima di tutto\" usato\
  \ in cloud/aws/_index.md e\n     cloud/azure/_index.md, dove IAM/Identità è tra\
  \ i primi elementi).\n  2. Aggiungere una card \"Messaging\" che linki a messaging/_index.md.\n\
  \  3. Aggiornare `last_updated`.\n"
