  di costo InnoDB, il clustered index e l''introduzione recente dell''hash

  join sono meccanismi concettualmente diversi da Postgres, non solo sintassi

  diversa dello stesso comando. Consigliato come follow-up dal report di

  saturazione della sessione precedente (#600) come secondo file MySQL da

  valutare dopo l''architettura.

  '
