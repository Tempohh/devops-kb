description: "Secondo file per databases/mysql/ (dopo architettura-replicazione.md,\n\
  auto #601), speculare a databases/sql-avanzato/query-optimizer.md ma per\nl'ottimizzatore\
  \ InnoDB, che ha modello di costo e strumenti di analisi\ndiversi da Postgres. Struttura\
  \ suggerita:\n- EXPLAIN e EXPLAIN FORMAT=JSON: differenze da EXPLAIN ANALYZE Postgres\n\
  \  (MySQL 8.0.18+ supporta EXPLAIN ANALYZE ma con output diverso), lettura\n  di\
  \ `possible_keys`, `key_len`, `rows`, `filtered`, `Extra` (Using\n  filesort, Using\
  \ temporary, Using index).\n- Optimizer trace (`optimizer_trace`): come ispezionare\
  \ le decisioni del\n  planner passo-passo, utile quando EXPLAIN non basta.\n- Clustered\
  \ index (PK) vs secondary index: costo del lookup secondario\n  (torna al clustered\
  \ index), differenza pratica da Postgres (heap +\n  indici tutti equivalenti).\n\
  - Join algorithms: nested loop (unico storicamente), hash join\n  (introdotto in\
  \ 8.0.18) e quando MySQL lo sceglie.\n- InnoDB buffer pool tuning: `innodb_buffer_pool_size`,\n\
  \  `innodb_buffer_pool_instances`, adaptive hash index (quando disabilitarlo).\n\
  - Slow query log + `pt-query-digest` (Percona Toolkit) per triage.\n- Index strategy:\
  \ covering index, index merge, perché troppi indici\n  penalizzano write-heavy workload\
  \ su InnoDB più che su Postgres (doppio\n  costo update per clustered index).\n"
