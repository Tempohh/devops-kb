description: 'docs/cloud/aws/networking/global-accelerator.md confronta esplicitamente
  il

  proprio failover-in-secondi con il failover DNS-based di Route 53, si

  posiziona come alternativa/complemento a CloudFront per traffico non

  cacheable, e usa ALB/NLB/VPC come endpoint tipici — ma nessuno di questi 4

  file elenca global-accelerator nel proprio `related`. Aggiungere

  `cloud/aws/networking/global-accelerator` al frontmatter `related` di:

  - docs/cloud/aws/networking/route53.md (confronto diretto failover DNS vs anycast)

  - docs/cloud/aws/networking/cloudfront.md (confronto CDN vs traffico non cacheable)

  - docs/cloud/aws/networking/elastic-load-balancing.md (ALB/NLB come endpoint tipico)

  - docs/cloud/aws/networking/vpc.md (endpoint GA vivono nelle subnet VPC)

  Aggiornare `last_updated` nei 4 file toccati. Solo modifica al campo

  `related`, nessuna riscrittura di sezioni.

  '
