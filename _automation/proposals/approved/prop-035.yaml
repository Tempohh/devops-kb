description: "Manca un file dedicato al servizio gestito Amazon API Gateway (citato\
  \ solo\ndi sfuggita in lambda.md, cloudformation-cdk.md, route53.md, kms-secrets.md,\n\
  network-security.md, observability.md, policies-avanzate.md — mai come\nargomento\
  \ primario). Struttura suggerita:\n- REST API vs HTTP API vs WebSocket API: differenze\
  \ di feature, prezzo,\n  latenza; quando scegliere l'uno o l'altro.\n- Integrazioni:\
  \ Lambda proxy, HTTP proxy, AWS service integration (es. SQS,\n  Step Functions),\
  \ mapping templates (VTL) per REST API.\n- Autenticazione/autorizzazione: Lambda\
  \ authorizer (token vs request based),\n  IAM authorizer, Cognito authorizer, JWT\
  \ authorizer nativo su HTTP API.\n- Throttling e usage plans: rate/burst limit a\
  \ livello account/stage/metodo,\n  API keys, usage plans per tier cliente.\n- Esposizione\
  \ privata: API privata via VPC endpoint (Interface Endpoint),\n  resource policy,\
  \ VPC Link per raggiungere NLB/ALB interni da API pubblica.\n- CORS, custom domain\
  \ names (edge-optimized vs regional), stage e canary\n  deployment, logging su CloudWatch\
  \ (access log format, execution log).\n- Esempio SAM/CDK minimo per REST API + Lambda\
  \ + authorizer.\n- Troubleshooting: errori 403 da resource policy vs IAM vs authorizer,\n\
  \  CORS preflight che fallisce, timeout 29s hard limit su integrazione.\n"
