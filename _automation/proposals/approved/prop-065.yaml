description: "docs/dev/linguaggi/_index.md ha `related: []` (vuoto), ma almeno due\
  \ file\npuntano già a lui in modo asimmetrico:\n- docs/dev/api/_index.md → related\
  \ include `dev/linguaggi/_index`\n- docs/dev/runtime/_index.md → related include\
  \ `dev/linguaggi/java-spring-boot`\n  e `dev/linguaggi/java-quarkus` (due file specifici\
  \ della sezione linguaggi)\nNessuno di questi link ha il corrispondente inverso\
  \ in `linguaggi/_index.md`.\nAggiungere a `docs/dev/linguaggi/_index.md`:\n```yaml\n\
  related: [dev/api/_index, dev/runtime/_index, dev/processi/_index]\n```\n(incluso\
  \ anche `dev/processi/_index` per lo stesso motivo — vedi prop-066:\ni linguaggi\
  \ discussi qui sono l'oggetto del workflow di sviluppo descritto lì).\nAggiornare\
  \ `last_updated`.\n"
