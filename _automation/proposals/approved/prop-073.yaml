description: "La sezione \"## Mappa dei Servizi\" di `cloud/aws/_index.md` elenca\
  \ 10 card\n(IAM, Networking, Compute, Storage, Database, Security, Monitoring, CI/CD,\n\
  Messaging, Fondamentali) ma manca la card per `containers/_index.md`\n(Amazon EKS\
  \ — Elastic Kubernetes Service), che esiste, è `status: complete`\ne ha `last_updated:\
  \ 2026-03-25`.\nAggiungere una card coerente con lo stile esistente, es.:\n```\n\
  - :material-kubernetes: **[Containers](containers/_index.md)**\n\n    Amazon EKS\
  \ — managed Kubernetes, node groups, Fargate profiles, IRSA\n```\nPosizionarla logicamente\
  \ vicino a Compute (che già menziona ECS/EKS in\n`compute/containers-ecs-eks.md`\
  \ — verificare che non ci sia sovrapposizione\ndi scope, il file containers/ tratta\
  \ EKS in profondità mentre\ncompute/containers-ecs-eks.md è il confronto ECS vs\
  \ EKS ad alto livello).\nAggiornare anche `last_updated` del frontmatter.\n"
