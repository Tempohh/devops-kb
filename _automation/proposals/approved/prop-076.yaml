description: 'L''hub docs/ci-cd/strategie/_index.md ha una sezione "Relazioni" con
  3

  admonition collassabili (Strategie di Deployment, Pipeline Security,

  Jenkins Enterprise Patterns) ma NON linka due file figli completi e già

  pubblicati nella stessa cartella: trunk-based-development.md e

  feature-flags.md. Entrambi hanno frontmatter status: complete e parent:

  ci-cd/strategie/_index, ma restano irraggiungibili navigando dall''hub.

  Aggiungere due admonition "??? info" nella sezione Relazioni seguendo lo

  stesso pattern delle altre tre (titolo breve, 1-2 frasi di riassunto,

  link "Approfondimento completo →" al file), oppure aggiungerli come card

  nella grid se si preferisce uniformare lo stile con altri hub della

  categoria ci-cd (es. jenkins/_index.md usa grid cards per tutti i figli).

  '
