rationale: 'Chi: un DevOps mid-senior che naviga la KB partendo dall''hub di categoria

  ci-cd/_index.md → strategie/_index.md per orientarsi sulle strategie CI/CD.

  Problema: due argomenti operativi comuni (trunk-based development e

  feature flags) esistono già con contenuto completo ma non sono

  raggiungibili dalla pagina che dovrebbe elencarli — l''utente deve

  conoscere già il nome del file o usare la ricerca full-text. Questo è

  esattamente il pattern "sotto-hub non aggiornato dopo la creazione di un

  nuovo figlio" segnalato come criticità sistemica nel report di

  saturazione delle ultime sessioni (#624, #627).

  '
