description: 'Guida operativa di diagnosi di rete a strati, con metodologia (DNS ->
  connettivita'' L3 -> porta L4 -> TLS -> L7).

  Contenuto: `dig`/`nslookup` (+trace, +short), `ping`/`mtr` (lettura di loss/latency
  per hop),

  `ss -tanp`/`ss -s` (stati TCP, SYN-SENT vs CLOSE-WAIT accumulati), `tcpdump` con
  filtri BPF

  (SYN senza SYN-ACK, retransmission, RST) e lettura in Wireshark, `curl -w` con timing
  (namelookup/connect/appconnect),

  `openssl s_client`, `conntrack -L`/tabella piena (`nf_conntrack: table full`), MTU/PMTUD
  blackhole

  (`ping -M do -s`, MSS clamping, ICMP frag-needed bloccato), asimmetria di routing,
  port exhaustion/ephemeral ports, SNAT.

  Sezione cloud/K8s: `kubectl debug` con nicolaka/netshoot, `tcpdump` in ephemeral
  container, VPC Flow Logs e

  AWS Reachability Analyzer come complemento. Tabella sintomo -> causa probabile ->
  comando.

  Esempi di output reali commentati.

  '
