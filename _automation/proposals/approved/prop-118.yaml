description: "Aggiungere una sezione dedicata a `terraform test`, il framework di\
  \ test\nnativo introdotto in Terraform 1.6 (file `.tftest.hcl`), tra la sezione\n\
  \"6. Terraform built-in checks (v1.5+)\" e \"7. pre-commit hooks\". Il file\nattuale\
  \ copre solo alternative esterne (Terratest in Go, checkov, conftest)\nma non lo\
  \ strumento first-party di HashiCorp, che è oggi lo standard\nconsigliato per test\
  \ di unità/integrazione su moduli senza introdurre una\ndipendenza Go nel progetto.\n\
  Contenuti minimi da includere:\n- Struttura di un file `tests/*.tftest.hcl` con\
  \ blocchi `run` multipli\n- Differenza tra `command = plan` (unit test veloce, no\
  \ risorse reali) e\n  `command = apply` (integration test, provisiona davvero)\n\
  - Blocco `assert` con `condition`/`error_message`, analogo ai `check {}`\n  ma eseguibile\
  \ fuori da `terraform plan/apply` reali\n- Uso di `variables {}` per override per-run\
  \ e `mock_provider` (v1.7+) per\n  test senza credenziali cloud\n- Comando `terraform\
  \ test` in CI, confronto con Terratest nella tabella\n  \"Tool Overview\" esistente\
  \ (aggiungere riga)\n- Esempio pratico: test di un modulo VPC che verifica cidr_block\
  \ via\n  `command = plan` prima di un test `command = apply` più costoso\n"
