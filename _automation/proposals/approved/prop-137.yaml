description: "Guida operativa al deploy di MCP server oltre il caso stdio locale gia'\
  \ trattato\nin claude-agent-sdk.md (sezione 4). Struttura suggerita:\n- Transport:\
  \ stdio vs Streamable HTTP, quando usare l'uno o l'altro, sessioni e\n  stateless\
  \ scaling dietro load balancer.\n- Autenticazione/autorizzazione: OAuth 2.1 con\
  \ resource server MCP, scope minimi,\n  token passthrough come anti-pattern, gestione\
  \ secret (Vault / K8s Secret).\n- Threat model: tool poisoning, prompt injection\
  \ via tool result, confused deputy,\n  rug-pull su tool description; mitigazioni\
  \ (allowlist, pinning versioni, review\n  delle descrizioni, human-in-the-loop sui\
  \ tool distruttivi).\n- Deployment: container non-root, Deployment K8s + Ingress,\
  \ NetworkPolicy,\n  rate limiting, audit log strutturato delle tool call, osservabilita'\
  \ (OpenTelemetry).\n- Gateway/registry MCP centralizzato per team, governance dei\
  \ server approvati.\n- Troubleshooting: timeout SSE/streaming dietro proxy, buffering\
  \ nginx, 401 su refresh token.\nEsempi: manifest K8s, config nginx per streaming,\
  \ snippet di validazione token.\n"
