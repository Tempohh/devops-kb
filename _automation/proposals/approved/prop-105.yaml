description: 'Durante la review #672 (prop-104) è emerso che la tabella DORA Metrics
  ha High/Medium/Low identici (16-30%) per Change Failure Rate — probabile copia-incolla
  mai corretto, marcato `<!-- REVIEW -->` in loco. Inoltre le soglie DORA citate seguono
  la metodologia a 4 cluster fissi (Elite/High/ Medium/Low) dei report 2019-2021;
  i report DORA/Accelerate più recenti (2022+) hanno rivisto la metodologia dei cluster.
  Serve una sessione con accesso a fonti esterne aggiornate per: 1) correggere i valori
  CFR duplicati con dati corretti da fonte autorevole, 2) valutare se le 4 soglie
  fisse vadano sostituite/annotate con la metodologia più recente.

  '
