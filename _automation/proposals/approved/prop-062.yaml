rationale: 'Il lettore è un platform engineer che deve costruire una internal developer

  platform (IDP) e valuta se Terraform/Pulumi bastano o se serve un motore

  Kubernetes-native che esponga infrastruttura self-service via kubectl/CRD

  invece di CLI esterne. Oggi la KB non ha risposta: iac/_index.md elenca solo

  3 strumenti e containers/kubernetes/multi-cluster.md cita Crossplane solo di

  striscio (multi-cluster provisioning), senza spiegare Provider/MR/XR/XRD.

  È un gap trasversale reale tra iac/ e containers/kubernetes/, non simmetria

  formale: il modello control-loop è concettualmente diverso da plan/apply e

  merita spiegazione propria prima di poter essere confrontato con Terraform.

  '
