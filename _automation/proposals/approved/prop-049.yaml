description: "AWS Global Accelerator è citato solo di passaggio (3 righe) dentro\n\
  elastic-load-balancing.md come opzione per \"IP anycast statici e\nfailover multi-regione\
  \ davanti ad ALB\", ma non ha un file dedicato\n(verificato via grep \"Global Accelerator\"\
  \ su tutta docs/: unico match\nin elastic-load-balancing.md). È un servizio distinto\
  \ con modello\nmentale proprio (anycast, edge network AWS, non CDN/cache come\n\
  CloudFront) e casi d'uso ricorrenti in ambienti enterprise/gaming\nmulti-regione.\n\
  Struttura suggerita (template standard):\n- Panoramica: differenza netta da CloudFront\
  \ (anycast per TCP/UDP\n  generico vs CDN per contenuti HTTP cacheable) e da Route\
  \ 53\n  failover routing (IP statici vs DNS, failover in secondi vs TTL-bound)\n\
  - Concetti chiave: anycast IP, standard accelerator vs custom routing\n  accelerator,\
  \ endpoint groups, traffic dial, client affinity\n- Configurazione & pratica: esempio\
  \ CLI/Terraform di creazione\n  accelerator con 2 endpoint group (2 region), health\
  \ check,\n  failover test\n- Best practices: quando preferirlo a Route 53 failover\
  \ (RTO in\n  secondi vs minuti), quando NON serve (traffico HTTP cacheable →\n \
  \ CloudFront è più economico)\n- Troubleshooting: differenza di costo (ore + per-GB\
  \ data transfer\n  premium), errori comuni di health check cross-region\n"
