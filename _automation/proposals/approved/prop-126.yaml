description: "Nuovo file sul monitoraggio sintetico (black-box) come complemento ai\
  \ tre\npilastri già documentati (metriche/log/tracce, tutti \"white-box\" interni\
  \ al\nsistema). Struttura suggerita:\n- Perché serve: white-box monitoring misura\
  \ cosa succede dentro il sistema,\n  ma non rileva un load balancer/DNS/CDN rotto\
  \ davanti all'app, o un\n  endpoint pubblico irraggiungibile da fuori la rete interna\n\
  - Blackbox Exporter (Prometheus): configurazione moduli http_2xx, tcp_connect,\n\
  \  dns, icmp; esempio `blackbox.yml` con probe su endpoint pubblico +\n  validazione\
  \ certificato TLS in scadenza; integrazione con Prometheus via\n  `relabel_configs`\
  \ (pattern \"probe as a target\")\n- Grafana Cloud Synthetic Monitoring / Checkly\
  \ / Playwright scheduled script\n  come alternative per scenari multi-step (login\
  \ + checkout, non solo un\n  singolo GET)\n- Differenza con i canary deployment\
  \ check (Flagger/Argo Rollouts) già\n  presenti in CI/CD: synthetic monitoring gira\
  \ in continuo in produzione,\n  non solo durante un rollout\n- Alerting specifico:\
  \ soglie diverse da un alert interno (es. 3 region\n  diverse devono fallire prima\
  \ di alertare, per escludere problemi di rete\n  locale del probe)\nMinimo 150 righe,\
  \ almeno 2 code-block (config blackbox exporter + query\nPromQL/alerting rule),\
  \ sezione Troubleshooting su falsi positivi comuni\n(probe region con problemi di\
  \ rete propri, certificati self-signed interni).\n"
