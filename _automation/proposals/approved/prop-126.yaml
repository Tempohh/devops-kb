rationale: 'I tre pilastri documentati in monitoring/_index.md sono tutti white-box

  (misurano dall''interno). Non esiste in KB una pagina sul monitoraggio

  black-box/sintetico, che è lo strumento standard per verificare la

  disponibilità percepita dall''utente esterno (DNS, CDN, LB, certificati TLS)

  e per gli SLO di disponibilità già discussi in monitoring/sre/slo-sla-sli.md

  — quel file parla di "misurare l''SLO" ma non di come ottenere il segnale

  black-box necessario a calcolarlo per endpoint pubblici.

  '
