rationale: 'Stesso pattern già rilevato in ci-cd/_index.md (prop-106, sessione #674):
  un

  commento REVIEW inline segnala un dato da verificare ma sopravvive a cicli di

  automazione generici (review/currency) perché quei task non cercano

  esplicitamente commenti HTML residui. Questo è un secondo caso indipendente

  nella KB — conferma che il pattern non è isolato e che un task mirato (invece

  di un ennesimo review generico) è il modo più efficiente per chiuderlo.

  '
