description: 'Il file contiene, riga 24, un commento HTML mai risolto:

  `<!-- REVIEW: verificare lo stato corrente di CodeCommit sulla pagina ufficiale

  prima di raccomandarlo per nuovi progetti -->`, agganciato a un admonition che

  descrive lo stato di CodeCommit (stop nuovi clienti da luglio 2024, ripristino

  fine 2025).

  Azione: verificare sulla pagina ufficiale AWS (What''s New / CodeCommit FAQ) se

  lo stato descritto è ancora accurato a oggi (2026-09-28), correggere il testo

  dell''admonition se necessario, e rimuovere il commento `<!-- REVIEW: ... -->`

  una volta verificato — non lasciarlo come promemoria permanente.

  Aggiornare `last_updated` solo se il contenuto cambia sostanzialmente.

  '
