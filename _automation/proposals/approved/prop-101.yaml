description: "Il file continuous-profiling.md (creato/aggiornato il 2026-09-27) afferma\n\
  esplicitamente: \"Dal 2025 OpenTelemetry ha stabilizzato il profiling come\nquarto\
  \ signal (accanto a traces, metrics, logs)\" e mostra una pipeline\nCollector con\
  \ `service.pipelines.profiles`. Il file opentelemetry.md\n(last_updated 2026-03-24)\
  \ descrive ancora solo \"I Tre Pilastri della\nTelemetria\" (metriche, log, tracce)\
  \ senza menzionare il profiling.\nAggiungere:\n- Una riga/nota nella sezione \"\
  Concetti Chiave\" → \"I Tre Pilastri della\n  Telemetria\" che segnali il profiling\
  \ come quarto signal stabilizzato dal\n  2025, con rimando esplicito a continuous-profiling.md.\n\
  - Nella sezione \"Architettura / Come Funziona\" → \"OTel Collector\", un\n  accenno\
  \ alla pipeline `profiles` accanto a traces/metrics/logs (l'esempio\n  YAML del\
  \ Collector in questo file mostra solo traces/metrics/logs).\n- Aggiungere `monitoring/tools/continuous-profiling`\
  \ al campo `related`\n  del frontmatter (attualmente assente, mentre continuous-profiling.md\n\
  \  linka già opentelemetry.md — relazione asimmetrica).\n"
