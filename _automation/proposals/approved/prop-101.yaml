rationale: 'Chi legge opentelemetry.md come riferimento sui "segnali OTel" trova un

  modello concettualmente superato (3 pilastri) rispetto a un file fratello

  della stessa cartella che descrive già il 4° segnale stabilizzato. Un

  DevOps che adotta OTel per il profiling nel 2026 rischia di non capire,

  leggendo solo opentelemetry.md, che il Collector supporta nativamente

  anche questo segnale — dovrebbe scoprirlo per caso in un altro file.

  '
