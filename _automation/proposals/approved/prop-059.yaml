description: "Confronto operativo tra i principali tool di schema migration, assente\
  \ nella\nKB (esiste solo il pattern di deployment \"init container\" in\n`dev/integrazioni/database-patterns.md`,\
  \ non il confronto tra tool):\n- Versioned migrations (Flyway, golang-migrate) vs\
  \ declarative/state-based\n  (Atlas, Liquibase in modalità diff)\n- Rollback: quali\
  \ tool supportano rollback automatico vs richiedono migration\n  \"down\" scritte\
  \ a mano (Flyway Community non ha rollback automatico —\n  trade-off spesso sottovalutato)\n\
  - Migration idempotenti e locking (evitare doppia esecuzione da pod paralleli\n\
  \  — collegamento esplicito a `dev/integrazioni/database-patterns.md`)\n- Gestione\
  \ multi-ambiente (dev/staging/prod) e drift detection (Atlas è\n  l'unico con diff\
  \ schema-vs-stato-reale nativo)\n- Esempio comparativo: stessa migration (aggiungi\
  \ colonna NOT NULL con\n  default) espressa nei 3 tool\n"
