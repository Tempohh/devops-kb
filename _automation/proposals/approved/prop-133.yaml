description: "Guida operativa al backup/restore di cluster Kubernetes, oggi assente\
  \ (Velero ha 0 file\ndedicati nella KB, solo 1 riga in una config di audit; etcd\
  \ backup solo accennato in\narchitettura.md).\nStruttura suggerita:\n- Cosa va protetto:\
  \ stato etcd, risorse API (manifest/CRD), PersistentVolume, secret\n  e dati applicativi;\
  \ perché GitOps NON sostituisce il backup di PV e stato.\n- etcd: `etcdctl snapshot\
  \ save/status/restore`, certificati, frequenza, restore su\n  cluster kubeadm vs\
  \ managed (EKS/AKS/GKE non espongono etcd: cosa cambia).\n- Velero: installazione\
  \ (`velero install` + plugin AWS/Azure/GCP/CSI), `Backup`,\n  `Schedule`, `Restore`,\
  \ `BackupStorageLocation`, TTL, hook pre/post (fsfreeze,\n  pg_start_backup), CSI\
  \ snapshot vs file-system backup (Kopia), restore parziale\n  e remapping di namespace/storage\
  \ class.\n- Consistenza applicativa per database su K8s (rimando a db-su-kubernetes\
  \ e backup-pitr).\n- Pattern DR: RPO/RTO, cluster warm/cold standby, restore cross-region,\
  \ test periodico\n  di restore (game day), runbook.\n- Troubleshooting: backup `PartiallyFailed`,\
  \ volumi non snapshottati, restore che\n  lascia PVC in Pending, drift di versione\
  \ API/CRD, secret credenziali BSL.\nEsempi concreti con comandi reali e manifest\
  \ YAML per Schedule e hook.\n"
