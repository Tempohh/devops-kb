description: "L'hub docs/containers/kubernetes/_index.md ha una grid \"Sottosezioni\"\
  \ con\n7 card (Architettura, Workloads, Storage, Scheduling Avanzato, Sicurezza,\n\
  Operators e CRD, Troubleshooting) più una nota separata che linka\nnetworking.md.\
  \ Ma nella cartella esistono altri 4 file completi\n(status: complete, parent: containers/kubernetes/_index)\
  \ che non sono\nraggiungibili né dalla grid né dalla nota né da nessun'altra sezione\n\
  dell'hub:\n  - autoscaling.md (HPA/VPA/KEDA/Cluster Autoscaler)\n  - ingress.md\
  \ (Ingress controller, TLS, routing, canary)\n  - multi-cluster.md (Cluster API,\
  \ Rancher/Fleet, Argo CD multi-cluster)\n  - resource-management.md (QoS, LimitRange,\
  \ ResourceQuota)\nAggiungere 4 card alla grid esistente, seguendo lo stesso formato\
  \ delle\naltre (titolo breve in grassetto, 1 riga di riassunto, link \"→ [Titolo]\n\
  (file.md)\"). Esempio per una card:\n\n-   **Autoscaling**\n\n    HPA, VPA, KEDA,\
  \ Cluster Autoscaler, custom metrics, scale-to-zero.\n\n    → [Autoscaling](autoscaling.md)\n\
  \nRipetere per ingress.md, multi-cluster.md, resource-management.md usando\nil loro\
  \ frontmatter (title, tags, search_keywords) come base per il\nriassunto di una\
  \ riga.\n"
