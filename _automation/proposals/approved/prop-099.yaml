rationale: 'Lettore: chi legge extensions.md per pgvector/TimescaleDB/pg_cron e ha

  bisogno di sapere anche come queste estensioni interagiscono con vacuum

  (es. pg_repack) o pooling (compatibilità pgvector con transaction mode)

  — oggi non trova questi rimandi nel `related` del file, solo tramite il

  file indice.

  '
