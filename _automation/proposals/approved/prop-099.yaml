description: '`docs/databases/postgresql/extensions.md` ha `related: [sql-avanzato/partitioning,

  fondamentali/modelli-dati, nosql/redis]` — nessuna voce verso i tre file

  fratelli nella stessa cartella (`connection-pooling.md`, `mvcc-vacuum.md`,

  `replicazione.md`), pur essendo collegati tutti dallo stesso hub

  `postgresql/_index.md`. Verificato con Glob + lettura diretta dei 4 file:

  nessuno dei tre fratelli linka a `extensions.md` nel proprio `related`,

  e viceversa.

  Aggiungere a `extensions.md`:

  `related: [..., databases/postgresql/mvcc-vacuum, databases/postgresql/connection-pooling]`

  (pg_cron e pg_stat_statements toccano temi di manutenzione/performance

  trattati in mvcc-vacuum; pgvector/TimescaleDB generano dati che finiscono

  dietro connection-pooling in produzione — collegamento tematico reale, non

  solo simmetria formale).

  '
