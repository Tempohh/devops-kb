description: "L'hub `docs/messaging/_index.md` ha una sezione \"Strumenti e Piattaforme\"\
  \ con\nuna sola grid card (Apache Kafka). RabbitMQ è una sezione completa e matura\n\
  (7 file: `_index`, `architettura`, `affidabilita`, `features-avanzate`,\n`clustering-ha`,\
  \ `deployment`, `vs-kafka` — tutti `status: complete`,\n`difficulty: advanced`)\
  \ ma non compare da nessuna parte nell'hub di categoria.\nAggiungere una seconda\
  \ grid card simmetrica a quella di Kafka:\n```markdown\n-   :simple-rabbitmq:{ .lg\
  \ .middle } **RabbitMQ**\n\n    ---\n\n    Message broker AMQP con routing avanzato:\
  \ exchange, binding, task queue,\n    RPC pattern. Smart broker per architetture\
  \ dove il routing è complesso.\n\n    [:octicons-arrow-right-24: Esplora](rabbitmq/_index.md)\n\
  ```\nVerificare che l'icona `:simple-rabbitmq:` sia supportata dal set Material\n\
  configurato (fallback a `:material-message-processing:` se assente).\n"
