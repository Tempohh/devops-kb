rationale: 'Chi legge: un DevOps che apre la categoria "Messaging" dalla nav principale

  del sito per farsi un''idea di cosa la KB copre su messaging. Con la sola

  card Kafka, l''hub comunica (erroneamente) che la KB tratta solo Kafka —

  RabbitMQ è raggiungibile solo se già si conosce lo slug o si naviga la

  sidebar per esteso. È un gap di connettività puro: il contenuto RabbitMQ

  esiste già, denso e completo, ma è invisibile dal punto di ingresso

  naturale della categoria. Correzione a costo minimo (una card), beneficio

  di scoperta immediato.

  '
