# Configurazione del sistema di automazione KB.
# Letta da run_once.py (CI + locale) e dagli script .ps1.

version: 1

# ---------------------------------------------------------------------------
# Policy modello / livello di ragionamento per tipo di task.
#   model  -> passato come `--model` a `claude -p`
#   effort -> intento documentato. Claude Code CLI non espone `--effort` in tutte
#             le versioni: se pass_effort_flag=true run_once.py prova a passarlo,
#             altrimenti resta solo come riferimento.
# ---------------------------------------------------------------------------
pass_effort_flag: false

models:
  new_topic:   { model: claude-sonnet-5,  effort: high }    # file lungo e strutturato, ma templato
  expand:      { model: claude-sonnet-5,  effort: medium }  # additivo, limitato
  audit:       { model: claude-haiku-4-5, effort: low }     # riempi sezione mancante, keyword
  currency:    { model: claude-sonnet-5,  effort: high }    # ricontrollo vs fonti upstream
  consolidate: { model: claude-sonnet-5,  effort: high }    # fusione file + chirurgia link
  review:      { model: claude-opus-5,    effort: high }    # giudizio correttezza/attualita'/valore
  proposal:    { model: claude-opus-5,    effort: high }    # ragionamento sull'intera KB
  default:     { model: claude-sonnet-5,  effort: medium }

# ---------------------------------------------------------------------------
# Freno di saturazione. Il criterio reale di "KB completa" NON e' piu' un numero
# di file: e' l'esaurimento per sottocategoria (coverage.yaml, vedi cascade).
# max_file_count resta solo come tetto di budget opzionale: null = nessun tetto;
# se impostato e raggiunto, la fonte 'exploration' si sospende.
# ---------------------------------------------------------------------------
saturation:
  max_file_count: null
  allow_zero_proposals: true   # proposal-prompt puo' restituire lista vuota con motivazione

# ---------------------------------------------------------------------------
# Cascata next-work (manage-state.py next-work): a coda vuota inietta un batch
# dalla prima fonte non vuota: proposals > lifecycle > gate > review > currency >
# exploration. Batch piccoli = la cascata si rivaluta spesso, cosi' il lavoro
# generato da un batch (es. review -> needs-review) passa davanti al successivo.
# ---------------------------------------------------------------------------
cascade:
  batch_audit: 10              # audit (Haiku): economici, batch piu' grande
  batch_review: 5              # review/lifecycle (Opus): ~5 task tra due rivalutazioni
  batch_currency: 5
  retry_cooldown_days: 30      # stesso (tipo, file) non ritentato prima di N giorni
  max_attempts: 3              # oltre: il file richiede intervento umano, la cascata lo salta
  exhausted_reopen_days: 90    # sottocategoria esaurita riesplorata dopo N giorni (nuove tecnologie)

# ---------------------------------------------------------------------------
# Cadenze (giorni) e dimensioni campione.
# ---------------------------------------------------------------------------
cadence:
  analysis_interval_days: 7
  currency_interval_days: 30
  review_sample_size: 3        # solo init-analysis (manuale); i loop usano cascade.batch_review

# ---------------------------------------------------------------------------
# Focus tematico: i file sotto questi prefissi (relativi a docs/) passano davanti
# nella selezione review/currency. Lista vuota = nessun bias. Rimuovere per tornare
# all'ordine puro per last_verified.
# ---------------------------------------------------------------------------
focus:
  path_prefixes: [docs/networking/, docs/cloud/aws/]

# ---------------------------------------------------------------------------
# Comportamento del loop headless (run_once.py).
# ---------------------------------------------------------------------------
loop:
  auto_approve_proposals: true   # in CI non c'e' un umano: le proposte pendenti vengono approvate
  rate_limit_is_soft: true       # su rate limit esce 0 (il prossimo cron ritenta), task resta pending
