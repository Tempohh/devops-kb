  type: new_topic
  path: docs/ci-cd/tools/circleci.md
  category: ci-cd
  priority: P1
  status: completed
  reason: "Nuovo file per CircleCI, SaaS CI citato nella tabella comparativa di\nci-cd/_index.md (\"Startup, velocità di setup\"\
    ) ma assente come argomento\ndedicato — l'unico file in ci-cd/tools/ è tekton.md, mentre Jenkins ha 6\nfile, GitHub Actions\
