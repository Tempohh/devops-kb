    Struttura: scelta ALB vs NLB vs GWLB (tabella decisionale); target group (instance/ip/lambda/alb),

    health check e deregistration delay; listener rules (path/host/header, weighted forward per canary);

    cross-zone load balancing e relativi costi di data transfer; preservazione client IP e Proxy Protocol v2;

    NLB con Elastic IP e PrivateLink (endpoint service); GWLB con appliance di sicurezza (GENEVE, porta 6081);

    TLS termination, ACM, SNI, policy TLS (ELBSecurityPolicy-TLS13-*); access logs su S3 e metriche CloudWatch

    (TargetResponseTime, HTTPCode_ELB_5XX, UnHealthyHostCount); integrazione con AWS Load Balancer Controller

    su EKS (annotation, target-type ip). Esempi Terraform e comandi `aws elbv2 ...`.

    Troubleshooting: 502/503/504, idle timeout mismatch con keep-alive del backend, target unhealthy, drain lento.

    '
  proposal_id: prop-029
- id: '485'
  type: new_topic
  path: docs/networking/fondamentali/network-troubleshooting.md
  category: networking
  priority: P1
  status: completed
  reason: 'Guida operativa di diagnosi di rete a strati, con metodologia (DNS -> connettivita'' L3 -> porta L4 -> TLS -> L7).

    Contenuto: `dig`/`nslookup` (+trace, +short), `ping`/`mtr` (lettura di loss/latency per hop),

    `ss -tanp`/`ss -s` (stati TCP, SYN-SENT vs CLOSE-WAIT accumulati), `tcpdump` con filtri BPF

    (SYN senza SYN-ACK, retransmission, RST) e lettura in Wireshark, `curl -w` con timing (namelookup/connect/appconnect),

    `openssl s_client`, `conntrack -L`/tabella piena (`nf_conntrack: table full`), MTU/PMTUD blackhole

    (`ping -M do -s`, MSS clamping, ICMP frag-needed bloccato), asimmetria di routing, port exhaustion/ephemeral ports, SNAT.

    Sezione cloud/K8s: `kubectl debug` con nicolaka/netshoot, `tcpdump` in ephemeral container, VPC Flow Logs e

    AWS Reachability Analyzer come complemento. Tabella sintomo -> causa probabile -> comando.

    Esempi di output reali commentati.

    '
  proposal_id: prop-030
