    \ \"init container\" in\n`dev/integrazioni/database-patterns.md`, non il confronto tra tool):\n- Versioned migrations\
    \ (Flyway, golang-migrate) vs declarative/state-based\n  (Atlas, Liquibase in modalità diff)\n- Rollback: quali tool supportano\
