- id: '601'
  type: new_topic
  path: docs/databases/mysql/architettura-replicazione.md
  category: databases
  priority: P1
  status: completed
  reason: "Nuovo sottoargomento `databases/mysql/` (attualmente inesistente — la KB copre\nPostgreSQL in profondità ma zero\
    \ MySQL/MariaDB, pur essendo tra gli RDBMS più\ndiffusi in produzione). Struttura suggerita:\n- Architettura InnoDB: clustered\
    \ index su PK, buffer pool, redo log/undo log\n  (equivalente concettuale del WAL/MVCC di PostgreSQL ma meccanismo diverso\
    \ —\n  confronto esplicito con `postgresql/mvcc-vacuum.md`)\n- Replicazione: binlog (statement/row/mixed based), GTID-based\
    \ replication,\n  semi-sync vs async\n- Alta disponibilità: Group Replication (nativo MySQL 8) vs Galera Cluster\n  (MariaDB/Percona\
    \ XtraDB) — trade-off multi-master vs single-writer\n- Backup: mysqldump (logical) vs Percona XtraBackup (physical, hot\
    \ backup) —\n  confronto con `replicazione-ha/backup-pitr.md` lato Postgres\n- Comandi reali: `SHOW REPLICA STATUS`, `SHOW\
    \ ENGINE INNODB STATUS`,\n  configurazione GTID (`gtid_mode`, `enforce_gtid_consistency`)\nAggiungere `mysql` a `docs/_metadata/taxonomy.yml`\
    \ come sottocategoria di\n`databases` durante la creazione del file.\n"
  proposal_id: prop-058
