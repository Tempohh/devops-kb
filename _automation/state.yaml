    \ `command = plan` (unit test veloce, no risorse reali) e\n  `command = apply` (integration test, provisiona davvero)\n\
    - Blocco `assert` con `condition`/`error_message`, analogo ai `check {}`\n  ma eseguibile fuori da `terraform plan/apply`\
    \ reali\n- Uso di `variables {}` per override per-run e `mock_provider` (v1.7+) per\n  test senza credenziali cloud\n\
    - Comando `terraform test` in CI, confronto con Terratest nella tabella\n  \"Tool Overview\" esistente (aggiungere riga)\n\
