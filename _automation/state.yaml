- id: '502'
  type: new_topic
  path: docs/networking/sicurezza/wireguard.md
  category: networking
  priority: P2
  status: completed
  reason: 'Complemento a vpn-ipsec.md, che non copre WireGuard (solo 4 file lo citano).

    Contenuti: modello crittografico (Noise IK, Curve25519, ChaCha20-Poly1305), cryptokey routing, differenze con IPsec/OpenVPN.

    Config reale: wg0.conf con [Interface]/[Peer], AllowedIPs, Endpoint, PersistentKeepalive, wg genkey/pubkey/genpsk, wg-quick,
    wg show.

    Pattern: hub-and-spoke, site-to-site con routing/forwarding e NAT (sysctl net.ipv4.ip_forward, iptables/nftables),

    full-mesh gestito (Tailscale/Netbird/Headscale, cenni) e uso in Kubernetes (Cilium/Calico encryption WireGuard).

    Deploy su EC2 come alternativa a Site-to-Site VPN AWS: limiti (nessun HA nativo, rotazione chiavi manuale).

    Troubleshooting: handshake assente, MTU 1420 e frammentazione, AllowedIPs sovrapposti, UDP bloccato, NAT timeout.

    '
  proposal_id: prop-034
