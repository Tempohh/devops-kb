- id: '598'
  type: new_topic
  path: docs/iac/pulumi/policy-as-code.md
  category: iac
  priority: P1
  status: completed
  reason: "Documentare CrossGuard, il framework di Policy as Code nativo di Pulumi, che\noggi manca completamente nella KB\
    \ (Terraform ha un intero file dedicato a\ntesting/policy con OPA/Sentinel/checkov, Pulumi zero). Struttura suggerita:\n\
    - Cos'è un Policy Pack (`pulumi policy new aws-typescript`), differenza tra\n  `advisory`, `mandatory` e `remediate` enforcement\
    \ level.\n- Esempio di policy reale in TypeScript/Python: vietare S3 bucket pubblici,\n  forzare tag obbligatori, limitare\
    \ instance type in prod.\n- `pulumi up --policy-pack ./policy-pack` in locale e enforcement centralizzato\n  via Pulumi\
    \ Cloud (organization-wide policy groups, assegnazione per stack).\n- Differenza CrossGuard (Policy as Code, valutata\
    \ durante preview/up, blocca\n  il deploy) vs strumenti di scansione statica post-hoc (checkov/tfsec-style)\n  che Pulumi\
    \ supporta comunque via `pulumi convert`/provider Terraform.\n- CI/CD: far fallire una GitHub Actions pipeline se una\
    \ policy `mandatory`\n  viene violata (exit code diverso da 0 su `pulumi up`).\n- Troubleshooting: policy pack non trovato,\
    \ conflitti tra policy locali e\n  organization policy, falsi positivi su risorse già esistenti (remediate\n  che modifica\
    \ risorse a runtime — rischio da segnalare esplicitamente).\n"
  proposal_id: prop-056
- id: '599'
  type: new_topic
  path: docs/monitoring/tools/continuous-profiling.md
  category: monitoring
  priority: P1
  status: completed
  reason: "Nessun file della KB copre il continuous profiling, spesso citato come \"quarto\npilastro\" accanto a metriche/log/tracce\
    \ (tre-pilastri-osservabilita.md si ferma\na tre) e ormai standard in stack cloud-native moderni (Grafana Pyroscope, CNCF\n\
    Parca, Datadog Continuous Profiler). Struttura suggerita:\n- Perché serve: le tracce dicono \"quale richiesta è lenta\"\
    , il profiling dice\n  \"quale funzione/riga di codice consuma CPU o memoria\", a livello di flame\n  graph, senza dover\
    \ redistribuire un binario instrumentato per il debug.\n- Overhead trascurabile (<1-2% CPU) grazie a sampling statistico\
    \ o eBPF\n  (nessuna modifica al codice applicativo, a differenza di pprof manuale).\n- Setup pratico Grafana Pyroscope:\
    \ agent/eBPF profiler su Kubernetes (DaemonSet),\n  push verso Pyroscope server, query e flame graph in Grafana.\n- Alternativa\
    \ CNCF Parca (agent eBPF, storage columnar, integrazione OTel).\n- OTel Profiling signal (stabilizzato 2025): come si\
    \ integra con lo stack\n  OpenTelemetry già documentato in opentelemetry.md e otel-collector-kubernetes.md.\n- Caso d'uso\
    \ concreto: trovare un memory leak o un hot loop CPU in produzione\n  correlando un picco in Grafana (da Prometheus) con\
    \ il flame graph dello\n  stesso intervallo temporale.\n- Troubleshooting: overhead imprevisto su workload ad alta cardinalità\
    \ di\n  stack, simboli non risolti (debug symbols mancanti nei container), costi di\n  storage dei profili ad alta frequenza.\n"
  proposal_id: prop-057
