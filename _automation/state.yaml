- id: '560'
  type: new_topic
  path: docs/cloud/aws/networking/vpc-lattice.md
  category: cloud
  priority: P2
  status: completed
  reason: "Nuovo file su AWS VPC Lattice, servizio di application networking (GA 2023)\nassente nella KB (grep su tutta docs/\
    \ per \"Lattice\": zero risultati) mentre\nTransit Gateway, PrivateLink e Direct Connect sono già ben coperti in\nvpc-avanzato.md.\
    \ Struttura suggerita:\n- Cos'è: service network, service, target group (Lambda/EC2/ECS/EKS pod),\n  auth policy IAM-based\
    \ a livello di servizio.\n- Differenza pratica da alternative già documentate: quando usare Lattice\n  invece di Transit\
    \ Gateway (no hub-and-spoke L3, routing a livello L7/servizio),\n  invece di PrivateLink (niente Interface Endpoint per\
    \ singolo servizio,\n  service network condiviso tra più VPC/account via Resource Access Manager),\n  invece di un service\
    \ mesh (niente sidecar, gestito da AWS).\n- Configurazione pratica: creare service network, associare VPC, registrare\n\
    \  target group ECS/EKS, applicare auth policy IAM (esempio JSON).\n- Cross-account: condivisione service network via\
    \ AWS RAM, esempio CLI\n  `aws vpc-lattice create-service-network` + `aws ram create-resource-share`.\n- Limiti noti:\
    \ nessun supporto UDP, latenza aggiuntiva vs NLB diretto,\n  quota su numero di service association per service network.\n\
    - Tabella comparativa finale: VPC Peering / Transit Gateway / PrivateLink /\n  VPC Lattice — quando scegliere cosa (colonna\
    \ \"use case\", \"livello OSI\",\n  \"cross-account\").\n"
  proposal_id: prop-036
