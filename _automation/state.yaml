- id: '498'
  type: new_topic
  path: docs/networking/protocolli/bgp.md
  category: networking
  priority: P2
  status: completed
  reason: 'File dedicato a BGP (eBGP/iBGP, ASN privati 64512-65534 e 4-byte, path attributes:

    AS_PATH, LOCAL_PREF, MED, communities), best-path selection ordinata, timers/BFD.

    Sezioni pratiche: sessione eBGP su AWS Direct Connect (private/transit VIF, prepend

    AS_PATH e communities per traffic engineering), Transit Gateway con Site-to-Site VPN

    dinamica, ECMP; Cilium BGP Control Plane e Calico BGP per annunciare Pod CIDR e

    LoadBalancer IP (MetalLB in modalita'' BGP) su bare metal.

    Comandi reali: `vtysh -c "show ip bgp summary"`, `show bgp neighbors`, `birdc show protocols`,

    `cilium bgp peers`, `calicoctl node status`.

    Troubleshooting: sessione bloccata in Active/Idle (ACL su TCP 179, MD5 mismatch, TTL

    multihop), route non annunciate, flapping e route dampening, BGP hijack/leak e RPKI ROV.

    Oggi BGP e'' sparso in cni.md, ddos-protezione.md, vpc-avanzato.md e azure connettivita

    senza una spiegazione unica del protocollo.

    '
  proposal_id: prop-031
- id: '499'
  type: new_topic
  path: docs/cloud/aws/networking/ipv6-dual-stack.md
  category: cloud
  priority: P1
  status: completed
  reason: 'Guida operativa a IPv6 su AWS. Contenuti: VPC IPv6 CIDR (/56 Amazon-provided o BYOIP,

    subnet /64), route `::/0` verso IGW, Egress-only Internet Gateway, security group e NACL

    con regole separate IPv6, dual-stack vs IPv6-only subnet (DNS64 + NAT64 in NAT Gateway).

    Da AWS: dal 1 febbraio 2024 ogni public IPv4 costa 0,005 USD/h, quindi motivazione di

    costo per migrare; Public IPv4 Insights in VPC IPAM.

    EKS: cluster `--ip-family ipv6` (immutabile alla creazione), VPC CNI con prefix

    delegation, Pod IPv6 non-NAT''d, richiede Nitro instances; ALB/NLB dualstack

    (`ip-address-type: dualstack`), Service K8s `ipFamilyPolicy: PreferDualStack`.

    Route 53 record AAAA e alias, CloudFront IPv6, comandi `aws ec2 associate-vpc-cidr-block

    --amazon-provided-ipv6-cidr-block`, `aws ec2 create-egress-only-internet-gateway`.

    Troubleshooting: servizio raggiungibile solo IPv4, target group non IPv6, SG senza ::/0,

    Happy Eyeballs e fallback, servizi AWS senza endpoint dualstack.

    '
  proposal_id: prop-032
