    \ si\nintegra SAST/DAST. Il path corretto è `ci-cd/github-actions/workflow-avanzati`\n(che copre security scanning steps)\
    \ oppure `ci-cd/pipeline` (overview pipeline CI/CD).\n\nCorrezione suggerita:\n```yaml\nrelated:\n  - security/supply-chain/image-scanning\n\
    \  - security/supply-chain/sbom-cosign\n  - security/supply-chain/admission-control\n  - ci-cd/github-actions/workflow-avanzati\
