  status: completed
  reason: "Consul è citato in 14 file della KB (vault.md, mtls-spiffe.md, concetti-base.md,\nenvoy.md, service-mesh/_index.md,\
    \ prometheus.md, zookeeper-kraft.md, opentofu.md,\nfailover-recovery.md, replicazione.md, cassandra.md, entra-id.md, valutazione.md,\n\
