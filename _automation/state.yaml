- id: '699'
  type: new_topic
  path: docs/databases/mysql/connection-pooling-proxysql.md
  category: databases
  priority: P2
  status: completed
  reason: "MySQL usa un modello thread-per-connection (a differenza del process-per-connection\ndi PostgreSQL, ma con costo\
    \ di memoria per-thread comunque significativo sotto\ncarico — ogni connessione tiene buffer di sort/join allocati finché\
    \ aperta).\nA oggi `docs/databases/mysql/` copre solo architettura/replicazione e performance\ntuning; manca completamente\
    \ il layer di pooling/proxy, mentre l'equivalente\nPostgreSQL (`postgresql/connection-pooling.md`, PgBouncer) esiste già.\n\
    Struttura suggerita:\n- Perché serve un pooler: max_connections vs memoria (buffer pool vs per-thread\n  buffers), thread_cache_size,\
    \ costo di connessioni effimere da pool applicativi\n  serverless/Lambda\n- ProxySQL: query routing (regex-based routing\
    \ rule), read/write split su\n  topologia di replicazione (primary + replica), connection multiplexing,\n  query cache,\
    \ query rewrite, failover-aware (integrazione con Orchestrator/\n  Group Replication per detection automatica del primary)\n\
    - Config concreta: esempio `mysql_servers`, `mysql_query_rules`,\n  `mysql_replication_hostgroups` in ProxySQL admin interface\
    \ (porta 6032)\n- Alternative: MaxScale (MariaDB), RDS Proxy per RDS/Aurora MySQL managed\n- Deployment pattern: sidecar\
    \ vs layer centralizzato, HA del proxy stesso\n  (coppia ProxySQL + keepalived/VIP, o ProxySQL Cluster nativo da v2)\n\
    - Troubleshooting: connection storm su riavvio pool, query rule debugging\n  (stats_mysql_query_rules), split-brain tra\
    \ ProxySQL e topologia reale\n"
  proposal_id: prop-123
