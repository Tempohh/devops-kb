- id: '608'
  type: new_topic
  path: docs/iac/crossplane/fondamentali.md
  category: iac
  priority: P1
  status: completed
  reason: "Crossplane è assente dalla KB: la sezione iac/ copre solo Terraform (CLI/HCL,\nagentless), Ansible (config management\
    \ via SSH) e Pulumi (linguaggi reali).\nNessuno dei tre rappresenta il paradigma Kubernetes-native — control loop\ndichiarativo,\
    \ provider come CRD, riconciliazione continua — che Crossplane\nintroduce come \"Terraform-via-Kubernetes-API\".\nSezioni\
    \ da includere:\n- Panoramica: perché esiste (self-service infra via kubectl/GitOps, no CLI\n  esterna, integrazione nativa\
    \ con RBAC e policy K8s), quando NON usarlo\n  (team senza cluster K8s già maturo, o senza bisogno di self-service platform)\n\
    - Concetti chiave: Provider (aws-provider, provider-family), Managed Resource\n  (MR) 1:1 con risorsa cloud, Composite\
    \ Resource (XR) e Composition per\n  aggregare più MR in un'astrazione riusabile, XRD (CompositeResourceDefinition)\n\
    \  per definire lo schema self-service esposto agli sviluppatori\n- Architettura: control loop Kubernetes (reconcile,\
    \ drift correction continua\n  a differenza del plan/apply on-demand di Terraform), confronto esplicito\n  con Terraform\
    \ (stato in etcd vs state file, riconciliazione continua vs\n  on-demand, RBAC K8s nativo vs IAM/backend separato)\n-\
    \ Config & pratica: install via Helm, esempio Provider AWS, esempio Composition\n  che espone un \"Database\" astratto\
    \ (nasconde RDS+security group+subnet),\n  esempio XRD con claim namespaced\n- Best practices: quando preferire Crossplane\
    \ a Terraform (platform engineering,\n  self-service multi-tenant), pattern GitOps (Composition + ArgoCD/Flux)\n- Troubleshooting:\
    \ provider non pronto (CRD non installate), Composition\n  che non converge, permessi RBAC del provider service account\n"
  proposal_id: prop-062
