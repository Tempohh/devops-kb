  path: docs/networking/load-balancing/nginx-haproxy.md
  category: networking
  priority: P1
  status: completed
  reason: 'File operativo su NGINX e HAProxy, oggi citati in 12 file di networking ma senza pagina dedicata.

    Struttura: quando scegliere l''uno o l''altro (NGINX web+reverse proxy, HAProxy LB L4/L7 puro).

    Config NGINX: upstream con least_conn/hash, proxy_pass, proxy_set_header, keepalive verso upstream,

    proxy_read_timeout, buffering, limit_req, TLS termination (ssl_protocols, OCSP stapling), map/split_clients per canary.

    Config HAProxy: frontend/backend, acl, health check (option httpchk, check inter/fall/rise), stick-table,

    mode tcp vs http, PROXY protocol, runtime API (socat su admin socket) e drain di un server.

    Reload senza downtime (nginx -s reload, haproxy -sf / master-worker), logging e metriche (stub_status, stats page, exporter
    Prometheus).

    Troubleshooting: 502/504, upstream keepalive esauriti, "worker_connections are not enough", conntrack, header X-Forwarded-For.

    Collegamenti a algoritmi, layer4-vs-layer7, ha-e-failover, ingress, elastic-load-balancing.

    '
