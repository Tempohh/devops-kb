# Taxonomy — DevOps Knowledge Base
# Riferimento globale per categorie, sottocategorie, tag.
# File consultivo: NON viene processato da MkDocs (escluso via exclude_docs).
# Allineato alla struttura reale di docs/ (11 categorie top-level).

categories:
  cloud:
    label: "Cloud"
    description: "Provider cloud, servizi managed, architetture cloud-native, FinOps"
    subcategories: [aws, azure, gcp, finops]
  containers:
    label: "Containers"
    description: "Container runtime, orchestration (Kubernetes/OpenShift), packaging (Helm/Kustomize), registry"
    subcategories: [docker, kubernetes, openshift, helm, kustomize, container-runtime, registry]
  networking:
    label: "Networking"
    description: "Protocolli, DNS, load balancing, service mesh, API gateway, networking Kubernetes, sicurezza di rete"
    subcategories: [fondamentali, protocolli, load-balancing, service-mesh, api-gateway, kubernetes, sicurezza]
  messaging:
    label: "Messaging"
    description: "Message broker, event streaming, code, pattern asincroni per microservizi"
    subcategories: [kafka, rabbitmq]
  databases:
    label: "Databases"
    description: "RDBMS, NoSQL, SQL avanzato, replica/HA, database su Kubernetes e managed"
    subcategories: [fondamentali, postgresql, nosql, sql-avanzato, replicazione-ha, kubernetes-cloud]
  security:
    label: "Security"
    description: "AuthN/AuthZ, PKI e certificati, secret management, supply chain, runtime security, compliance"
    subcategories: [autenticazione, autorizzazione, pki-certificati, secret-management, supply-chain, runtime, network, compliance]
  ci-cd:
    label: "CI/CD"
    description: "Pipeline, GitOps, strategie di delivery, testing in pipeline, platform engineering"
    subcategories: [jenkins, github-actions, gitlab-ci, gitops, strategie, testing, tools, platform-engineering]
  iac:
    label: "IaC"
    description: "Infrastructure as Code: Terraform/OpenTofu, Pulumi, Ansible"
    subcategories: [terraform, pulumi, ansible]
  monitoring:
    label: "Monitoring & Observability"
    description: "Metriche, log, tracce; Prometheus/Grafana/Loki/Tempo; OpenTelemetry; pratica SRE"
    subcategories: [fondamentali, tools, alerting, sre]
  ai:
    label: "AI"
    description: "LLM e Transformer, famiglie di modelli, agenti, RAG, prompt engineering, MLOps, training"
    subcategories: [fondamentali, modelli, agents, sviluppo, tokens-context, training, mlops]
  dev:
    label: "Sviluppo Microservizi"
    description: "Linguaggi/runtime, resilienza, sicurezza applicativa, API, processi SDLC, integrazioni"
    subcategories: [linguaggi, runtime, resilienza, sicurezza, api, data, integrazioni, processi, testing]

