name: KB maintenance

# Esegue UNA iterazione bounded del loop di manutenzione della KB
# (equivalente headless di KB_Aggiorna_Sicuro.bat) e ripubblica il sito.
#
# Richiede il secret di repo CLAUDE_CODE_OAUTH_TOKEN (da `claude setup-token`).
# Se il secret non e' configurato il job si salta in modo pulito (nessun errore).
#
# Interruttore di pausa: la Actions variable KB_MAINTENANCE_ENABLED.
#   false | 0 | off | no  -> automazione in pausa (dispatch e manuale = no-op pulito)
#   assente o altro        -> attiva (default)
# Toggle (solo owner del repo):
#   gh variable set KB_MAINTENANCE_ENABLED --body false   # pausa
#   gh variable set KB_MAINTENANCE_ENABLED --body true    # riattiva
# Un giro singolo mentre e' in pausa: Run workflow con input force=true.

on:
  # UNICO trigger: workflow_dispatch. Lo scheduling puntuale alle 00/06/12/18
  # ora di Roma e' delegato a uno scheduler ESTERNO (cron-job.org, timezone
  # Europe/Rome) che chiama l'endpoint REST `actions/workflows/.../dispatches`.
  # Il cron nativo di GitHub Actions e' stato RIMOSSO: partiva con 1-4 h di
  # ritardo e lo step Gate scartava sistematicamente ogni run.
  # Setup dello scheduler esterno: _automation/AUTOMATION.md sezione 2.
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Numero massimo di task da processare in questo run"
        default: "1"
        required: false
      force:
        description: "Esegui anche se l'automazione e' in pausa (KB_MAINTENANCE_ENABLED=false)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kb-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate — pausa + secret
        id: gate
        env:
          KB_MAINTENANCE_ENABLED: ${{ vars.KB_MAINTENANCE_ENABLED }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          # Nessun controllo orario: il workflow parte SOLO su workflow_dispatch
          # e lo scheduler esterno lo chiama gia' agli orari giusti (00/06/12/18
          # ora di Roma). Qui restano solo pausa e presenza del secret.

          # --- Interruttore di pausa (Actions variable) -------------------
          # KB_MAINTENANCE_ENABLED = false|0|off|no  -> pausa. Assente o altro
          # valore -> attiva (default). force=true da Run workflow bypassa.
          PAUSED=false
          case "$(printf '%s' "$KB_MAINTENANCE_ENABLED" | tr '[:upper:]' '[:lower:]')" in
            false|0|off|no) PAUSED=true ;;
          esac
          FORCE=false
          [ "$FORCE_INPUT" = "true" ] && FORCE=true
          if [ "$PAUSED" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "::notice title=KB maintenance::Automazione in PAUSA (KB_MAINTENANCE_ENABLED=$KB_MAINTENANCE_ENABLED). Riattiva con: gh variable set KB_MAINTENANCE_ENABLED --body true"
          fi

          # --- Secret -----------------------------------------------------
          HAS_TOKEN=true
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            HAS_TOKEN=false
            echo "::notice title=KB maintenance::CLAUDE_CODE_OAUTH_TOKEN non configurato - run saltato. Aggiungilo in Settings > Secrets per attivare l'automazione."
          fi

          # --- Decisione -------------------------------------------------
          if [ "$HAS_TOKEN" = "true" ] \
             && { [ "$PAUSED" != "true" ] || [ "$FORCE" = "true" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run one maintenance iteration
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          python _automation/run_once.py --max-tasks "${{ github.event.inputs.max_tasks || '1' }}"

      - name: Push and redeploy if run_once.py produced a commit
        if: steps.gate.outputs.enabled == 'true'
        env:
          PYTHONUTF8: "1"
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "run_once.py non ha prodotto commit (coda vuota o rate limit) - niente push/deploy."
            exit 0
          fi
          git push origin HEAD:master
          mkdocs gh-deploy --force --strict
