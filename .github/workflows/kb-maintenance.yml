name: KB maintenance

# Esegue UNA iterazione bounded del loop di manutenzione della KB
# (equivalente headless di KB_Aggiorna_Sicuro.bat) e ripubblica il sito.
#
# Richiede il secret di repo CLAUDE_CODE_OAUTH_TOKEN (da `claude setup-token`).
# Se il secret non e' configurato il job si salta in modo pulito (nessun errore).

on:
  schedule:
    # Obiettivo: esecuzione alle 00:00 / 06:00 / 12:00 / 18:00 ORA DI ROMA,
    # stabile tutto l'anno. Il cron di GitHub Actions e' SEMPRE in UTC e non
    # conosce l'ora legale, quindi servono due righe (offset estivo e invernale);
    # lo step "Gate" piu' sotto tiene solo lo slot che, convertito in ora di
    # Roma, cade davvero su 00/06/12/18 e scarta l'altro.
    - cron: "0 22,4,10,16 * * *"   # = 00/06/12/18 Europe/Rome con ora legale (CEST, UTC+2)
    - cron: "0 23,5,11,17 * * *"   # = 00/06/12/18 Europe/Rome in ora solare (CET, UTC+1)
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Numero massimo di task da processare in questo run"
        default: "1"
        required: false

permissions:
  contents: write

concurrency:
  group: kb-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Gate — secret + finestra oraria (00/06/12/18 Europe/Rome)
        id: gate
        run: |
          # --- Finestra oraria ---------------------------------------------
          # Ci sono due righe cron (offset estate/inverno): qui si tiene solo
          # lo slot che, convertito in ora di Roma, cade su 00/06/12/18.
          # L'altro slot (ora sbagliata) viene scartato. Il trigger manuale
          # (workflow_dispatch) passa sempre, a qualunque ora.
          ROME_HOUR=$(TZ="Europe/Rome" date +%-H)
          IN_WINDOW=false
          case "${{ github.event_name }}" in
            workflow_dispatch) IN_WINDOW=true ;;
            *) case "$ROME_HOUR" in 0|00|6|06|12|18) IN_WINDOW=true ;; esac ;;
          esac
          if [ "$IN_WINDOW" != "true" ]; then
            echo "::notice title=KB maintenance::Slot cron a ora di Roma ${ROME_HOUR}:00 - fuori da 00/06/12/18, run saltato."
          fi

          # --- Secret -----------------------------------------------------
          HAS_TOKEN=true
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            HAS_TOKEN=false
            echo "::notice title=KB maintenance::CLAUDE_CODE_OAUTH_TOKEN non configurato - run saltato. Aggiungilo in Settings > Secrets per attivare l'automazione."
          fi

          if [ "$IN_WINDOW" = "true" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run one maintenance iteration
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PYTHONUTF8: "1"
        run: |
          python _automation/run_once.py --max-tasks "${{ github.event.inputs.max_tasks || '1' }}"

      - name: Push and redeploy if run_once.py produced a commit
        if: steps.gate.outputs.enabled == 'true'
        env:
          PYTHONUTF8: "1"
        run: |
          git fetch origin master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "run_once.py non ha prodotto commit (coda vuota o rate limit) - niente push/deploy."
            exit 0
          fi
          git push origin HEAD:master
          mkdocs gh-deploy --force --strict
